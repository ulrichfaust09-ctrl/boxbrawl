<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Brawlers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Cinzel:wght@600;800&family=Rubik:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0810;
    --bg-panel:#181420;
    --line:#3a2f4a;
    --gold:#e8b04b;
    --gold-bright:#ffd479;
    --marquee:#ff7a5c;
    --teamA:#4fc3d9;
    --teamB:#e35b5b;
    --teamA-glow:rgba(79,195,217,.45);
    --teamB-glow:rgba(227,91,91,.45);
    --text:#e9e2f5;
    --dim:#9184ab;
    --mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -6%, rgba(255,180,110,.10) 0%, transparent 60%),
      radial-gradient(ellipse at 18% 15%, rgba(255,90,120,.07) 0%, transparent 45%),
      radial-gradient(ellipse at 82% 85%, rgba(79,195,217,.06) 0%, transparent 45%),
      radial-gradient(ellipse at 50% -10%, #241a33 0%, var(--bg-deep) 62%);
    color:var(--text);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .marquee{
    display:flex;justify-content:center;gap:9px;margin:0 auto 2px;
    max-width:420px;
  }
  .marquee span{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px 2px rgba(255,212,121,.75);
    animation:bulbFlicker 2.6s ease-in-out infinite;
  }
  .marquee span:nth-child(3n+1){animation-delay:.3s;}
  .marquee span:nth-child(3n+2){animation-delay:.9s;}
  .marquee span:nth-child(4n){animation-delay:1.5s;}
  @keyframes bulbFlicker{
    0%,100%{opacity:1;}
    45%{opacity:.35;box-shadow:0 0 3px 1px rgba(255,212,121,.4);}
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:800;
    letter-spacing:4px;
    font-size:2.35rem;
    margin:0 0 4px 0;
    background:linear-gradient(90deg,var(--gold),#fff2cc,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center;
    filter:drop-shadow(0 0 18px rgba(232,176,75,.35));
  }
  .subtitle{
    text-align:center;color:var(--dim);margin-bottom:16px;font-size:.78rem;letter-spacing:2px;
    text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .subtitle::before,.subtitle::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--line));}
  .subtitle::after{background:linear-gradient(90deg,var(--line),transparent);}
  #app{
    width:min(100vw, 1200px);
    max-width:100vw;
    height:100vh;
    padding:22px;
    display:flex;flex-direction:column;justify-content:center;
  }

  /* ---------- Setup screen ---------- */
  #setup{
    flex:1;
    background:
      radial-gradient(ellipse 520px 300px at 50% 8%, rgba(255,220,170,.14) 0%, transparent 60%),
      linear-gradient(180deg, rgba(11,8,16,.66) 0%, rgba(11,8,16,.48) 45%, rgba(11,8,16,.74) 100%),
      linear-gradient(160deg, #2b1240 0%, #6a1f52 24%, #b8355e 46%, #e35f4f 66%, #f5924a 82%, #ffc25c 100%);
    border:1px solid rgba(232,176,75,.28);
    border-radius:16px;
    padding:26px 30px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display:flex;flex-direction:column;justify-content:flex-start;
    min-height:0;
    overflow:hidden;
    position:relative;
  }
  .pickRow{display:flex;gap:18px;align-items:stretch;justify-content:center;margin-bottom:10px;flex:1;min-height:0;max-height:calc(100vh - 180px);}
  .pickCol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;max-height:100%;}
  .pickLabel{
    font-family:'Cinzel',serif;font-weight:600;text-align:center;
    letter-spacing:2px;font-size:.8rem;margin-bottom:10px;
    text-shadow:0 0 12px currentColor;
  }
  .pickLabel.a{color:var(--teamA);}
  .pickLabel.b{color:var(--teamB);}
  .cardList{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:4px;min-height:0;max-height:100%;
    scrollbar-width:thin;scrollbar-color:rgba(232,176,75,.6) transparent;}
  .modifierBox{
    display:none;margin-top:8px;padding:10px;background:rgba(16,13,23,.88);border:1px solid var(--gold);
    border-radius:10px;flex-shrink:0;max-height:126px;overflow-y:auto;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
  }
  .modifierBox.visible{display:block;}
  .modifierTitle{font-family:var(--mono);font-size:.62rem;color:var(--gold);letter-spacing:2px;margin-bottom:6px;text-align:center;}
  .modifierOption{display:flex;align-items:flex-start;gap:7px;color:var(--dim);font-size:.64rem;line-height:1.25;
    margin:2px 0;padding:5px 6px;border-radius:6px;cursor:pointer;transition:background .12s;}
  .modifierOption:hover{background:rgba(232,176,75,.08);}
  .modifierOption input{accent-color:var(--gold);margin:1px 0 0;flex-shrink:0;}
  .modifierOption b{color:var(--text);font-size:.68rem;}
  .vsWrap{
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    min-width:62px;
  }
  .charCard{
    border:1.5px solid var(--line);
    background:linear-gradient(160deg,#171220,#100d16);
    border-radius:11px;
    padding:8px 10px;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;
    transition:transform .14s ease-out, border-color .14s, box-shadow .14s, background .14s;
    flex-shrink:0;
    min-height:52px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .charCard:hover{transform:translateY(-2px) scale(1.01);border-color:var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.4);}
  .charCard.selA{border-color:var(--teamA);background:linear-gradient(160deg,#123038,#0e2328);box-shadow:0 0 0 1px var(--teamA) inset, 0 0 18px var(--teamA-glow);}
  .charCard.selB{border-color:var(--teamB);background:linear-gradient(160deg,#331616,#280f10);box-shadow:0 0 0 1px var(--teamB) inset, 0 0 18px var(--teamB-glow);}
  .charEmoji{
    font-size:1.35rem;width:36px;height:36px;line-height:36px;text-align:center;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.10), rgba(0,0,0,.25));
    border-radius:50%;border:1px solid rgba(255,255,255,.08);
  }
  .charInfo{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;}
  .charInfo b{display:block;font-size:.8rem;line-height:1.2;text-align:center;letter-spacing:.2px;}
  .charInfo span{display:none;}
  .categoryHeading{color:var(--gold-bright);font-family:var(--mono);font-size:.68rem;letter-spacing:2px;padding:8px 4px 2px;text-align:center;}
  .vs{
    font-family:'Cinzel',serif;font-weight:800;font-size:1.4rem;color:var(--gold);
    align-self:center;padding:0 4px;
    text-shadow:0 0 14px rgba(232,176,75,.5);
  }
  #startBtn{
    width:52px;height:52px;border:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #ffe6a8, var(--gold) 60%, #b8802c 100%);
    color:#241708;cursor:pointer;
    box-shadow:0 6px 18px rgba(232,176,75,.3), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);
    transition:transform .1s, box-shadow .1s, opacity .1s;
    padding:0;flex-shrink:0;
  }
  #startBtn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;animation:none;}
  #startBtn:not(:disabled){animation:bellPulse 2.2s ease-in-out infinite;}
  #startBtn:not(:disabled):hover{transform:translateY(-1px) scale(1.05);box-shadow:0 8px 24px rgba(232,176,75,.5), inset 0 2px 3px rgba(255,255,255,.4);}
  @keyframes bellPulse{
    0%,100%{box-shadow:0 6px 18px rgba(232,176,75,.3), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);}
    50%{box-shadow:0 6px 26px rgba(232,176,75,.65), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);}
  }
  #startBtn::before{
    content:'';
    width:0;height:0;
    border-top:10px solid transparent;border-bottom:10px solid transparent;
    border-left:16px solid #241708;
    margin-left:4px;
  }
  .battleOptions{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;color:var(--dim);font-size:.72rem;letter-spacing:.4px;}
  .battleOptions label{display:flex;align-items:center;gap:6px;text-transform:uppercase;font-size:.66rem;letter-spacing:1px;}
  .battleOptions select{
    background:#14101c;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 9px;
    font-family:var(--mono);font-size:.72rem;cursor:pointer;
    transition:border-color .12s;
  }
  .battleOptions select:hover,.battleOptions select:focus{border-color:var(--gold);outline:none;}

  /* ---------- Arena screen ---------- */
  #arenaScreen{display:none;position:relative;}
  .hpPanel{display:flex;justify-content:space-between;gap:20px;margin-bottom:10px;}
  .hpBox{
    flex:1;background:linear-gradient(160deg,#1c1726,var(--bg-panel));
    border:1px solid var(--line);border-radius:11px;padding:10px 14px;
    position:relative;overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .hpBox::before{content:'';position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--teamA);box-shadow:0 0 12px var(--teamA-glow);}
  .hpBox.right::before{left:auto;right:0;background:var(--teamB);box-shadow:0 0 12px var(--teamB-glow);}
  .hpBox.right{text-align:right;}
  .hpName{font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.4px;}
  .hpBox.right .hpName{justify-content:flex-end;}
  .hpBarOuter{height:13px;border-radius:7px;background:#1a1420;margin-top:7px;overflow:hidden;border:1px solid var(--line);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5);}
  .hpBarInner{height:100%;transition:width .15s ease-out;position:relative;}
  .hpBarInner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);}
  .hpBarInner.a{background:linear-gradient(90deg,#2c8fa3,var(--teamA));box-shadow:0 0 10px var(--teamA-glow);}
  .hpBarInner.b{background:linear-gradient(90deg,var(--teamB),#a33333);box-shadow:0 0 10px var(--teamB-glow);}
  .hpSub{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:5px;letter-spacing:.3px;}

  #canvasWrap{
    position:relative;border-radius:6px;overflow:visible;
    padding:16px 10px;
  }
  #canvasWrap .ringRope{
    position:absolute;left:6px;right:6px;height:9px;z-index:1;pointer-events:none;
    background:
      repeating-linear-gradient(90deg, #d1493f 0 26px, #f4e6c9 26px 52px),
      linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.25));
    background-blend-mode:normal, multiply;
    border-radius:5px;
    box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.3);
  }
  #canvasWrap .ringRope.top{top:0;}
  #canvasWrap .ringRope.bottom{bottom:0;}
  #canvasWrap .turnbuckle{
    position:absolute;width:18px;height:18px;z-index:2;pointer-events:none;
    background:linear-gradient(160deg,#3a2f4a,#181420);
    border:2px solid var(--gold);border-radius:4px;
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  #canvasWrap .turnbuckle.tl{top:2px;left:2px;}
  #canvasWrap .turnbuckle.tr{top:2px;right:2px;}
  #canvasWrap .turnbuckle.bl{bottom:2px;left:2px;}
  #canvasWrap .turnbuckle.br{bottom:2px;right:2px;}
  #canvasInner{
    position:relative;border-radius:10px;overflow:hidden;
    border:2px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.5);
  }
  canvas{display:block;background:
    radial-gradient(ellipse at 50% 38%, #241926 0%, #140c18 55%, #0d0812 100%);
  }
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(8,6,12,.78);backdrop-filter:blur(3px);
    z-index:4;
  }
  #overlay h2{
    font-family:'Cinzel',serif;font-size:2.2rem;margin:0 0 6px;
    color:var(--gold);text-shadow:0 0 10px rgba(232,176,75,.8), 0 0 34px rgba(232,176,75,.4);
    animation:overlayPop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes overlayPop{
    0%{transform:scale(.85);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  #overlay p{color:var(--dim);margin:0 0 18px;font-family:var(--mono);font-size:.8rem;}
  #rematchBtn,#changeBtn{
    font-family:'Rubik',sans-serif;font-weight:600;
    border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:9px 22px;border-radius:8px;cursor:pointer;margin:0 6px;
    transition:background .12s, transform .12s;
  }
  #rematchBtn{background:linear-gradient(180deg,#f0c766,var(--gold));color:#241708;border-color:transparent;}
  #rematchBtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,176,75,.35);}
  #changeBtn:hover{background:rgba(232,176,75,.12);}
  #pauseOverlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(8,6,12,.78);backdrop-filter:blur(3px);
    z-index:2;
  }
  #pauseOverlay h2{
    font-family:'Cinzel',serif;font-size:2rem;margin:0 0 6px;
    color:var(--gold);text-shadow:0 0 20px rgba(232,176,75,.5);
  }
  #pauseOverlay p{color:var(--dim);margin:0 0 18px;}
  #pauseOverlay button{
    font-family:'Rubik',sans-serif;font-weight:600;
    border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:9px 22px;border-radius:8px;cursor:pointer;margin:0 6px;
    transition:background .12s;
  }
  #pauseOverlay button:hover{background:rgba(232,176,75,.12);}

  #log{
    position:absolute;left:820px;top:78px;width:calc(100% - 820px);height:800px;
    margin:0;background:linear-gradient(160deg,#181420,#120e1a);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;overflow-y:auto;
    font-family:var(--mono);font-size:.72rem;color:var(--dim);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(0,0,0,.3);
    scrollbar-width:thin;scrollbar-color:rgba(232,176,75,.5) transparent;
  }
  #log div{padding:3px 0;border-bottom:1px dashed #241d30;}
  #log div:last-child{border-bottom:none;}
  #log .hl{color:var(--gold);}
  #hoverTooltip{
    position:fixed;z-index:50;pointer-events:none;
    max-width:260px;
    background:linear-gradient(160deg,#171220,#0f0c15);border:1px solid var(--gold);border-radius:10px;
    padding:10px 12px;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    opacity:0;transform:translateY(4px);
    transition:opacity .12s ease-out, transform .12s ease-out;
  }
  #hoverTooltip.visible{opacity:1;transform:translateY(0);}
  #hoverTooltip .ttName{font-family:'Cinzel',serif;font-weight:600;color:var(--gold);font-size:.85rem;margin-bottom:4px;}
  #hoverTooltip .ttDesc{color:var(--text);font-size:.72rem;line-height:1.35;}
  #hoverTooltip .ttMods{margin-top:6px;padding-top:6px;border-top:1px dashed #241d30;}
  #hoverTooltip .ttMod{font-size:.66rem;color:var(--dim);line-height:1.3;margin-top:3px;}
  #hoverTooltip .ttMod b{color:var(--text);}

  @media (max-width:850px){
    #log{position:static;width:auto;height:96px;margin-top:12px;}
  }

  /* ---------- PIXEL MODE ---------- */
  *,*::before,*::after{border-radius:0!important;}
  body,button,select,input{font-family:'Silkscreen','Press Start 2P',monospace!important;}
  h1,h2,.pickLabel,.hpName,.modifierTitle,#overlayTitle{font-family:'Press Start 2P',monospace!important;}
  h1{font-size:1.5rem!important;letter-spacing:2px!important;filter:none!important;text-shadow:4px 4px 0 #5a3a10;}
  .charCard,#setup,.modifierBox,button{box-shadow:4px 4px 0 rgba(0,0,0,.6)!important;}
  .charCard:hover{transform:translate(-2px,-2px)!important;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  .charEmoji,.hpName{image-rendering:pixelated;}
  .marquee span{border-radius:0!important;box-shadow:none!important;}
  #speedBar{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 8px;font-size:.75rem;color:var(--dim);}
  #speedBar button{background:#181420;color:var(--text);border:2px solid var(--line);padding:5px 12px;cursor:pointer;font-size:.75rem;}
  #speedBar button.on{border-color:var(--gold);color:var(--gold-bright);}
  #fighterSearch{width:100%;box-sizing:border-box;padding:10px 12px;margin:0 0 10px;background:#181420;color:var(--text);border:2px solid var(--line);font-size:.8rem;outline:none;}
  #fighterSearch:focus{border-color:var(--gold);}
  .squadStatus{font-size:.65rem;color:var(--dim);margin:0 0 6px;min-height:1em;}
  #overlay{overflow-y:auto;justify-content:flex-start!important;padding:16px 12px!important;}
  #overlay h2{font-size:1.1rem!important;margin:4px 0 6px!important;}
  #overlay p{margin:0 0 8px!important;}
  #statsPanel{width:94%;max-width:700px;font-size:.62rem;text-align:left;margin:4px 0 12px;}
  #statsPanel .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;}
  #statsPanel .chip{background:#181420;border:2px solid var(--line);padding:5px 8px;color:var(--text);}
  #statsPanel .chip b{color:var(--gold-bright);}
  #statsPanel .sec{color:var(--gold);margin:10px 0 4px;letter-spacing:1px;}
  #statsPanel table{width:100%;border-collapse:collapse;}
  #statsPanel th{color:var(--dim);font-weight:400;text-align:right;padding:3px 4px;}
  #statsPanel th:first-child,#statsPanel td:first-child{text-align:left;}
  #statsPanel td{padding:5px 4px;text-align:right;border-top:2px solid #241d33;}
  #statsPanel tr.tA td:first-child{border-left:4px solid #6ab0ff;padding-left:6px;}
  #statsPanel tr.tB td:first-child{border-left:4px solid #ff6a6a;padding-left:6px;}
  #statsPanel .bar{display:inline-block;height:8px;vertical-align:middle;margin-right:5px;}
  #statsPanel .tA .bar{background:#6ab0ff;} #statsPanel .tB .bar{background:#ff6a6a;}
  #statsPanel svg{width:100%;height:auto;background:#120f1a;border:2px solid var(--line);}
  #statsPanel .dead{opacity:.55;}
  #killScene{position:absolute;left:0;top:0;width:100%;height:100%;display:none;z-index:9;cursor:pointer;image-rendering:pixelated;image-rendering:crisp-edges;}
  #settingsBtn{background:#181420;color:var(--text);border:2px solid var(--line);padding:10px 14px;cursor:pointer;font-size:.75rem;margin-right:8px;}
  #settingsModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;}
  #settingsModal .panel{background:#14101c;border:3px solid var(--gold);padding:18px;width:min(560px,92vw);box-shadow:6px 6px 0 #000;}
  #settingsModal h3{font-family:'Press Start 2P',monospace;font-size:.9rem;color:var(--gold-bright);margin:0 0 12px;}
  #settingsModal .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px solid #241d33;}
  #settingsModal .row .t{flex:1;font-size:.72rem;color:var(--text);} #settingsModal .row .t small{display:block;color:var(--dim);margin-top:3px;font-size:.62rem;}
  #settingsModal .yn button{background:#181420;color:var(--dim);border:2px solid var(--line);padding:6px 12px;cursor:pointer;font-size:.72rem;margin-left:4px;}
  #settingsModal .yn button.on{color:#14101c;background:var(--gold);border-color:var(--gold-bright);}
  #settingsModal .close{margin-top:12px;width:100%;background:var(--gold);color:#14101c;border:0;padding:10px;cursor:pointer;font-size:.8rem;}
</style>
</head>
<body>
<div id="app">
  <div class="marquee"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <h1>BOX BRAWLERS</h1>
  <div class="subtitle">pick two fighters</div>

  <div id="setup">
    <div class="pickRow">
      <div class="pickCol">
        <div class="pickLabel a">FIGHTER — BLUE CORNER</div>
        <div class="cardList" id="listA"></div>
        <div class="modifierBox" id="modsA"></div>
      </div>
      <div class="vsWrap">
        <div class="vs">VS</div>
        <button id="startBtn" aria-label="Start fight" disabled></button>
      </div>
      <div class="pickCol">
        <div class="pickLabel b">FIGHTER — RED CORNER</div>
        <div class="cardList" id="listB"></div>

  const listA = document.getElementById('listA');

  const settingsModal=document.createElement('div'); settingsModal.id='settingsModal';

  document.body.appendChild(settingsModal);
  function syncSettings(){ settingsModal.querySelectorAll('.yn').forEach(el=>{ const on=!!cfg[el.dataset.k]; el.children[0].classList.toggle('on',on); el.children[1].classList.toggle('on',!on); }); }

      while(card&&!card.classList.contains('categoryHeading')){
        if(card.classList.contains('charCard')&&card.style.display!=='none') hasVisibleCard=true;

  function ready(){
    const md=modeSelect.value;
    if(md==='random') return true;
    if(md==='infinite') return !!selA;
    if(md==='team') return squadA.length>=1 && squadB.length>=1;
    return !!(selA && selB);
  }
  function updateSquadUI(){
    const t=modeSelect.value==='team';
    const f=(sq)=>t?`Pick up to 3 (${sq.length}/3): `+sq.map(e=>DEFS[e.key].emoji).join(' '):(modeSelect.value==='random'?'Teams are drawn at random':(modeSelect.value==='infinite'?(sq===squadB?'👊 Endless henchmen incoming!':'Pick your fighter'):''));

    countASelect.parentElement.style.display=(modeSelect.value==='team'||modeSelect.value==='random')?'none':'';
    countBSelect.parentElement.style.display=(modeSelect.value==='team'||modeSelect.value==='random'||modeSelect.value==='infinite')?'none':'';
  }
  function squadClick(key,side,card){
    if(noTeam.has(key)){ (side==='A'?statusA:statusB).textContent='That fighter can\'t join a squad'; return; }
    const sq=side==='A'?squadA:squadB, cls=side==='A'?'selA':'selB';
    const i=sq.findIndex(e=>e.key===key);
    if(i>=0 && activeKey[side]!==key){ activeKey[side]=key; renderModifiers(key,side,sq[i].mods); }
    else if(i>=0){ sq.splice(i,1); card.classList.remove(cls); activeKey[side]=null; (side==='A'?modsA:modsB).className='modifierBox'; (side==='A'?modsA:modsB).innerHTML=''; }
    else if(sq.length<3){ sq.push({key,mods:{}}); card.classList.add(cls); activeKey[side]=key; renderModifiers(key,side,sq[sq.length-1].mods); }
    updateSquadUI(); startBtn.disabled=!ready();
  }

    document.querySelectorAll('.charCard').forEach(c=>c.classList.remove('selA','selB'));
    modsA.className=modsB.className='modifierBox'; modsA.innerHTML=modsB.innerHTML='';
    updateSquadUI(); startBtn.disabled=!ready();

  // ---------------------------------------------------------------
  // Hover tooltip (hover 0.9s over a fighter to see what it does)
  // ---------------------------------------------------------------
  const tooltipEl = document.getElementById('hoverTooltip');
  let tooltipTimer = null;
  let tooltipShown = false;

  function tooltipHtmlFor(defKey, modifierKeys){
    const d = DEFS[defKey];
    if(!d) return '';
    let html = `<div class="ttName">${d.emoji} ${d.name}</div><div class="ttDesc">${d.desc}</div>`;
    const modEntries = Object.entries(d.modifiers||{});
    if(modEntries.length){
      html += `<div class="ttMods">`;
      for(const [modKey, mod] of modEntries){
        const active = modifierKeys && modifierKeys[modKey];
        html += `<div class="ttMod">${active?'✓ ':''}<b>${mod.name}</b> — ${mod.desc}</div>`;
      }
      html += `</div>`;
    }
    return html;
  }

  function positionTooltip(clientX, clientY){
    const pad = 16;
    const rect = tooltipEl.getBoundingClientRect();
    let left = clientX + pad;
    let top = clientY + pad;
    if(left + rect.width > window.innerWidth - 8) left = clientX - rect.width - pad;
    if(top + rect.height > window.innerHeight - 8) top = clientY - rect.height - pad;
    tooltipEl.style.left = Math.max(8,left)+'px';
    tooltipEl.style.top = Math.max(8,top)+'px';
  }

  function showTooltip(html, clientX, clientY){
    tooltipEl.innerHTML = html;
    tooltipEl.classList.add('visible');
    tooltipShown = true;
    positionTooltip(clientX, clientY);
  }

  function hideTooltip(){
    clearTimeout(tooltipTimer);
    tooltipTimer = null;
    tooltipShown = false;
    tooltipEl.classList.remove('visible');
  }

  function scheduleTooltip(getHtml, clientX, clientY){
    clearTimeout(tooltipTimer);
    tooltipShown = false;
    tooltipTimer = setTimeout(()=>{
      const html = getHtml();
      if(html) showTooltip(html, clientX, clientY);
    }, 900);
  }

  function renderModifiers(key, side, modsObj){
    const panel = side==='A' ? modsA : modsB;
    const selected = modsObj || (side==='A' ? selectedModsA : selectedModsB);
    const modifiers = DEFS[key].modifiers;
    if(!modifiers){
      panel.className = 'modifierBox';
      panel.innerHTML = '';
      return;
    }
    panel.className = 'modifierBox visible';
    panel.innerHTML = `<div class="modifierTitle">MODIFIERS</div>`;
    Object.entries(modifiers).forEach(([modKey, mod])=>{
      const label = document.createElement('label');
      label.className = 'modifierOption';
      label.innerHTML = `<input type="checkbox" data-modifier="${modKey}"><span><b>${mod.name}</b><br>${mod.desc}</span>`;
      const input = label.querySelector('input');
      input.checked = !!selected[modKey];
      input.addEventListener('change', ()=>{ selected[modKey] = input.checked; });
      panel.appendChild(label);
    });
  }

  function buildCard(key, side){
    const d = DEFS[key];
    const card = document.createElement('div');
    card.className = 'charCard';
    card.dataset.name = (d.name+' '+key).toLowerCase();
    card.innerHTML = `<div class="charEmoji">${d.emoji}</div>
      <div class="charInfo"><b>${d.name}</b></div>`;
    let lastMouse = {x:0,y:0};
    card.addEventListener('mousemove', (e)=>{
      lastMouse = {x:e.clientX, y:e.clientY};
      if(tooltipShown) positionTooltip(e.clientX, e.clientY);
    });
    card.addEventListener('mouseenter', (e)=>{
      lastMouse = {x:e.clientX, y:e.clientY};
      const activeMods = side==='A' ? selectedModsA : selectedModsB;
      const isSelected = (side==='A' ? selA : selB) === key;
      scheduleTooltip(()=>tooltipHtmlFor(key, isSelected ? activeMods : null), lastMouse.x, lastMouse.y);
    });
    card.addEventListener('mouseleave', hideTooltip);
    card.addEventListener('click', ()=>{
      if(modeSelect.value==='team'){ squadClick(key,side,card); return; }
      if(modeSelect.value==='random' || (modeSelect.value==='infinite' && side==='B')) return;
      if(side==='A'){
        selA = key;
        selectedModsA = {};
        [...listA.children].forEach(c=>c.classList.remove('selA'));
        card.classList.add('selA');
      } else {
        selB = key;
        selectedModsB = {};
        [...listB.children].forEach(c=>c.classList.remove('selB'));
        card.classList.add('selB');
      }
      renderModifiers(key, side);
      startBtn.disabled = !ready();
    });
    return card;
  }

  const selectableKeys=Object.keys(DEFS).filter(key=>DEFS[key].selectable!==false)
    .sort((a,b)=>(DEFS[a].category||'').localeCompare(DEFS[b].category||'')||DEFS[a].name.localeCompare(DEFS[b].name));
  let displayedCategory='';
  selectableKeys.forEach(key=>{
    const category=DEFS[key].category||'';
    if(category&&category!==displayedCategory){
      for(const list of [listA,listB]){
        const heading=document.createElement('div');
        heading.className='categoryHeading';
        heading.textContent=category.toUpperCase();
        list.appendChild(heading);
      }
    }
    displayedCategory=category;
    listA.appendChild(buildCard(key,'A'));
    listB.appendChild(buildCard(key,'B'));
  });

  // ---------------------------------------------------------------
  // Arena / simulation
  // ---------------------------------------------------------------
  const canvas = document.getElementById('c');
  const screenCtx = canvas.getContext('2d');
  const PIX = 4; // 1 game pixel = 4 screen pixels
  const lo = document.createElement('canvas');
  lo.width = canvas.width/PIX; lo.height = canvas.height/PIX;
  const ctx = lo.getContext('2d');

  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    arenaMouse = {
      x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY,
      clientX:e.clientX, clientY:e.clientY
    };
  });
  canvas.addEventListener('mouseleave', ()=>{
    arenaMouse = null;
    hoveredArenaUnit = null;
    hideTooltip();
  });

  function updateArenaHover(){
    if(!arenaMouse){
      if(hoveredArenaUnit){ hoveredArenaUnit = null; hideTooltip(); }
      return;
    }
    let found = null;
    for(const team of teams){
      for(const u of aliveUnits(team)){
        if(Math.hypot(u.x-arenaMouse.x, u.y-arenaMouse.y) < u.r){ found = u; break; }
      }
      if(found) break;
    }
    if(found !== hoveredArenaUnit){
      hoveredArenaUnit = found;
      hideTooltip();
      if(found){
        const key = found.defKey, mods = found.modifiers;
        scheduleTooltip(()=>tooltipHtmlFor(key, mods), arenaMouse.clientX, arenaMouse.clientY);
      }

      const maxCount = DEFS.henchman.maxCount + (team.modifiers.squadron ? 10 : 0);
      return team.spawnedCount >= maxCount && aliveUnits(team).length===0;
    }
    if(team.defKey==='allinone'){
      // Extremely fragile: the team falls the instant the All-In-One Guy himself dies,
      // even if he spawned a Henchman mob that's still standing.
      const leader = team.units.find(u=>u.id===team.leaderId);
      return !leader || !leader.alive;
    }
    if(team.defKey==='necromancer'){
      const leader = team.units.find(u=>u.id===team.leaderId);
      return !leader || !leader.alive;
    }
    return team.units.length>0 && aliveUnits(team).length===0;

  function angryLostPct(unit){
    // Standard mode: capped 0-100% based on actual HP lost.

  // ---------- slice geometry ----------
  function clipPoly(poly,nx,ny,d,sg){
    const out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length], da=sg*(nx*a[0]+ny*a[1]-d), db=sg*(nx*b[0]+ny*b[1]-d);
      if(da>=0) out.push(a);
      if((da>=0)!==(db>=0)){ const t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); }
    }
    return out;
  }
  function sliceModel(n,baseAng,R){
    const cuts=[];
    for(let i=0;i<n;i++) cuts.push({a:i===0?baseAng:baseAng+(Math.random()*2-1)*1.5+(i%2?0.45:-0.45), d:i===0?0:(Math.random()*2-1)*R*0.55});
    const acc={}, step=R/7;
    for(let x=-R;x<=R;x+=step) for(let y=-R;y<=R;y+=step){
      if(x*x+y*y>R*R) continue;
      let m=0; cuts.forEach((c,i)=>{ if((-Math.sin(c.a))*x+Math.cos(c.a)*y-c.d>=0) m|=(1<<i); });
      const o=acc[m]||(acc[m]={sx:0,sy:0,n:0}); o.sx+=x; o.sy+=y; o.n++;
    }
    const pieces=[];
    for(const k in acc){
      const m=Number(k), o=acc[k]; let poly=[[-2*R,-2*R],[2*R,-2*R],[2*R,2*R],[-2*R,2*R]];
      for(let i=0;i<n&&poly.length;i++) poly=clipPoly(poly,-Math.sin(cuts[i].a),Math.cos(cuts[i].a),cuts[i].d,(m>>i&1)?1:-1);
      if(poly.length<3) continue;
      let cx=o.sx/o.n, cy=o.sy/o.n; const L=Math.hypot(cx,cy);
      let dx,dy; if(L<R*0.12){ const r=Math.random()*6.28; dx=Math.cos(r); dy=Math.sin(r); } else { dx=cx/L; dy=cy/L; }
      pieces.push({poly,dx,dy,rot:(Math.random()-0.5)*1.6,spd:0.7+Math.random()*0.9});
    }
    return {cuts,pieces};
  }
  function drawCutLines(c,model,x,y,R,age,stagger,dur,width,srcX,srcY){
    c.strokeStyle='#fff'; c.lineWidth=width; c.lineCap='round';
    model.cuts.forEach((cu,i)=>{
      const kk=Math.max(0,Math.min(1,(age-i*stagger)/dur)); if(kk<=0) return;
      const dx=Math.cos(cu.a), dy=Math.sin(cu.a), nx=-Math.sin(cu.a), ny=Math.cos(cu.a);
      const mx=x+nx*cu.d, my=y+ny*cu.d, ex=mx+dx*R*1.9, ey=my+dy*R*1.9;
      const sx=(i===0&&srcX!==undefined)?srcX:mx-dx*R*1.9, sy=(i===0&&srcY!==undefined)?srcY:my-dy*R*1.9;
      c.beginPath(); c.moveTo(sx,sy); c.lineTo(sx+(ex-sx)*kk,sy+(ey-sy)*kk); c.stroke();
    });
    c.lineCap='butt';
  }
  function drawPieces(c,model,x,y,R,q,bodyFn){
    for(const p of model.pieces){
      c.save(); c.translate(x+p.dx*q*R*1.7*p.spd,y+p.dy*q*R*1.7*p.spd+q*q*R*2); c.rotate(p.rot*q);
      c.beginPath(); c.arc(0,0,R+4,0,7); c.clip();
      c.beginPath(); p.poly.forEach((pt,i)=>i?c.lineTo(pt[0],pt[1]):c.moveTo(pt[0],pt[1])); c.closePath(); c.clip();
      bodyFn(0,0,1-q);
      c.globalAlpha=(1-q)*0.9; c.strokeStyle='#fff'; c.lineWidth=Math.max(2,R*0.09); c.stroke(); c.globalAlpha=1;
      c.restore();

  function dealDamageCore(attacker, target, dmg, knockDir, noKnockback, forceMult){
    if(!target || !target.alive) return false;
    if(target.invincible) return false;

    if(target.defKey==='knight' && target.knightArmorHits>0){
      const breaksArmor = !hasModifier(target, 'blastProof') || dmg>100;
      if(breaksArmor) target.knightArmorHits--;
      addFloater(target.x,target.y-target.r-18,breaksArmor?'ARMOR BREAK':'BLOCKED','#ffe066');
      if(attacker && attacker.defKey==='exploding' && dmg>=DEFS.exploding.explosionDamage){
        log(`🛡️ Knight Guy blocks the explosion!`, true);
      }
      return false;
    }

    const blocked = target.defKey==='parry' && hasModifier(target, 'blocked');
    const parrySuccess = (target.defKey==='parry' || target.defKey==='allinone') &&
      (blocked ? Math.random()<0.5 : target.parryCd<=0);

    if(blocked && !parrySuccess){

      addFloater(target.x, target.y-target.r-4, `-${Math.round(payback)}`, '#ff8a5b');
      killCheck(target, attacker);
      return true;
    }

    if(target.defKey==='exploding' && !target.bombArmed && target.alive){
      armBomb(target);
    }

    if(parrySuccess){
      if(!blocked) target.parryCd = DEFS.parry.parryCooldown;
      addFloater(target.x, target.y-target.r-16, 'PARRY!', '#ffe066');
      log(`🥋 Parry Guy negates the hit and sends it right back!`, true);

          const reflected = Math.round(dmg);
          attacker.hp -= reflected;
          addFloater(attacker.x, attacker.y-attacker.r-4, `-${reflected}`, '#ff5b5b');
          killCheck(attacker, target);
        }
      }
      if(hasModifier(target, 'successfulParry')){

        addFloater(target.x, target.y-target.r-18, '+25 HP', '#8fffb0');

    let finalDamage = dmg;

      if(skellies.length){
        const each = shared/skellies.length;
        for(const skeleton of skellies){

        }

      }
    }
    if(gameMode==='timed'){

      addFloater(target.x,target.y-target.r-4,`-${Math.round(finalDamage)}`,'#ff8a5b');
      if(attacker && !noKnockback) applyKnockback(attacker,target,knockDir);
      return true;
    }
    target.hp -= finalDamage;
    addFloater(target.x, target.y-target.r-4, `-${Math.round(finalDamage)}`, '#ff8a5b');
    if(attacker && hasModifier(attacker, 'stunlock')){

        if(unit.parryCd>0){ unit.parryCd = Math.max(0, unit.parryCd - dt); }
        if(unit.stunTimer>0) unit.stunTimer = Math.max(0, unit.stunTimer-dt);
        if(unit.passiveDisabled>0) unit.passiveDisabled = Math.max(0, unit.passiveDisabled-dt);
        if(unit.statusResist>0) unit.statusResist = Math.max(0, unit.statusResist-dt);
        if(unit.speedBoostTimer>0) unit.speedBoostTimer = Math.max(0, unit.speedBoostTimer-dt);
        if(unit.scytheDamageBuffT>0) unit.scytheDamageBuffT = Math.max(0,unit.scytheDamageBuffT-dt);
        if(unit.invulnTimer > 0){
          unit.invulnTimer = Math.max(0, unit.invulnTimer - dt);
          if(unit.invulnTimer <= 0) unit.invincible = false;
        }
        if(unit.defKey==='exploding' && unit.bombArmed){
          if(unit.passiveDisabled<=0) unit.bombTimer -= dt;
          if(unit.bombTimer <= 0){
            unit.bombArmed = false;
            unit.bombTriggered = true;
            const explodeTarget = nearestEnemy(unit, otherTeam(team));
            addFloater(unit.x, unit.y-unit.r-12, 'EXPLODE!', '#ff8a5b');
            log(`💥 ${DEFS[unit.defKey].name} detonates!`, true);
            if(explodeTarget && explodeTarget.alive){
              dealDamage(unit, explodeTarget, DEFS.exploding.explosionDamage);
            }
            if(gameMode!=='timed'){
              unit.hp = 0;
              unit.alive = false;
              killCheck(unit, explodeTarget || unit);
            }
          }
        }

        if(unit.defKey==='drunk' && hasModifier(unit, 'hammered') && !unit.hammeredCutscene && !unit.frenzy && unit.hp/unit.maxhp < 0.5){
          unit.hammeredCutscene = true;
          unit.hammeredTimer = 2.2;
          unit.attackDisabled = unit.hammeredTimer;
          log(`🍺 Drunk Guy starts the five-beer cutscene!`, true);
        }
        if(unit.hammeredCutscene){
          unit.hammeredTimer -= dt;
          if(unit.hammeredTimer<=0){
            unit.hammeredCutscene = false;
            unit.frenzy = true;
            log(`🔥 Drunk Guy enters a beer frenzy!`, true);
          }
        }

        // ---- movement ----
        if(unit.defKey==='drunk' || unit.defKey==='allinone'){
          unit.drunkTimer -= dt;
          if(unit.drunkTimer<=0){
            const ang = rand(0,Math.PI*2);
            const spd = rand(70,220);
            unit.vx = Math.cos(ang)*spd;
            unit.vy = Math.sin(ang)*spd;
            unit.drunkTimer = rand(0.25,0.6);
          }
        }
          if(unit.attackDisabled>0) unit.attackDisabled = Math.max(0, unit.attackDisabled-dt);
        let moveFactor = 1;
        if(!((unit.defKey==='football' || unit.defKey==='allinone') && unit.charging)){
          const nearWall = (unit.x-unit.r-BOX.left < NEAR_WALL_DIST) ||
                            (BOX.right-(unit.x+unit.r) < NEAR_WALL_DIST) ||
                            (unit.y-unit.r-BOX.top < NEAR_WALL_DIST) ||
                            (BOX.bottom-(unit.y+unit.r) < NEAR_WALL_DIST);
          let nearUnit = false;
          if(!nearWall){
            for(const other of allAliveNow){
              if(other===unit) continue;
              if(unit.defKey==='ghost' || other.defKey==='ghost') continue;
              if(dist(unit,other)-(unit.r+other.r) < NEAR_UNIT_DIST){ nearUnit=true; break; }
            }
          }
          if(nearWall || nearUnit) moveFactor = NEAR_SPEED_FACTOR;
        }
        if(unit.defKey==='scythe' && unit.scytheKillStacks) moveFactor *= 1+0.025*unit.scytheKillStacks;
        if(unit.defKey==='scythe' && unit.scytheDamageBuffT>0) moveFactor *= 1.25;
        if(unit.defKey==='drunk' && unit.frenzy) moveFactor *= 1.33;
        if(unit.speedBoostTimer>0 && unit.speedBoostAmount) moveFactor *= 1+unit.speedBoostAmount;
        if(unit.speedMultiplier) moveFactor *= unit.speedMultiplier;
        if(unit.refereeSlowStacks) moveFactor *= (1 - 0.1*unit.refereeSlowStacks);
        if(unit.defKey==='barbarian' && hasModifier(unit,'frenzy') && unit.frenzyTimer>0) moveFactor *= 1+0.2*(unit.frenzyStacks||0);
        if(unit.defKey==='fireworks') moveFactor *= 1 + Math.min(unit.fireworkSpeedBoost, 2);
        if(unit.defKey==='detective') moveFactor *= 1 + Math.min(unit.detectiveSpeedBoost, 0.5);
        if(unit.defKey==='blind') moveFactor *= 1 + (unit.blindSpeedBonus||0);
        if(unit.defKey==='gwnn'){
          unit.y = unit.laneY;
          unit.vy = 0;
        }
        if((unit.defKey==='tripleT' || unit.defKey==='allinone') && unit.ascended){
          moveFactor *= DEFS.tripleT.ascendSpeedMult;
        }

        if(unit.stunTimer<=0){
          unit.x += unit.vx*dt*moveFactor;
          if(unit.defKey!=='gwnn') unit.y += unit.vy*dt*moveFactor;
        }

        let bounced=false, wallDirection=null;
        if(unit.x-unit.r < BOX.left){ unit.x=BOX.left+unit.r; unit.vx=Math.abs(unit.vx); bounced=true; wallDirection={x:1,y:0}; }
        if(unit.x+unit.r > BOX.right){ unit.x=BOX.right-unit.r; unit.vx=-Math.abs(unit.vx); bounced=true; wallDirection={x:-1,y:0}; }
        if(unit.y-unit.r < BOX.top){ unit.y=BOX.top+unit.r; unit.vy=Math.abs(unit.vy); bounced=true; wallDirection={x:0,y:1}; }
        if(unit.y+unit.r > BOX.bottom){ unit.y=BOX.bottom-unit.r; unit.vy=-Math.abs(unit.vy); bounced=true; wallDirection={x:0,y:-1}; }
        if(bounced && unit.defKey==='fireworks' && wallDirection){
          const count = hasModifier(unit, 'sparks') ? 2 : 1;
          for(let fireworkIndex=0;fireworkIndex<count;fireworkIndex++){
            projectiles.push({x:unit.x+wallDirection.x*unit.r,y:unit.y+wallDirection.y*unit.r,
              vx:0,vy:0,r:DEFS.fireworks.fireworkR,dmg:DEFS.fireworks.fireworkDamage*(hasModifier(unit,'sparks')?0.3:1),
              team:team.id,owner:unit,kind:'firework',fuse:0.5,launched:false,dir:{...wallDirection},hitUnits:{}});
          }
              log(`🎆 Fireworks Guy plants ${count} firework${count>1?'s':''} on the wall!`, true);
        }
        if(bounced && unit.defKey==='detective' && wallDirection) placeDetectiveTape(unit, wallDirection);
        if(bounced && (unit.defKey==='drunk' || unit.defKey==='allinone')){
          const wobble = rand(-0.6,0.6);
          const cos=Math.cos(wobble), sin=Math.sin(wobble);
          const nvx = unit.vx*cos - unit.vy*sin;
          const nvy = unit.vx*sin + unit.vy*cos;
          unit.vx=nvx; unit.vy=nvy;
        }
        if(bounced && (unit.defKey==='football' || unit.defKey==='allinone') && unit.charging){
          endCharge(unit);
        }
      }
    }

    // ---- collisions between all alive units (any team) ----
    const all = teams.flatMap(t=>aliveUnits(t));
    for(let i=0;i<all.length;i++){
      for(let j=i+1;j<all.length;j++){
        const u1=all[i], u2=all[j];
        const dx=u2.x-u1.x, dy=u2.y-u1.y;
        const d = Math.hypot(dx,dy) || 0.0001;
        const minD = u1.r+u2.r;
        if(d < minD && u1.defKey!=='ghost' && u2.defKey!=='ghost'){
          const nx=dx/d, ny=dy/d;
          const overlap = (minD-d)/2;
          u1.x -= nx*overlap; u1.y -= ny*overlap;
          u2.x += nx*overlap; u2.y += ny*overlap;
          const v1n = u1.vx*nx+u1.vy*ny;
          const v2n = u2.vx*nx+u2.vy*ny;
          u1.vx += (v2n-v1n)*nx; u1.vy += (v2n-v1n)*ny;
          u2.vx += (v1n-v2n)*nx; u2.vy += (v1n-v2n)*ny;
          if(u1.defKey==='blind') u1.blindAlert=true;
          if(u2.defKey==='blind') u2.blindAlert=true;
        }
      }
    }

    // ---- football guy charge contact ----
    for(const team of teams){
      for(const unit of aliveUnits(team)){
        if((unit.defKey==='football' || unit.defKey==='allinone') && unit.charging && unit.chargeTarget && unit.chargeTarget.alive){
          const t = unit.chargeTarget;
          if(dist(unit,t) < unit.r+t.r){
            const dmg = DEFS.football.chargeDamage + (hasModifier(unit, 'tackle') ? unit.hp*0.1 : 0);
            dealDamage(unit, t, dmg);
            if(hasModifier(unit, 'tackle')) applyStun(t, 0.7);
            if(hasModifier(unit, 'nfl')){
              unit.statusResist = 1.3;
              if(t.alive) applyKnockback(unit, t, {x:unit.vx*1.5,y:unit.vy*1.5});
            }
            log(`🏈 Football Guy bulldozes for ${dmg}!`, true);
            endCharge(unit);
          }
        }
      }
    }

    // ---- attacks & specials ----
    for(const team of teams){
      const enemy = otherTeam(team);
      for(const unit of aliveUnits(team)){
        if(unit.defKey==='pocketeer'){
          unit.pocketStealCd-=dt;
          unit.pocketDodgeT=Math.max(0,(unit.pocketDodgeT||0)-dt);
          if(unit.pocketStealCd<=0){
            unit.pocketStealCd=15;
            const enemyTeam=otherTeam(team);
            const candidates=aliveUnits(enemyTeam).filter(e=>DEFS[e.defKey]&&DEFS[e.defKey].selectable!==false&&!['tripleT','allinone'].includes(e.defKey));
            for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
            const count=unit.modifiers.masterRobber?2:1;
            unit.pocketStolen=candidates.slice(0,count).map(source=>({key:source.defKey,modifiers:{...source.modifiers},sourceId:source.id}));
            unit.pocketDamage=0;
            unit.pocketAbilityStates={};
            if(unit.pocketStolen.length){
              if(unit.modifiers.prepared){
                grantMovementSpeed(unit,0.5,3);
                unit.pocketDodgeT=3;
              }
              addFloater(unit.x,unit.y-unit.r-18,`STOLE ${unit.pocketStolen.map(s=>DEFS[s.key].name).join(' + ')}!`,'#ffd479');
              log(`🦝 Pocketeer steals ${unit.pocketStolen.map(s=>DEFS[s.key].name).join(' and ')}!`,true);
            }
          }
        }
        const cooldownDt=dt*(unit.attackSpeedMultiplier||1);
        unit.cdBlacksmith -= cooldownDt;
        unit.cdAngry -= cooldownDt;
        unit.cdHenchman -= cooldownDt;
        unit.cdDrunk -= cooldownDt;
        unit.cdManager -= cooldownDt;
        unit.cdTraffic -= cooldownDt;
        unit.cdPriest -= cooldownDt;
        unit.cdFootball -= cooldownDt;
        unit.cdChess -= cooldownDt;
        unit.cdSentient -= cooldownDt;
        unit.cdTripleT -= cooldownDt;
        unit.cdGwnn -= cooldownDt;
        unit.cdWoman -= cooldownDt;
        unit.cdFireworks -= cooldownDt;
        unit.cdChef -= cooldownDt;
        unit.cdDetective -= cooldownDt;
        unit.cdBlind -= cooldownDt;
        unit.cdKnight -= cooldownDt;
        unit.cdGhost -= cooldownDt;
        unit.cdCamera -= cooldownDt;
        unit.cdTired -= cooldownDt;
        unit.cdBarbarian -= cooldownDt;
        unit.cdBoxing -= cooldownDt;
        unit.cdReferee -= cooldownDt;
        unit.cdGardener -= cooldownDt;
        if(unit.bleedTimer>0){
          unit.bleedTimer -= dt;
          unit.bleedTickTimer -= dt;
          if(unit.bleedTickTimer<=0){
            unit.bleedTickTimer = 0.5;
            dealDamage(null, unit, unit.bleedDps*0.5, null, true);
          }
        }
        if(unit.defKey==='boxing'){
          unit.boxingIdleTimer = (unit.boxingIdleTimer||0) + dt;
          unit.chainTimer = Math.max(0, (unit.chainTimer||0) - dt);
        }
        const wasRecording = unit.cameraRecording>0;
        unit.cameraRecording=Math.max(0,unit.cameraRecording-dt);
        if(wasRecording && unit.cameraRecording<=0 && unit.defKey==='camera' && hasModifier(unit,'photogenic')){
          const enemyTeam = otherTeam(team);
          const angle = unit.cameraRecordAngle||0;
          unit.cameraFlash=0.15;
          for(const victim of aliveUnits(enemyTeam)){
            if(victim.defKey==='blind') continue;
            if(inCone(unit,victim,angle,Math.PI/2,1120)){ dealDamage(unit,victim,DEFS.camera.flashDamage,null,true); applyStun(victim,0.6); }
          }
          log(`📸 Photogenic! Camera Guy fires another flash.`, true);
        }
        unit.cameraFlash=Math.max(0,unit.cameraFlash-dt);
        unit.sleepyTimer=Math.max(0,unit.sleepyTimer-dt);
        unit.sleepTimer=Math.max(0,unit.sleepTimer-dt);
        unit.frenzyTimer=Math.max(0,unit.frenzyTimer-dt);
        if(unit.frenzyTimer<=0) unit.frenzyStacks=0;
        if(unit.swingTimer>0) unit.swingTimer=Math.max(0,unit.swingTimer-dt);
        if(unit.gwnnReloading && unit.cdGwnn<=0) unit.gwnnReloading = false;
        const target = nearestEnemy(unit, enemy);
        const nativeDefKey=unit.defKey, nativeModifiers=unit.modifiers;
        const borrowed=unit.defKey==='pocketeer'?unit.pocketStolen:[];
        const abilityVariants=borrowed&&borrowed.length?borrowed:[null];
        const nativeAbilityState={cd2:unit.cd2,cd3:unit.cd3,cdFactorial:unit.cdFactorial,cdFibonacci:unit.cdFibonacci,
          factorialIndex:unit.factorialIndex,fibonacciA:unit.fibonacciA,fibonacciB:unit.fibonacciB,fibonacciTotal:unit.fibonacciTotal,fibonacciRecent:unit.fibonacciRecent};
        for(const ability of abilityVariants){
          if(borrowed&&borrowed.length&&!unit.pocketStolen.length) break;
          const state=ability?(unit.pocketAbilityStates[ability.sourceId]||(unit.pocketAbilityStates[ability.sourceId]={})):null;
          if(ability){
            unit.defKey=ability.key;
            unit.modifiers=ability.modifiers;
            Object.assign(unit,nativeAbilityState,state);
          }
          const projectileStart=projectiles.length;
          try{
            if(unit.stunTimer>0 || unit.attackDisabled>0 || unit.sleepTimer>0) continue;

        if(unit.defKey==='factorial'&&target){
          if(unit.baseDefKey!=='pocketeer'){
            const angle=Math.atan2(target.y-unit.y,target.x-unit.x);
            unit.vx=Math.cos(angle)*DEFS.factorial.speed;
            unit.vy=Math.sin(angle)*DEFS.factorial.speed;
          }
          unit.cdFactorial-=dt;
          const attackGap=dist(unit,target)-(unit.r+target.r);
          if(unit.cdFactorial<=0&&attackGap<=125){
            let damage=1;
            for(let i=2;i<=Math.min(unit.factorialIndex,19);i++) damage=Math.min(Number.MAX_SAFE_INTEGER,damage*i);
            unit.cdFactorial=hasModifier(unit,'factored')?4:5;
            unit.factorialIndex=Math.min(19,unit.factorialIndex+1);
            dealDamage(unit,target,damage,null,true);
            if(hasModifier(unit,'superFactored')&&target.alive) applyKnockback(unit,target,null,1.5);
            addFloater(target.x,target.y-target.r-16,`${damage} DMG`,'#ffd479');
          }
        }
        if(unit.defKey==='fibonacci'&&target){
          if(unit.baseDefKey!=='pocketeer'){
            const angle=Math.atan2(target.y-unit.y,target.x-unit.x);
            unit.vx=Math.cos(angle)*DEFS.fibonacci.speed;
            unit.vy=Math.sin(angle)*DEFS.fibonacci.speed;
          }
          unit.cdFibonacci-=dt;
          const attackGap=dist(unit,target)-(unit.r+target.r);
          if(unit.cdFibonacci<=0&&attackGap<=110){
            let damage;
            if(hasModifier(unit,'fibonacciSquared')){
              damage=unit.fibonacciTotal||1;
            } else {
              damage=unit.fibonacciA;
              const next=Math.min(Number.MAX_SAFE_INTEGER,unit.fibonacciA+unit.fibonacciB);
              unit.fibonacciA=unit.fibonacciB;
              unit.fibonacciB=next;
            }
            unit.fibonacciTotal=Math.min(Number.MAX_SAFE_INTEGER,unit.fibonacciTotal+damage);
            unit.fibonacciRecent.push(damage);
            unit.fibonacciRecent=unit.fibonacciRecent.slice(-8);
            unit.cdFibonacci=1;
            if(dealDamage(unit,target,damage,null,true)&&hasModifier(unit,'fibbonacied')){
              const sequence=unit.fibonacciRecent;
              const values=Array.from({length:8},(_,i)=>sequence[i-(8-sequence.length)]||1);
              for(let i=0;i<8;i++){
                const projectileAngle=i*Math.PI/4;
                projectiles.push({x:target.x+Math.cos(projectileAngle)*(target.r+20),y:target.y+Math.sin(projectileAngle)*(target.r+20),
                  vx:Math.cos(projectileAngle)*360,vy:Math.sin(projectileAngle)*360,r:9,dmg:values[i],team:unit.team,owner:unit,kind:'pix',emoji:'🔢'});
              }
            }
          }
        }

        if(unit.defKey==='ghost'){
          const inside=target && dist(unit,target)<target.r;
          unit.ghostInside=!!inside;
          unit.invincible=!!inside;
          if(inside && unit.cdGhost<=0){
            unit.cdGhost=DEFS.ghost.ghostInterval;
            const damage=DEFS.ghost.ghostDamage+(hasModifier(unit,'nightmare')?unit.nightmareBonus:0);
            dealDamage(unit,target,damage,null,true);
            const prevTotal = unit.ghostDamageTotal||0;
            unit.ghostDamageTotal = prevTotal + damage;
            if(hasModifier(unit,'nightmare')){
              const prevTier = Math.floor(prevTotal/100);
              const newTier = Math.floor(unit.ghostDamageTotal/100);
              if(newTier>prevTier) unit.nightmareBonus += 20*(newTier-prevTier);
            }
            if(hasModifier(unit,'fear')){
              const prevTier = Math.floor(prevTotal/200);
              const newTier = Math.floor(unit.ghostDamageTotal/200);
              if(newTier>prevTier){
                grantMovementSpeed(unit,0.15,1); grantMovementSpeed(target,0.15,1);
              }
            }
            log(`👻 Ghost Guy attacks from inside!`, true);
          }
        }

        if(unit.defKey==='camera' && target && unit.cdCamera<=0){
          unit.cdCamera=DEFS.camera.cameraInterval;
          const angle=Math.atan2(target.y-unit.y,target.x-unit.x);
          unit.cameraFlash=0.15;
          for(const victim of aliveUnits(enemy)){
            if(victim.defKey==='blind') continue;
            if(inCone(unit,victim,angle,Math.PI/2,1120)){ dealDamage(unit,victim,DEFS.camera.flashDamage,null,true); applyStun(victim,0.6); }
          }
          unit.cameraRecording=2;
          unit.cameraRecordAngle=angle;
          log(`📸 Camera Guy flashes a wide shot!`, true);
        }
        if(unit.defKey==='camera' && unit.cameraRecording>0){
          // partial tracking: the cone slowly pans toward the target while
          // recording instead of staying frozen at the flash angle (and instead
          // of instantly snapping to full lock-on).
          if(target){
            const desiredAngle = Math.atan2(target.y-unit.y, target.x-unit.x);
            const turnRate = 1.2; // radians/sec
            let diff = desiredAngle - unit.cameraRecordAngle;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            unit.cameraRecordAngle += clamp(diff, -turnRate*dt, turnRate*dt);
          }
          unit.cameraTick-=dt;
          if(unit.cameraTick>0) continue;
          unit.cameraTick=0.5;
          const recordProgress = clamp(unit.cameraRecording/2, 0, 1);
          const shrinkWidth = (Math.PI/3)*recordProgress;
          const shrinkLength = 720;
          for(const victim of aliveUnits(enemy)){
            if(inCone(unit,victim,unit.cameraRecordAngle,shrinkWidth,shrinkLength)){ dealDamage(unit,victim,DEFS.camera.recordDamage,null,true); if(hasModifier(unit,'smile')) applyStun(victim,0.175); }
          }
        }

        if(unit.defKey==='tired' && target && unit.cdTired<=0){
          unit.cdTired=DEFS.tired.zzzInterval;
          const count=DEFS.tired.zzzCount+(hasModifier(unit,'snoring')?1:0);
          for(let z=0;z<count;z++){
            const dx=target.x-unit.x,dy=target.y-unit.y,len=Math.hypot(dx,dy)||1;
            projectiles.push({x:unit.x,y:unit.y,vx:dx/len*DEFS.tired.zzzSpeed,vy:dy/len*DEFS.tired.zzzSpeed,r:12,dmg:DEFS.tired.zzzDamage+(hasModifier(unit,'snoring')?10:0),team:team.id,owner:unit,kind:'zzz'});
          }
        }

        // ---- batch 2 heroes ----
        if(unit.hideTimer>0){ unit.hideTimer-=dt; if(unit.hideTimer<=0){ unit.hideTimer=0; addFloater(unit.x,unit.y-unit.r,'POOF!','#fff'); } }
        const heal2=(h)=>{ unit.hp=Math.min(unit.maxhp,unit.hp+h); addFloater(unit.x,unit.y-unit.r-12,'+'+Math.round(h)+' HP','#8fffb0'); };
        const shoot2=(em,dmg,spd,rad,fx)=>{
          const a=Math.atan2(target.y-unit.y,target.x-unit.x);
          projectiles.push({x:unit.x,y:unit.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:rad,dmg,team:team.id,owner:unit,kind:'pix',emoji:em,fx});
        };
        if(target && !(unit.hideTimer>0)){
          const k=unit.defKey, nd=DEFS[k];
          if(['vampire','frog','alien','magician','timeguy','magnet'].includes(k)){
            unit.cd2=(unit.cd2===undefined?Math.random()*nd.fireRate:unit.cd2)-dt;
            if(k==='vampire'){ const a=Math.atan2(target.y-unit.y,target.x-unit.x), sp=Math.hypot(unit.vx,unit.vy)||nd.speed; unit.vx=Math.cos(a)*sp; unit.vy=Math.sin(a)*sp; }
            if(k==='vampire' && unit.cd2<=0 && dist(unit,target)-(unit.r+target.r)<=nd.meleeRange){
              unit.cd2=nd.fireRate;
              const dealt=dealDamage(unit,target,nd.damage,null,true);
              if(dealt) heal2(nd.damage*(hasModifier(unit,'bloodthirst')?1:0.5));
            }
            if(k==='vampire' && hasModifier(unit,'batForm') && !unit.batUsed && unit.hp<unit.maxhp*0.4){
              unit.batUsed=true; unit.hideTimer=2; unit.invincible=true; unit.invulnTimer=2;
              addFloater(unit.x,unit.y-unit.r,'🦇','#fff');
            }
            if(k==='frog' && unit.cd2<=0){
              unit.cd2=nd.fireRate;
              const a=Math.atan2(unit.y-target.y,unit.x-target.x), pull=Math.max(0,dist(unit,target)-unit.r-target.r-10);
              target.x+=Math.cos(a)*pull; target.y+=Math.sin(a)*pull;
              dealDamage(unit,target,hasModifier(unit,'longTongue')?150:100,null,true);
              if(hasModifier(unit,'sticky')) applyStun(target,0.6);
              log('🐸 Frog Guy yanks his foe in!',true);
            }
            if(k==='alien' && unit.cd2<=0){
              unit.cd2=nd.fireRate;
              applyStun(target,1);
              dealDamage(unit,target,nd.damage+(hasModifier(unit,'probe')?100:0),null,true);
              if(hasModifier(unit,'warp')){ target.x=rand(BOX.left+80,BOX.right-80); target.y=rand(BOX.top+80,BOX.bottom-80); }
