<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guy Fights</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Cinzel:wght@600;800&family=Rubik:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0810;
    --bg-panel:#181420;
    --line:#3a2f4a;
    --gold:#e8b04b;
    --gold-bright:#ffd479;
    --marquee:#ff7a5c;
    --teamA:#4fc3d9;
    --teamB:#e35b5b;
    --teamA-glow:rgba(79,195,217,.45);
    --teamB-glow:rgba(227,91,91,.45);
    --text:#e9e2f5;
    --dim:#9184ab;
    --mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -6%, rgba(255,180,110,.10) 0%, transparent 60%),
      radial-gradient(ellipse at 18% 15%, rgba(255,90,120,.07) 0%, transparent 45%),
      radial-gradient(ellipse at 82% 85%, rgba(79,195,217,.06) 0%, transparent 45%),
      radial-gradient(ellipse at 50% -10%, #241a33 0%, var(--bg-deep) 62%);
    color:var(--text);
    font-family:'Rubik',sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .marquee{
    display:flex;justify-content:center;gap:9px;margin:0 auto 2px;
    max-width:420px;
  }
  .marquee span{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px 2px rgba(255,212,121,.75);
    animation:bulbFlicker 2.6s ease-in-out infinite;
  }
  .marquee span:nth-child(3n+1){animation-delay:.3s;}
  .marquee span:nth-child(3n+2){animation-delay:.9s;}
  .marquee span:nth-child(4n){animation-delay:1.5s;}
  @keyframes bulbFlicker{
    0%,100%{opacity:1;}
    45%{opacity:.35;box-shadow:0 0 3px 1px rgba(255,212,121,.4);}
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:800;
    letter-spacing:4px;
    font-size:2.35rem;
    margin:0 0 4px 0;
    background:linear-gradient(90deg,var(--gold),#fff2cc,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center;
    filter:drop-shadow(0 0 18px rgba(232,176,75,.35));
  }
  .subtitle{
    text-align:center;color:var(--dim);margin-bottom:16px;font-size:.78rem;letter-spacing:2px;
    text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .subtitle::before,.subtitle::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--line));}
  .subtitle::after{background:linear-gradient(90deg,var(--line),transparent);}
  #app{
    width:min(100vw, 1200px);
    max-width:100vw;
    height:100vh;
    padding:22px;
    display:flex;flex-direction:column;justify-content:center;
  }

  /* ---------- Setup screen ---------- */
  #setup{
    flex:1;
    background:
      radial-gradient(ellipse 520px 300px at 50% 8%, rgba(255,220,170,.14) 0%, transparent 60%),
      linear-gradient(180deg, rgba(11,8,16,.66) 0%, rgba(11,8,16,.48) 45%, rgba(11,8,16,.74) 100%),
      linear-gradient(160deg, #2b1240 0%, #6a1f52 24%, #b8355e 46%, #e35f4f 66%, #f5924a 82%, #ffc25c 100%);
    border:1px solid rgba(232,176,75,.28);
    border-radius:16px;
    padding:26px 30px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    display:flex;flex-direction:column;justify-content:flex-start;
    min-height:0;
    overflow:hidden;
    position:relative;
  }
  .pickRow{display:flex;gap:18px;align-items:stretch;justify-content:center;margin-bottom:10px;flex:1;min-height:0;max-height:calc(100vh - 180px);}
  .pickCol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;max-height:100%;}
  .pickLabel{
    font-family:'Cinzel',serif;font-weight:600;text-align:center;
    letter-spacing:2px;font-size:.8rem;margin-bottom:10px;
    text-shadow:0 0 12px currentColor;
  }
  .pickLabel.a{color:var(--teamA);}
  .pickLabel.b{color:var(--teamB);}
  .cardList{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:4px;min-height:0;max-height:100%;
    scrollbar-width:thin;scrollbar-color:rgba(232,176,75,.6) transparent;}
  .modifierBox{
    display:none;margin-top:8px;padding:10px;background:rgba(16,13,23,.88);border:1px solid var(--gold);
    border-radius:10px;flex-shrink:0;max-height:126px;overflow-y:auto;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
  }
  .modifierBox.visible{display:block;}
  .modifierTitle{font-family:var(--mono);font-size:.62rem;color:var(--gold);letter-spacing:2px;margin-bottom:6px;text-align:center;}
  .modifierOption{display:flex;align-items:flex-start;gap:7px;color:var(--dim);font-size:.64rem;line-height:1.25;
    margin:2px 0;padding:5px 6px;border-radius:6px;cursor:pointer;transition:background .12s;}
  .modifierOption:hover{background:rgba(232,176,75,.08);}
  .modifierOption input{accent-color:var(--gold);margin:1px 0 0;flex-shrink:0;}
  .modifierOption b{color:var(--text);font-size:.68rem;}
  .vsWrap{
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    min-width:62px;
  }
  .charCard{
    border:1.5px solid var(--line);
    background:linear-gradient(160deg,#171220,#100d16);
    border-radius:11px;
    padding:8px 10px;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;
    transition:transform .14s ease-out, border-color .14s, box-shadow .14s, background .14s;
    flex-shrink:0;
    min-height:52px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .charCard:hover{transform:translateY(-2px) scale(1.01);border-color:var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.4);}
  .charCard.selA{border-color:var(--teamA);background:linear-gradient(160deg,#123038,#0e2328);box-shadow:0 0 0 1px var(--teamA) inset, 0 0 18px var(--teamA-glow);}
  .charCard.selB{border-color:var(--teamB);background:linear-gradient(160deg,#331616,#280f10);box-shadow:0 0 0 1px var(--teamB) inset, 0 0 18px var(--teamB-glow);}
  .charEmoji{
    font-size:1.35rem;width:36px;height:36px;line-height:36px;text-align:center;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.10), rgba(0,0,0,.25));
    border-radius:50%;border:1px solid rgba(255,255,255,.08);
  }
  .charInfo{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;}
  .charInfo b{display:block;font-size:.8rem;line-height:1.2;text-align:center;letter-spacing:.2px;}
  .charInfo span{display:none;}
  .categoryHeading{color:var(--gold-bright);font-family:var(--mono);font-size:.68rem;letter-spacing:2px;padding:8px 4px 2px;text-align:center;}
  .vs{
    font-family:'Cinzel',serif;font-weight:800;font-size:1.4rem;color:var(--gold);
    align-self:center;padding:0 4px;
    text-shadow:0 0 14px rgba(232,176,75,.5);
  }
  #startBtn{
    width:52px;height:52px;border:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #ffe6a8, var(--gold) 60%, #b8802c 100%);
    color:#241708;cursor:pointer;
    box-shadow:0 6px 18px rgba(232,176,75,.3), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);
    transition:transform .1s, box-shadow .1s, opacity .1s;
    padding:0;flex-shrink:0;
  }
  #startBtn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;animation:none;}
  #startBtn:not(:disabled){animation:bellPulse 2.2s ease-in-out infinite;}
  #startBtn:not(:disabled):hover{transform:translateY(-1px) scale(1.05);box-shadow:0 8px 24px rgba(232,176,75,.5), inset 0 2px 3px rgba(255,255,255,.4);}
  @keyframes bellPulse{
    0%,100%{box-shadow:0 6px 18px rgba(232,176,75,.3), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);}
    50%{box-shadow:0 6px 26px rgba(232,176,75,.65), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.25);}
  }
  #startBtn::before{
    content:'';
    width:0;height:0;
    border-top:10px solid transparent;border-bottom:10px solid transparent;
    border-left:16px solid #241708;
    margin-left:4px;
  }
  .battleOptions{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;color:var(--dim);font-size:.72rem;letter-spacing:.4px;}
  .battleOptions label{display:flex;align-items:center;gap:6px;text-transform:uppercase;font-size:.66rem;letter-spacing:1px;}
  .battleOptions select{
    background:#14101c;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 9px;
    font-family:var(--mono);font-size:.72rem;cursor:pointer;
    transition:border-color .12s;
  }
  .battleOptions select:hover,.battleOptions select:focus{border-color:var(--gold);outline:none;}

  /* ---------- Arena screen ---------- */
  #arenaScreen{display:none;position:relative;}
  .hpPanel{display:flex;justify-content:space-between;gap:20px;margin-bottom:10px;}
  .hpBox{
    flex:1;background:linear-gradient(160deg,#1c1726,var(--bg-panel));
    border:1px solid var(--line);border-radius:11px;padding:10px 14px;
    position:relative;overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .hpBox::before{content:'';position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--teamA);box-shadow:0 0 12px var(--teamA-glow);}
  .hpBox.right::before{left:auto;right:0;background:var(--teamB);box-shadow:0 0 12px var(--teamB-glow);}
  .hpBox.right{text-align:right;}
  .hpName{font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.4px;}
  .hpBox.right .hpName{justify-content:flex-end;}
  .hpBarOuter{height:13px;border-radius:7px;background:#1a1420;margin-top:7px;overflow:hidden;border:1px solid var(--line);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5);}
  .hpBarInner{height:100%;transition:width .15s ease-out;position:relative;}
  .hpBarInner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);}
  .hpBarInner.a{background:linear-gradient(90deg,#2c8fa3,var(--teamA));box-shadow:0 0 10px var(--teamA-glow);}
  .hpBarInner.b{background:linear-gradient(90deg,var(--teamB),#a33333);box-shadow:0 0 10px var(--teamB-glow);}
  .hpSub{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:5px;letter-spacing:.3px;}

  #canvasWrap{
    position:relative;border-radius:6px;overflow:visible;
    padding:16px 10px;
  }
  #canvasWrap .ringRope{
    position:absolute;left:6px;right:6px;height:9px;z-index:1;pointer-events:none;
    background:
      repeating-linear-gradient(90deg, #d1493f 0 26px, #f4e6c9 26px 52px),
      linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.25));
    background-blend-mode:normal, multiply;
    border-radius:5px;
    box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.3);
  }
  #canvasWrap .ringRope.top{top:0;}
  #canvasWrap .ringRope.bottom{bottom:0;}
  #canvasWrap .turnbuckle{
    position:absolute;width:18px;height:18px;z-index:2;pointer-events:none;
    background:linear-gradient(160deg,#3a2f4a,#181420);
    border:2px solid var(--gold);border-radius:4px;
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  #canvasWrap .turnbuckle.tl{top:2px;left:2px;}
  #canvasWrap .turnbuckle.tr{top:2px;right:2px;}
  #canvasWrap .turnbuckle.bl{bottom:2px;left:2px;}
  #canvasWrap .turnbuckle.br{bottom:2px;right:2px;}
  #canvasInner{
    position:relative;border-radius:10px;overflow:hidden;
    border:2px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.5);
  }
  #weatherHeadline{
    position:absolute;left:10px;right:10px;bottom:18px;z-index:3;display:none;
    color:#fff7bf;text-align:center;font-family:'Press Start 2P',monospace;
    font-size:clamp(.48rem,1.8vw,.78rem);line-height:1.7;
    text-shadow:2px 2px 0 #241421,0 0 12px rgba(255,190,70,.9);
    pointer-events:none;
  }
  canvas{display:block;background:
    radial-gradient(ellipse at 50% 38%, #241926 0%, #140c18 55%, #0d0812 100%);
  }
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(8,6,12,.78);backdrop-filter:blur(3px);
    z-index:4;
  }
  #overlay h2{
    font-family:'Cinzel',serif;font-size:2.2rem;margin:0 0 6px;
    color:var(--gold);text-shadow:0 0 10px rgba(232,176,75,.8), 0 0 34px rgba(232,176,75,.4);
    animation:overlayPop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes overlayPop{
    0%{transform:scale(.85);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  #overlay p{color:var(--dim);margin:0 0 18px;font-family:var(--mono);font-size:.8rem;}
  #rematchBtn,#changeBtn{
    font-family:'Rubik',sans-serif;font-weight:600;
    border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:9px 22px;border-radius:8px;cursor:pointer;margin:0 6px;
    transition:background .12s, transform .12s;
  }
  #rematchBtn{background:linear-gradient(180deg,#f0c766,var(--gold));color:#241708;border-color:transparent;}
  #rematchBtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,176,75,.35);}
  #changeBtn:hover{background:rgba(232,176,75,.12);}
  #pauseOverlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:rgba(8,6,12,.78);backdrop-filter:blur(3px);
    z-index:2;
  }
  #pauseOverlay h2{
    font-family:'Cinzel',serif;font-size:2rem;margin:0 0 6px;
    color:var(--gold);text-shadow:0 0 20px rgba(232,176,75,.5);
  }
  #pauseOverlay p{color:var(--dim);margin:0 0 18px;}
  #pauseOverlay button{
    font-family:'Rubik',sans-serif;font-weight:600;
    border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:9px 22px;border-radius:8px;cursor:pointer;margin:0 6px;
    transition:background .12s;
  }
  #pauseOverlay button:hover{background:rgba(232,176,75,.12);}

  #log{
    position:absolute;left:820px;top:78px;width:calc(100% - 820px);height:800px;
    margin:0;background:linear-gradient(160deg,#181420,#120e1a);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;overflow-y:auto;
    font-family:var(--mono);font-size:.72rem;color:var(--dim);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(0,0,0,.3);
    scrollbar-width:thin;scrollbar-color:rgba(232,176,75,.5) transparent;
  }
  #log div{padding:3px 0;border-bottom:1px dashed #241d30;}
  #log div:last-child{border-bottom:none;}
  #log .hl{color:var(--gold);}
  #hoverTooltip{
    position:fixed;z-index:50;pointer-events:none;
    max-width:260px;
    background:linear-gradient(160deg,#171220,#0f0c15);border:1px solid var(--gold);border-radius:10px;
    padding:10px 12px;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    opacity:0;transform:translateY(4px);
    transition:opacity .12s ease-out, transform .12s ease-out;
  }
  #hoverTooltip.visible{opacity:1;transform:translateY(0);}
  #hoverTooltip .ttName{font-family:'Cinzel',serif;font-weight:600;color:var(--gold);font-size:.85rem;margin-bottom:4px;}
  #hoverTooltip .ttDesc{color:var(--text);font-size:.72rem;line-height:1.35;}
  #hoverTooltip .ttMods{margin-top:6px;padding-top:6px;border-top:1px dashed #241d30;}
  #hoverTooltip .ttMod{font-size:.66rem;color:var(--dim);line-height:1.3;margin-top:3px;}
  #hoverTooltip .ttMod b{color:var(--text);}

  @media (max-width:850px){
    #log{position:static;width:auto;height:96px;margin-top:12px;}
  }

  /* ---------- PIXEL MODE ---------- */
  *,*::before,*::after{border-radius:0!important;}
  body,button,select,input{font-family:'Silkscreen','Press Start 2P',monospace!important;}
  h1,h2,.pickLabel,.hpName,.modifierTitle,#overlayTitle{font-family:'Press Start 2P',monospace!important;}
  h1{font-size:1.5rem!important;letter-spacing:2px!important;filter:none!important;text-shadow:4px 4px 0 #5a3a10;}
  .charCard,#setup,.modifierBox,button{box-shadow:4px 4px 0 rgba(0,0,0,.6)!important;}
  .charCard:hover{transform:translate(-2px,-2px)!important;}
  canvas{image-rendering:auto;}
  .charEmoji,.hpName{image-rendering:pixelated;}
  .marquee span{border-radius:0!important;box-shadow:none!important;}
  #speedBar{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 8px;font-size:.75rem;color:var(--dim);}
  #speedBar button{background:#181420;color:var(--text);border:2px solid var(--line);padding:5px 12px;cursor:pointer;font-size:.75rem;}
  #speedBar button.on{border-color:var(--gold);color:var(--gold-bright);}
  #fighterSearch{width:100%;box-sizing:border-box;padding:10px 12px;margin:0 0 10px;background:#181420;color:var(--text);border:2px solid var(--line);font-size:.8rem;outline:none;}
  #fighterSearch:focus{border-color:var(--gold);}
  .squadStatus{font-size:.65rem;color:var(--dim);margin:0 0 6px;min-height:1em;}
  #overlay{overflow-y:auto;justify-content:flex-start!important;padding:16px 12px!important;}
  #overlay h2{font-size:1.1rem!important;margin:4px 0 6px!important;}
  #overlay p{margin:0 0 8px!important;}
  #statsPanel{width:94%;max-width:700px;font-size:.62rem;text-align:left;margin:4px 0 12px;}
  #statsPanel .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;}
  #statsPanel .chip{background:#181420;border:2px solid var(--line);padding:5px 8px;color:var(--text);}
  #statsPanel .chip b{color:var(--gold-bright);}
  #statsPanel .sec{color:var(--gold);margin:10px 0 4px;letter-spacing:1px;}
  #statsPanel table{width:100%;border-collapse:collapse;}
  #statsPanel th{color:var(--dim);font-weight:400;text-align:right;padding:3px 4px;}
  #statsPanel th:first-child,#statsPanel td:first-child{text-align:left;}
  #statsPanel td{padding:5px 4px;text-align:right;border-top:2px solid #241d33;}
  #statsPanel tr.tA td:first-child{border-left:4px solid #6ab0ff;padding-left:6px;}
  #statsPanel tr.tB td:first-child{border-left:4px solid #ff6a6a;padding-left:6px;}
  #statsPanel .bar{display:inline-block;height:8px;vertical-align:middle;margin-right:5px;}
  #statsPanel .tA .bar{background:#6ab0ff;} #statsPanel .tB .bar{background:#ff6a6a;}
  #statsPanel svg{width:100%;height:auto;background:#120f1a;border:2px solid var(--line);}
  #statsPanel .dead{opacity:.55;}
  #killScene{position:absolute;left:0;top:0;width:100%;height:100%;display:none;z-index:9;cursor:pointer;image-rendering:pixelated;image-rendering:crisp-edges;}
  #settingsBtn{background:#181420;color:var(--text);border:2px solid var(--line);padding:10px 14px;cursor:pointer;font-size:.75rem;margin-right:8px;}
  #settingsModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;}
  #settingsModal .panel{background:#14101c;border:3px solid var(--gold);padding:18px;width:min(560px,92vw);box-shadow:6px 6px 0 #000;}
  #settingsModal h3{font-family:'Press Start 2P',monospace;font-size:.9rem;color:var(--gold-bright);margin:0 0 12px;}
  #settingsModal .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:2px solid #241d33;}
  #settingsModal .row .t{flex:1;font-size:.72rem;color:var(--text);} #settingsModal .row .t small{display:block;color:var(--dim);margin-top:3px;font-size:.62rem;}
  #settingsModal .yn button{background:#181420;color:var(--dim);border:2px solid var(--line);padding:6px 12px;cursor:pointer;font-size:.72rem;margin-left:4px;}
  #settingsModal .yn button.on{color:#14101c;background:var(--gold);border-color:var(--gold-bright);}
  #settingsModal .close{margin-top:12px;width:100%;background:var(--gold);color:#14101c;border:0;padding:10px;cursor:pointer;font-size:.8rem;}
</style>
</head>
<body>
<div id="app">
  <div class="marquee"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <h1>GUY FIGHTS</h1>
  <div class="subtitle">pick two fighters</div>

  <div id="setup">
    <div class="pickRow">
      <div class="pickCol">
        <div class="pickLabel a">FIGHTER — BLUE CORNER</div>
        <div class="cardList" id="listA"></div>
        <div class="modifierBox" id="modsA"></div>
      </div>
      <div class="vsWrap">
        <div class="vs">VS</div>
        <button id="startBtn" aria-label="Start fight" disabled></button>
      </div>
      <div class="pickCol">
        <div class="pickLabel b">FIGHTER — RED CORNER</div>
        <div class="cardList" id="listB"></div>
        <div class="modifierBox" id="modsB"></div>
      </div>
    </div>
    <div class="battleOptions">
      <label>Blue team <select id="countA"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Red team <select id="countB"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Mode <select id="modeSelect"><option value="standard">Standard</option><option value="timed">Timed · 20s</option><option value="team">Team 3v3 (pick 3 each)</option><option value="random">Random Draft 3v3</option><option value="sudden">Sudden Death (low HP)</option><option value="infinite">Infinite Henchmen (score attack)</option><option value="titan">Titan (3× HP, bigger)</option></select></label>
    </div>
  </div>

  <div id="arenaScreen">
    <div class="hpPanel">
      <div class="hpBox" id="hpBoxA">
        <div class="hpName" id="hpNameA"></div>
        <div class="hpBarOuter"><div class="hpBarInner a" id="hpBarA" style="width:100%"></div></div>
        <div class="hpSub" id="hpSubA"></div>
      </div>
      <div class="hpBox right" id="hpBoxB">
        <div class="hpName" id="hpNameB"></div>
        <div class="hpBarOuter"><div class="hpBarInner b" id="hpBarB" style="width:100%"></div></div>
        <div class="hpSub" id="hpSubB"></div>
      </div>
    </div>
    <div id="modeTimer" style="display:none;text-align:center;color:var(--gold-bright);font-family:'Space Mono',monospace;font-weight:700;letter-spacing:3px;font-size:1.1rem;text-shadow:0 0 12px rgba(232,176,75,.5);margin:-4px 0 8px"></div>
    <div id="speedBar">Speed:
      <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <div id="canvasWrap">
      <div class="ringRope top"></div>
      <div class="ringRope bottom"></div>
      <div class="turnbuckle tl"></div>
      <div class="turnbuckle tr"></div>
      <div class="turnbuckle bl"></div>
      <div class="turnbuckle br"></div>
      <div id="canvasInner">
        <canvas id="c" width="800" height="800"></canvas>
        <canvas id="killScene" width="200" height="200"></canvas>
        <div id="weatherHeadline" aria-live="polite"></div>
        <div id="overlay">
          <h2 id="overlayTitle">Victory</h2>
          <p id="overlaySub"></p>
          <div id="statsPanel"></div>
          <div>
            <button id="rematchBtn">Rematch</button>
            <button id="changeBtn">Change Fighters</button>
          </div>
        </div>
        <div id="pauseOverlay" aria-label="Pause menu">
          <h2>Paused</h2>
          <p>Press Esc to resume</p>
          <div>
            <button id="resumeBtn">Resume</button>
            <button id="pauseRematchBtn">Restart</button>
            <button id="pauseChangeBtn">Change Fighters</button>
          </div>
        </div>
      </div>
    </div>
    <div id="log"></div>
  </div>
</div>
<div id="hoverTooltip"></div>

<script src="characters.js"></script>
<script>

(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Character definitions now live in characters.js (see CHAR_DEFS).
  // To add a new character, edit characters.js — see the comment
  // block at the top of that file for instructions.
  // ---------------------------------------------------------------
  const DEFS = window.CHAR_DEFS;

  const listA = document.getElementById('listA');
  const listB = document.getElementById('listB');
  const modsA = document.getElementById('modsA');
  const modsB = document.getElementById('modsB');
  const startBtn = document.getElementById('startBtn');
  const countASelect = document.getElementById('countA');
  const countBSelect = document.getElementById('countB');
  const modeSelect = document.getElementById('modeSelect');

  let selA = null, selB = null;
  let selectedModsA = {}, selectedModsB = {};

  // ---- Splash screen: shows every fighter, PLAY enters the menu ----
  const splashStyle=document.createElement('style');
  splashStyle.textContent=`  #splash{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#241a33 0%,var(--bg-deep) 62%);}
  #splash .splashPanel{width:min(960px,94vw);max-height:94vh;display:flex;flex-direction:column;align-items:center;gap:10px;}
  #splash .splashTitle{font-family:'Cinzel',serif;font-weight:800;letter-spacing:4px;font-size:2.6rem;margin:0;background:linear-gradient(90deg,var(--gold),#fff2cc,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #splash .splashSub{color:var(--dim);font-size:.75rem;letter-spacing:2px;text-transform:uppercase;}
  #splash .splashGrid{width:100%;flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:6px;border:2px solid var(--line);background:#120f1a;}
  #splash .splashCard{background:#181420;border:2px solid var(--line);padding:10px 6px;text-align:center;}
  #splash .sEmoji{font-size:2rem;line-height:1.2;}
  #splash .sName{font-size:.7rem;color:var(--text);margin-top:4px;}
  #splash #splashPlay{font-family:'Press Start 2P',monospace;font-size:1rem;background:var(--gold);color:#14101c;border:0;padding:14px 40px;cursor:pointer;box-shadow:4px 4px 0 #000;}
  #splash #splashPlay:hover{background:var(--gold-bright);}
`;
  document.head.appendChild(splashStyle);
  const splash=document.createElement('div'); splash.id='splash';
  const splashKeys=Object.keys(DEFS).filter(k=>DEFS[k].name && !k.startsWith('squad'));
  splash.innerHTML='<div class="splashPanel"><h1 class="splashTitle">GUY FIGHTS</h1>'+
    '<div class="splashSub">'+splashKeys.length+' fighters</div>'+
    '<div class="splashGrid">'+splashKeys.map(k=>`<div class="splashCard"><div class="sEmoji">${DEFS[k].emoji}</div><div class="sName">${DEFS[k].name}</div></div>`).join('')+'</div>'+
    '<button id="splashPlay">PLAY</button></div>';
  document.body.appendChild(splash);
  splash.querySelector('#splashPlay').addEventListener('click',()=>{ splash.style.display='none'; });
  const SET_ROWS=[['impact','💥 Impact frames','At 150+ damage the game freezes 0.5s with a black & white burst on the target'],
    ['speedVar','🏃 Differ movement speed','On contact / bounce, fighters get up to 25% faster or 10% slower'],
    ['cine','🎬 Cinematic effects','Zoom punches, slow-mo KOs, letterbox bars and a vignette'],
    ['kill','☠️ Killscene','Sliced KOs mid-fight, plus a cinematic winner scene (click to see stats)'],
    ['sfx','🔊 Play sound effects','Attack sounds like the Angry Guy shot and Guitar Guy notes'],
    ['coherent','🎼 Try forming coherent songs','Guitar Guy has a 25% chance per battle to play a song on repeat'],
    ['resize','🖥️ Resize cleanly','Shrinks the whole screen to fit smaller windows (like Chromebooks) so the top is never cut off']];
  function fitScreen(){
    const app=document.getElementById('app');
    if(!app) return;
    app.style.zoom=''; app.style.height='';
    if(typeof cfg==='undefined' || !cfg.resize) return;
    const h=app.scrollHeight, w=app.scrollWidth;
    if(!h || !w) return;
    const z=Math.min(1, innerHeight/h, innerWidth/w);
    if(z<1){ app.style.zoom=z; app.style.height=h+'px'; }
  }
  window.addEventListener('resize', ()=>fitScreen());
  const settingsModal=document.createElement('div'); settingsModal.id='settingsModal';
  settingsModal.innerHTML='<div class="panel"><h3>⚙ SETTINGS</h3>'+SET_ROWS.map(r=>`<div class="row"><div class="t">${r[1]}<small>${r[2]}</small></div><div class="yn" data-k="${r[0]}"><button data-v="1">Y</button><button data-v="0">N</button></div></div>`).join('')+'<button class="close">Close</button></div>';
  document.body.appendChild(settingsModal);
  const volRow=document.createElement('div'); volRow.className='row'; volRow.id='sfxVolRow';
  volRow.innerHTML='<div class="t">🔈 Sound volume<small>How loud sound effects play</small></div><input type="range" min="0" max="100" step="1" id="sfxVol" style="width:45%">';
  settingsModal.querySelector('.panel').insertBefore(volRow, settingsModal.querySelector('.close'));
  volRow.querySelector('#sfxVol').addEventListener('input',e=>{
    cfg.sfxVolume=Number(e.target.value);
    try{localStorage.setItem('bb_settings',JSON.stringify(cfg));}catch(err){}
  });
  function syncSettings(){ settingsModal.querySelectorAll('.yn').forEach(el=>{ const on=!!cfg[el.dataset.k]; el.children[0].classList.toggle('on',on); el.children[1].classList.toggle('on',!on); }); const vr=document.getElementById('sfxVolRow'); if(vr){ vr.style.display=cfg.sfx?'flex':'none'; vr.querySelector('#sfxVol').value=cfg.sfxVolume; } fitScreen(); }
  settingsModal.querySelectorAll('.yn button').forEach(b=>b.addEventListener('click',()=>{
    cfg[b.parentElement.dataset.k]=b.dataset.v==='1'; syncSettings();
    try{localStorage.setItem('bb_settings',JSON.stringify(cfg));}catch(e){}
  }));
  settingsModal.querySelector('.close').addEventListener('click',()=>{ settingsModal.style.display='none'; });
  settingsModal.addEventListener('click',e=>{ if(e.target===settingsModal) settingsModal.style.display='none'; });
  const settingsBtn=document.createElement('button'); settingsBtn.id='settingsBtn'; settingsBtn.textContent='⚙ Settings';
  startBtn.parentNode.insertBefore(settingsBtn,startBtn);
  settingsBtn.addEventListener('click',()=>{ syncSettings(); settingsModal.style.display='flex'; });
  let squadA=[], squadB=[]; const activeKey={A:null,B:null};
  const noTeam=new Set(['henchman']);
  const statusA=document.createElement('div'), statusB=document.createElement('div');
  statusA.className=statusB.className='squadStatus';
  listA.parentNode.insertBefore(statusA,listA); listB.parentNode.insertBefore(statusB,listB);
  const searchEl=document.createElement('input');
  searchEl.id='fighterSearch'; searchEl.placeholder='🔍 Search fighters...'; searchEl.autocomplete='off';
  const setupEl=document.getElementById('setup'); setupEl.insertBefore(searchEl,setupEl.firstChild);
  searchEl.addEventListener('input',()=>{
    const q=searchEl.value.trim().toLowerCase();
    document.querySelectorAll('.charCard').forEach(c=>{ c.style.display=(!q||c.dataset.name.includes(q))?'':'none'; });
    document.querySelectorAll('.categoryHeading').forEach(heading=>{
      let card=heading.nextElementSibling, hasVisibleCard=false;
      while(card&&!card.classList.contains('categoryHeading')){
        if(card.classList.contains('charCard')&&card.style.display!=='none') hasVisibleCard=true;
        card=card.nextElementSibling;
      }
      heading.style.display=hasVisibleCard?'':'none';
    });
  });
  function ready(){
    const md=modeSelect.value;
    if(md==='random') return true;
    if(md==='infinite') return !!selA;
    if(md==='team') return squadA.length>=1 && squadB.length>=1;
    return !!(selA && selB);
  }
  function updateSquadUI(){
    const t=modeSelect.value==='team';
    const f=(sq)=>t?`Pick up to 3 (${sq.length}/3): `+sq.map(e=>DEFS[e.key].emoji).join(' '):(modeSelect.value==='random'?'Teams are drawn at random':(modeSelect.value==='infinite'?(sq===squadB?'👊 Endless henchmen incoming!':'Pick your fighter'):''));
    statusA.textContent=f(squadA); statusB.textContent=f(squadB);
    countASelect.parentElement.style.display=(modeSelect.value==='team'||modeSelect.value==='random')?'none':'';
    countBSelect.parentElement.style.display=(modeSelect.value==='team'||modeSelect.value==='random'||modeSelect.value==='infinite')?'none':'';
  }
  function squadClick(key,side,card){
    if(noTeam.has(key)){ (side==='A'?statusA:statusB).textContent='That fighter can\'t join a squad'; return; }
    const sq=side==='A'?squadA:squadB, cls=side==='A'?'selA':'selB';
    const i=sq.findIndex(e=>e.key===key);
    if(i>=0 && activeKey[side]!==key){ activeKey[side]=key; renderModifiers(key,side,sq[i].mods); }
    else if(i>=0){ sq.splice(i,1); card.classList.remove(cls); activeKey[side]=null; (side==='A'?modsA:modsB).className='modifierBox'; (side==='A'?modsA:modsB).innerHTML=''; }
    else if(sq.length<3){ sq.push({key,mods:{}}); card.classList.add(cls); activeKey[side]=key; renderModifiers(key,side,sq[sq.length-1].mods); }
    updateSquadUI(); startBtn.disabled=!ready();
  }
  modeSelect.addEventListener('change',()=>{
    selA=selB=null; selectedModsA={}; selectedModsB={}; squadA=[]; squadB=[]; activeKey.A=activeKey.B=null;
    document.querySelectorAll('.charCard').forEach(c=>c.classList.remove('selA','selB'));
    modsA.className=modsB.className='modifierBox'; modsA.innerHTML=modsB.innerHTML='';
    updateSquadUI(); startBtn.disabled=!ready();
  });

  // ---------------------------------------------------------------
  // Hover tooltip (hover 0.9s over a fighter to see what it does)
  // ---------------------------------------------------------------
  const tooltipEl = document.getElementById('hoverTooltip');
  let tooltipTimer = null;
  let tooltipShown = false;

  function tooltipHtmlFor(defKey, modifierKeys){
    const d = DEFS[defKey];
    if(!d) return '';
    let html = `<div class="ttName">${d.emoji} ${d.name}</div><div class="ttDesc">${d.desc}</div>`;
    const modEntries = Object.entries(d.modifiers||{});
    if(modEntries.length){
      html += `<div class="ttMods">`;
      for(const [modKey, mod] of modEntries){
        const active = modifierKeys && modifierKeys[modKey];
        html += `<div class="ttMod">${active?'✓ ':''}<b>${mod.name}</b> — ${mod.desc}</div>`;
      }
      html += `</div>`;
    }
    return html;
  }

  function positionTooltip(clientX, clientY){
    const pad = 16;
    const rect = tooltipEl.getBoundingClientRect();
    let left = clientX + pad;
    let top = clientY + pad;
    if(left + rect.width > window.innerWidth - 8) left = clientX - rect.width - pad;
    if(top + rect.height > window.innerHeight - 8) top = clientY - rect.height - pad;
    tooltipEl.style.left = Math.max(8,left)+'px';
    tooltipEl.style.top = Math.max(8,top)+'px';
  }

  function showTooltip(html, clientX, clientY){
    tooltipEl.innerHTML = html;
    tooltipEl.classList.add('visible');
    tooltipShown = true;
    positionTooltip(clientX, clientY);
  }

  function hideTooltip(){
    clearTimeout(tooltipTimer);
    tooltipTimer = null;
    tooltipShown = false;
    tooltipEl.classList.remove('visible');
  }

  function scheduleTooltip(getHtml, clientX, clientY){
    clearTimeout(tooltipTimer);
    tooltipShown = false;
    tooltipTimer = setTimeout(()=>{
      const html = getHtml();
      if(html) showTooltip(html, clientX, clientY);
    }, 900);
  }

  function renderModifiers(key, side, modsObj){
    const panel = side==='A' ? modsA : modsB;
    const selected = modsObj || (side==='A' ? selectedModsA : selectedModsB);
    const modifiers = DEFS[key].modifiers;
    if(!modifiers){
      panel.className = 'modifierBox';
      panel.innerHTML = '';
      return;
    }
    panel.className = 'modifierBox visible';
    panel.innerHTML = `<div class="modifierTitle">MODIFIERS</div>`;
    Object.entries(modifiers).forEach(([modKey, mod])=>{
      const label = document.createElement('label');
      label.className = 'modifierOption';
      label.innerHTML = `<input type="checkbox" data-modifier="${modKey}"><span><b>${mod.name}</b><br>${mod.desc}</span>`;
      const input = label.querySelector('input');
      input.checked = !!selected[modKey];
      input.addEventListener('change', ()=>{ selected[modKey] = input.checked; });
      panel.appendChild(label);
    });
  }

  function buildCard(key, side){
    const d = DEFS[key];
    const card = document.createElement('div');
    card.className = 'charCard';
    card.dataset.name = (d.name+' '+key).toLowerCase();
    card.innerHTML = `<div class="charEmoji">${d.emoji}</div>
      <div class="charInfo"><b>${d.name}</b></div>`;
    let lastMouse = {x:0,y:0};
    card.addEventListener('mousemove', (e)=>{
      lastMouse = {x:e.clientX, y:e.clientY};
      if(tooltipShown) positionTooltip(e.clientX, e.clientY);
    });
    card.addEventListener('mouseenter', (e)=>{
      lastMouse = {x:e.clientX, y:e.clientY};
      const activeMods = side==='A' ? selectedModsA : selectedModsB;
      const isSelected = (side==='A' ? selA : selB) === key;
      scheduleTooltip(()=>tooltipHtmlFor(key, isSelected ? activeMods : null), lastMouse.x, lastMouse.y);
    });
    card.addEventListener('mouseleave', hideTooltip);
    card.addEventListener('click', ()=>{
      if(modeSelect.value==='team'){ squadClick(key,side,card); return; }
      if(modeSelect.value==='random' || (modeSelect.value==='infinite' && side==='B')) return;
      if(side==='A'){
        selA = key;
        selectedModsA = {};
        [...listA.children].forEach(c=>c.classList.remove('selA'));
        card.classList.add('selA');
      } else {
        selB = key;
        selectedModsB = {};
        [...listB.children].forEach(c=>c.classList.remove('selB'));
        card.classList.add('selB');
      }
      renderModifiers(key, side);
      startBtn.disabled = !ready();
    });
    return card;
  }

  const selectableKeys=Object.keys(DEFS).filter(key=>DEFS[key].selectable!==false)
    .sort((a,b)=>(DEFS[a].category||'').localeCompare(DEFS[b].category||'')||DEFS[a].name.localeCompare(DEFS[b].name));
  let displayedCategory='';
  selectableKeys.forEach(key=>{
    const category=DEFS[key].category||'';
    if(category&&category!==displayedCategory){
      for(const list of [listA,listB]){
        const heading=document.createElement('div');
        heading.className='categoryHeading';
        heading.textContent=category.toUpperCase();
        list.appendChild(heading);
      }
    }
    displayedCategory=category;
    listA.appendChild(buildCard(key,'A'));
    listB.appendChild(buildCard(key,'B'));
  });

  // ---------------------------------------------------------------
  // Arena / simulation
  // ---------------------------------------------------------------
  const canvas = document.getElementById('c');
  const screenCtx = canvas.getContext('2d');
  const PIX = 4; // 1 game pixel = 4 screen pixels
  const lo = document.createElement('canvas');
  lo.width = canvas.width/PIX; lo.height = canvas.height/PIX;
  const ctx = lo.getContext('2d');

  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    arenaMouse = {
      x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY,
      clientX:e.clientX, clientY:e.clientY
    };
  });
  canvas.addEventListener('mouseleave', ()=>{
    arenaMouse = null;
    hoveredArenaUnit = null;
    hideTooltip();
  });

  function updateArenaHover(){
    if(!arenaMouse){
      if(hoveredArenaUnit){ hoveredArenaUnit = null; hideTooltip(); }
      return;
    }
    let found = null;
    for(const team of teams){
      for(const u of aliveUnits(team)){
        if(Math.hypot(u.x-arenaMouse.x, u.y-arenaMouse.y) < u.r){ found = u; break; }
      }
      if(found) break;
    }
    if(found !== hoveredArenaUnit){
      hoveredArenaUnit = found;
      hideTooltip();
      if(found){
        const key = found.defKey, mods = found.modifiers;
        scheduleTooltip(()=>tooltipHtmlFor(key, mods), arenaMouse.clientX, arenaMouse.clientY);
      }
    } else if(found && tooltipShown){
      positionTooltip(arenaMouse.clientX, arenaMouse.clientY);
    }
  }

  const BOX = {left:16, top:16, right:canvas.width-16, bottom:canvas.height-16};

  const logEl = document.getElementById('log');
  const weatherHeadlineEl = document.getElementById('weatherHeadline');
  let weatherHeadlineTimer = 0;
  function log(msg, hl){
    const line = document.createElement('div');
    line.innerHTML = hl ? `<span class="hl">${msg}</span>` : msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    while(logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
  }

  let uidCounter = 1;
  let teams = [];
  let projectiles = [];
  let floaters = [];
  let bolts = [];
  let weatherEvents = [];
  let windDebris = [];
  let pingBalls = [];
  let glassSpikes = [];
  let seeds = [];
  let fireworkBursts = [];
  let tapeWalls = [];
  let forgeSparks = [];
  let gameOver = false;
  let paused = false;
  let rafId = null;
  let lastTs = null;
  let gameMode = 'standard';
  let modeTimeRemaining = 0;
  let arenaMouse = null;
  let hoveredArenaUnit = null;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function dist(u1,u2){ return Math.hypot(u1.x-u2.x, u1.y-u2.y); }

  // ---------------------------------------------------------------
  // Character hook system
  // -------------------------------------------------------------
  // A character's entry in characters.js can define a "hooks" object
  // with any of these optional functions to plug custom behavior in
  // WITHOUT touching this file. See the top of characters.js for the
  // full list of supported hooks and how to use them.
  // ---------------------------------------------------------------
  function getCharHook(defKey, name){
    const d = DEFS[defKey];
    return d && d.hooks && typeof d.hooks[name]==='function' ? d.hooks[name] : null;
  }
  // Runs every character's hook of this name that defines one (used for
  // chains where several characters could plausibly stack, e.g. The
  // ctx is passed through to each hook as-is.
  function runAllCharHooks(name, ctx){
    for(const key in DEFS){
      const fn = getCharHook(key, name);
      if(fn && (ctx.unit ? ctx.unit.defKey===key : true)) fn(ctx);
    }
  }

  function makeUnit(defKey, teamId, x, y, modifiers = {}){
    const d = DEFS[defKey];
    const angle = rand(0, Math.PI*2);
    const speedMultHook = getCharHook(defKey, 'spawnSpeedMult');
    const spd = d.speed * (speedMultHook ? speedMultHook(modifiers) : 1);
    const maxHpMultHook = getCharHook(defKey, 'spawnMaxHpMult');
    const hpFracHook = getCharHook(defKey, 'spawnHpFraction');
    const maxHpMult = maxHpMultHook ? maxHpMultHook(modifiers) : 1;
    const hpFrac = hpFracHook ? hpFracHook(modifiers) : 1;
    return {
      id: uidCounter++,
      defKey, baseDefKey:defKey, team: teamId,
      x, y, r: d.r,
      vx: defKey==='gwnn' ? (Math.random()<0.5 ? -spd : spd) : Math.cos(angle)*spd,
      vy: defKey==='gwnn' ? 0 : Math.sin(angle)*spd,
      laneY: y,
      hp: d.maxhp*maxHpMult*hpFrac, maxhp: d.maxhp*maxHpMult,
      modifiers: {...modifiers},
      damage: d.damage || 0,
      alive: true,
      // every fighter's ability runs on its own independent cooldown so
      cdBlacksmith: rand(0, DEFS.blacksmith.fireRate),
      cdAngry: rand(0, DEFS.angry.fireRate),
      cdCool: rand(0, DEFS.coolguy.throwInterval),
      cdHenchman: rand(0, DEFS.henchman.fireRate),
      cdDrunk: rand(0, DEFS.drunk.fireRate),
      cdManager: rand(0, DEFS.manager.suitcaseFireRate),
      cdTraffic: rand(0, DEFS.traffic.carInterval),
      cdPriest: rand(0, DEFS.priest.strikeInterval),

  // Lets a character spawn extra linked units alongside itself (e.g. a pet)
  // just by defining hooks.spawnCompanions in characters.js — no engine
  // changes needed for a new companion-style character.
  function spawnCompanionsFor(unit, team, x, y){
    const h = getCharHook(unit.defKey, 'spawnCompanions');
    if(!h) return;
    const extras = h({unit, team, x, y, makeUnit, rand}) || [];
    for(const extraUnit of extras) team.units.push(extraUnit);
  }

  function makeTeam(defKey, teamId, x, y, modifiers = {}, count = 1){
    const team = {
      id: teamId, defKey,
      modifiers: {...modifiers},
      color: teamId==='A' ? getCss('--teamA') : getCss('--teamB'),
      units: [], spawnTimer: 0, spawnedCount: 1,
      homeX: x, homeY: y
    };
    const leaders=[];
    for(let i=0;i<count;i++){
      const unit=makeUnit(defKey,teamId,x+rand(-30,30),y+rand(-100,100),modifiers);
      team.units.push(unit); leaders.push(unit);
      spawnCompanionsFor(unit, team, unit.x, unit.y);
    }
    const leader = leaders[0];
    team.leaderId = leader.id;
    return team;
  }

  function getCss(varName){

  function aliveUnits(team){ return team.units.filter(u=>u.alive); }
  function teamDefeated(team){
    if(team.infinite) return false;
    if(team.defKey==='henchman'){
      // The mob only loses once it has used up all 10 spawns AND every one is down.
      const maxCount = DEFS.henchman.maxCount + (team.modifiers.squadron ? 10 : 0);
      return team.spawnedCount >= maxCount && aliveUnits(team).length===0;
    }
    if(team.defKey==='necromancer'){
      const leader = team.units.find(u=>u.id===team.leaderId);
      return !leader || !leader.alive;
    }
    return team.units.length>0 && aliveUnits(team).length===0;
  }

  function inCone(origin,target,angle,width,length){
    const dx=target.x-origin.x, dy=target.y-origin.y;
    const distance=Math.hypot(dx,dy);
    if(distance>length) return false;
    const delta=Math.atan2(Math.sin(Math.atan2(dy,dx)-angle),Math.cos(Math.atan2(dy,dx)-angle));
    return Math.abs(delta)<=width/2;
  }

  function angryLostPct(unit){
    // Standard mode: capped 0-100% based on actual HP lost.
    // Timed mode: HP never truly depletes (infinite HP rule), so the buff
    // instead scales uncapped off cumulative damage taken - "no damage buff limit".
    if(gameMode==='timed') return ((unit.damageTaken||0) / unit.maxhp) * 100;
    return (1 - unit.hp / unit.maxhp) * 100;
  }

  function angryDamage(unit){
    const lostPct = angryLostPct(unit);
    const baseDamage = unit.damage ?? DEFS.angry.damage;
    return baseDamage + (lostPct * DEFS.angry.rageDamageGain);
  }

  function angryKnockbackFactor(unit){
    if(!unit || unit.defKey !== 'angry') return 1;
    const lostPct = angryLostPct(unit);
    return Math.max(0.2, 1 - (lostPct * DEFS.angry.rageKnockbackResist));
  }

  function boxingDodgeChance(unit){
    const dB = DEFS.boxing;
    const lostPct = (1 - unit.hp/unit.maxhp) * 100;
    return dB.dodgeBase + (lostPct/dB.dodgeHpChunk)*dB.dodgePerChunk;
  }

  function applyKnockback(attacker, defender, dirOverride, forceMult){
    let dx = defender.x-attacker.x, dy = defender.y-attacker.y;
    if(dirOverride){ dx = dirOverride.x; dy = dirOverride.y; }
    const len = Math.hypot(dx,dy) || 1;
    const nx = dx/len, ny = dy/len;
    const KB = 250*(forceMult||1);
    const scytheResist=defender.defKey==='scythe'&&defender.scytheDamageBuffT>0?0.8:1;
    const defenderScale = angryKnockbackFactor(defender)*scytheResist;
    defender.vx = nx*KB*defenderScale; defender.vy = ny*KB*defenderScale;
    attacker.vx -= nx*70; attacker.vy -= ny*70;
  }

  // ---------- slice geometry ----------
  function clipPoly(poly,nx,ny,d,sg){
    const out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length], da=sg*(nx*a[0]+ny*a[1]-d), db=sg*(nx*b[0]+ny*b[1]-d);
      if(da>=0) out.push(a);
      if((da>=0)!==(db>=0)){ const t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); }
    }
    return out;
  }
  function sliceModel(n,baseAng,R){
    const cuts=[];
    for(let i=0;i<n;i++) cuts.push({a:i===0?baseAng:baseAng+(Math.random()*2-1)*1.5+(i%2?0.45:-0.45), d:i===0?0:(Math.random()*2-1)*R*0.55});
    const acc={}, step=R/7;
    for(let x=-R;x<=R;x+=step) for(let y=-R;y<=R;y+=step){
      if(x*x+y*y>R*R) continue;
      let m=0; cuts.forEach((c,i)=>{ if((-Math.sin(c.a))*x+Math.cos(c.a)*y-c.d>=0) m|=(1<<i); });
      const o=acc[m]||(acc[m]={sx:0,sy:0,n:0}); o.sx+=x; o.sy+=y; o.n++;
    }
    const pieces=[];
    for(const k in acc){
      const m=Number(k), o=acc[k]; let poly=[[-2*R,-2*R],[2*R,-2*R],[2*R,2*R],[-2*R,2*R]];
      for(let i=0;i<n&&poly.length;i++) poly=clipPoly(poly,-Math.sin(cuts[i].a),Math.cos(cuts[i].a),cuts[i].d,(m>>i&1)?1:-1);
      if(poly.length<3) continue;
      let cx=o.sx/o.n, cy=o.sy/o.n; const L=Math.hypot(cx,cy);
      let dx,dy; if(L<R*0.12){ const r=Math.random()*6.28; dx=Math.cos(r); dy=Math.sin(r); } else { dx=cx/L; dy=cy/L; }
      pieces.push({poly,dx,dy,rot:(Math.random()-0.5)*1.6,spd:0.7+Math.random()*0.9});
    }
    return {cuts,pieces};
  }
  function drawCutLines(c,model,x,y,R,age,stagger,dur,width,srcX,srcY){
    c.strokeStyle='#fff'; c.lineWidth=width; c.lineCap='round';
    model.cuts.forEach((cu,i)=>{
      const kk=Math.max(0,Math.min(1,(age-i*stagger)/dur)); if(kk<=0) return;
      const dx=Math.cos(cu.a), dy=Math.sin(cu.a), nx=-Math.sin(cu.a), ny=Math.cos(cu.a);
      const mx=x+nx*cu.d, my=y+ny*cu.d, ex=mx+dx*R*1.9, ey=my+dy*R*1.9;
      const sx=(i===0&&srcX!==undefined)?srcX:mx-dx*R*1.9, sy=(i===0&&srcY!==undefined)?srcY:my-dy*R*1.9;
      c.beginPath(); c.moveTo(sx,sy); c.lineTo(sx+(ex-sx)*kk,sy+(ey-sy)*kk); c.stroke();
    });
    c.lineCap='butt';
  }
  function drawPieces(c,model,x,y,R,q,bodyFn){
    for(const p of model.pieces){
      c.save(); c.translate(x+p.dx*q*R*1.7*p.spd,y+p.dy*q*R*1.7*p.spd+q*q*R*2); c.rotate(p.rot*q);
      c.beginPath(); c.arc(0,0,R+4,0,7); c.clip();
      c.beginPath(); p.poly.forEach((pt,i)=>i?c.lineTo(pt[0],pt[1]):c.moveTo(pt[0],pt[1])); c.closePath(); c.clip();
      bodyFn(0,0,1-q);
      c.globalAlpha=(1-q)*0.9; c.strokeStyle='#fff'; c.lineWidth=Math.max(2,R*0.09); c.stroke(); c.globalAlpha=1;
      c.restore();

  function makeSfxPool(src){
    return Array.from({length:8},()=>{
      const e=new Audio(src); e.preload='auto';
      e.addEventListener('error',()=>console.warn(src+' failed to load (check it is next to index.html)'));
      return e;

  const angrySfxSets={

  function playAngryShotSound(unit){
    if(!cfg.sfx) return;
    try{
      const set = (unit && unit.hp/unit.maxhp < 0.33) ? angrySfxSets.low : angrySfxSets.normal;
      const a=set.pool[set.idx];
      set.idx=(set.idx+1)%set.pool.length;
      a.pause();
      a.currentTime=0;
      a.volume=cfg.sfxVolume/100;
      a.playbackRate=(set===angrySfxSets.low)?ANGRY_SHOT_RATE:1;
      a.preservesPitch=false;
      const p=a.play();
      if(p&&p.catch) p.catch(err=>console.warn('angry shot sound play blocked:',err));
    }catch(e){ console.warn('angry shot sound error:',e); }
  }
  function ring(x,y,color,maxR){ particles.push({ring:true,x,y,life:0.3,max:0.3,r:10,maxR,color,size:0}); }
  // ---- Old Guy: bread swarm, poop zones, pigeon shield and divers ----
  const oldFlyers=[], oldPoops=[], oldDivers=[];
  function oldGuyEnemies(owner){
    const foes=teams.find(t=>t.id!==owner.team);
    return foes?aliveUnits(foes):[];
  }
  function oldGuyNearest(owner,x,y){
    let best=null,bd=Infinity;
    for(const e of oldGuyEnemies(owner)){
      const d=Math.hypot(e.x-x,e.y-y);
      if(d<bd){ bd=d; best=e; }
    }
    return best;
  }
  function oldGuyLaunchDiver(owner,dmg,x,y){
    if(!oldGuyNearest(owner,x,y)) return;
    oldDivers.push({x,y,owner,dmg,speed:380});
  }
  function oldGuySwarm(unit){
    const D=DEFS.oldguy;
    addFloater(unit.x,unit.y-unit.r-16,'🍞','#ffe0a3');
    unit.swarmSpawn={left:D.flyerCount, t:0, offense:hasModifier(unit,'pigeonOffense')};
    if(hasModifier(unit,'pigeonDefense')){
      unit.pigeonRing=Array.from({length:D.ringCount},()=>({hp:D.ringPigeonHp}));
      unit.pigeonRingT=D.ringLife;
    }
  }
  function oldGuySpawnFlyer(unit,offense,index){
    const D=DEFS.oldguy, W=canvas.width, H=canvas.height;
    oldFlyers.push({
      x:-30-index*4, y:50+Math.random()*(H-140), vx:D.flyerSpeed*(0.85+0.3*Math.random()),
      owner:unit, poopX:W*(0.1+0.8*Math.random()), pooped:false, offense
    });
  }
  function oldGuyAbsorb(unit,dmg){
    const ring=unit.pigeonRing;
    while(dmg>0 && ring.length){
      const p=ring[0];
      const ab=Math.min(p.hp,dmg);
      p.hp-=ab; dmg-=ab;
      if(p.hp<=0){
        ring.shift();
        oldGuyLaunchDiver(unit,DEFS.oldguy.ringDiveDamage,unit.x,unit.y);
        addFloater(unit.x,unit.y-unit.r-20,'POP!','#ffffff');
      }
    }
    return dmg;
  }
  function updateOldGuy(dt){
    const D=DEFS.oldguy;
    for(const team of teams) for(const u of team.units){
      if(u.poopSlowT>0) u.poopSlowT-=dt;
      if(u.defKey!=='oldguy' || !u.alive) continue;
      if(u.swarmT===undefined) u.swarmT=D.swarmInterval;
      if(!u.swarmSpawn){
        u.swarmT-=dt;
        if(u.swarmT<=0) oldGuySwarm(u);
      }
      if(u.swarmSpawn){
        const sp=u.swarmSpawn; sp.t-=dt;
        const gap=D.swarmDuration/D.flyerCount;
        while(sp.left>0 && sp.t<=0){ oldGuySpawnFlyer(u,sp.offense,D.flyerCount-sp.left); sp.left--; sp.t+=gap; }
        if(sp.left<=0){ u.swarmSpawn=null; u.swarmT=D.swarmInterval; }
      }
      if(u.pigeonRingT>0){
        u.pigeonRingT-=dt;
        if(u.pigeonRingT<=0){ u.pigeonRing=[]; u.pigeonRingT=0; }
      }
    }
    const W=canvas.width;
    // flyers
    for(let i=oldFlyers.length-1;i>=0;i--){
      const f=oldFlyers[i];
      f.x+=f.vx*dt;
      if(!f.pooped && f.x>=f.poopX){
        f.pooped=true;
        if(f.offense && Math.random()<D.offenseChance){
          oldGuyLaunchDiver(f.owner,D.offenseDiveDamage,f.x,f.y);
        } else {
          const dmg=D.poopDamage+(f.offense?D.offensePoopBonus:0);
          oldPoops.push({x:f.x,y:f.y,owner:f.owner,dmg,vx:f.vx*0.35,flightT:0.35,ground:false,life:D.poopLife});
        }
      }
      if(f.x>W+40) oldFlyers.splice(i,1);
    }
    // poop: dropped in flight, lands on the arena floor, then stays for poopLife
    for(let i=oldPoops.length-1;i>=0;i--){
      const p=oldPoops[i];
      if(!p.ground){
        p.x+=p.vx*dt; p.flightT-=dt;
        let hitUnit=null;
        for(const e of oldGuyEnemies(p.owner)){
          if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+8){ hitUnit=e; break; }
        }
        if(hitUnit){ dealDamage(p.owner,hitUnit,p.dmg); oldPoops.splice(i,1); continue; }
        if(p.flightT<=0){ p.ground=true; p.vx=0; }
      } else {
        p.life-=dt;
        for(const team of teams) for(const u of team.units){
          if(u.alive && Math.hypot(u.x-p.x,u.y-p.y)<DEFS.oldguy.poopRadius+u.r) u.poopSlowT=0.1;
        }
        if(p.life<=0){ oldPoops.splice(i,1); continue; }
      }
    }
    // divers (homing)
    for(let i=oldDivers.length-1;i>=0;i--){
      const d=oldDivers[i];
      const t=oldGuyNearest(d.owner,d.x,d.y);
      if(!t){ oldDivers.splice(i,1); continue; }
      const dx=t.x-d.x, dy=t.y-d.y, len=Math.hypot(dx,dy)||1;
      if(len<=t.r+6){ dealDamage(d.owner,t,d.dmg); oldDivers.splice(i,1); continue; }
      d.x+=dx/len*d.speed*dt; d.y+=dy/len*d.speed*dt;
    }
  }
  function drawOldGuyFx(){
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const f of oldFlyers){ ctx.font='22px serif'; ctx.globalAlpha=1; ctx.fillText('🕊️',f.x,f.y); }
    for(const p of oldPoops){
      ctx.font='18px serif';
      ctx.globalAlpha=p.ground?Math.max(0,p.life/DEFS.oldguy.poopLife):1;
      ctx.fillText('💩',p.x,p.y);

    for(const team of teams) for(const u of team.units){
      if(!u.alive || !u.pigeonRing || !u.pigeonRing.length) continue;
      ctx.font='18px serif';
      u.pigeonRing.forEach((p,i)=>{
        const a=(i/DEFS.oldguy.ringCount)*Math.PI*2+t;
        ctx.fillText('🕊️',u.x+Math.cos(a)*(u.r+22),u.y+Math.sin(a)*(u.r+22));
      });
    }
    ctx.restore();
  }
  // ---- Canadian Guy: snowball volleys that block, grow, rock and yellow snow ----
  const snowballs=[];
  function canadianVolley(unit,target){
    const D=DEFS.canadian;
    const yay=hasModifier(unit,'yaySnow'), bio=hasModifier(unit,'biologicalWarfare');
    const balls=yay?D.volleyBalls+1:D.volleyBalls;
    const base=Math.atan2(target.y-unit.y,target.x-unit.x);
    for(let i=0;i<balls;i++){
      const a=base+((i-(balls-1)/2)*D.volleyAngleStep)*Math.PI/180;
      let dmg=D.snowDamage+(bio?D.bioDamageBonus:0);
      const rock=bio && Math.random()<D.rockChance;
      if(rock) dmg+=D.rockDamage;
      const yellow=bio && Math.random()<D.yellowChance;
      snowballs.push({x:unit.x,y:unit.y,vx:Math.cos(a)*D.snowSpeed,vy:Math.sin(a)*D.snowSpeed,
        owner:unit,team:unit.team,dmg,yellow,rock,grow:yay,t:0,touched:new Set()});
    }
  }
  function updateCanadian(dt){
    const D=DEFS.canadian;
    for(const team of teams) for(const u of team.units){
      if(u.yellowSnows && u.yellowSnows.length) u.yellowSnows=u.yellowSnows.map(t=>t-dt).filter(t=>t>0);
      if(u.defKey!=='canadian' || !u.alive) continue;
      u.cdCanadian=(u.cdCanadian||0)-dt;
      if(u.cdCanadian<=0){
        const foes=teams.find(t=>t.id!==u.team);
        const list=foes?aliveUnits(foes):[];
        let tgt=null,bd=Infinity;
        for(const e of list){ const d=Math.hypot(e.x-u.x,e.y-u.y); if(d<bd){bd=d;tgt=e;} }
        if(tgt){
          u.cdCanadian=D.fireRate; canadianVolley(u,tgt);
          u.snowCount=(u.snowCount||0)+(hasModifier(u,'yaySnow')?D.volleyBalls+1:D.volleyBalls);
          if(u.snowCount>=D.pauseEvery){ u.snowCount=0; u.cdCanadian=D.pauseTime; }
        }
      }
    }
    const W=canvas.width, H=canvas.height;
    for(let i=snowballs.length-1;i>=0;i--){
      const sb=snowballs[i];
      sb.t+=dt; sb.x+=sb.vx*dt; sb.y+=sb.vy*dt;
      const g=sb.grow?Math.min(1,sb.t/D.growTime):0;
      const r=D.snowRadius*(1+D.growMaxSizeBonus*g);
      if(sb.x<-40||sb.x>W+40||sb.y<-40||sb.y>H+40){ snowballs.splice(i,1); continue; }
      const foes=teams.find(t=>t.id!==sb.team);
      let hit=null;
      if(foes) for(const e of aliveUnits(foes)){
        if(Math.hypot(e.x-sb.x,e.y-sb.y) < e.r+r){ hit=e; break; }
      }
      if(hit){
        dealDamage(sb.owner,hit,sb.dmg*(1+D.growMaxDamageBonus*g),null,!sb.rock);
        if(sb.yellow && hit.alive){
          hit.yellowSnows=(hit.yellowSnows||[]).concat([D.yellowDuration]);
          addFloater(hit.x,hit.y-hit.r-18,'YELLOW SNOW','#ffe066');
        }
        snowballs.splice(i,1);
      }
    }
  }
  function drawCanadianFx(){
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const sb of snowballs){
      const g=sb.grow?Math.min(1,sb.t/DEFS.canadian.growTime):0;
      const size=DEFS.canadian.snowRadius*(1+DEFS.canadian.growMaxSizeBonus*g);
      ctx.font=`${size*2}px serif`;
      ctx.fillText('⚪',sb.x,sb.y);
      if(sb.yellow){ ctx.font=`${size}px serif`; ctx.fillText('🟡',sb.x+size*0.8,sb.y-size*0.8); }
    }
    ctx.restore();
  }

  function guitarPluck(freq,dur){
    if(!cfg.sfx) return;
    try{
      if(!guitarAC) guitarAC=new (window.AudioContext||window.webkitAudioContext)();
      if(guitarAC.state==='suspended') guitarAC.resume();
      const t0=guitarAC.currentTime, vol=Math.max(0.0001,0.2*cfg.sfxVolume/100);
      const mix=guitarAC.createGain(); mix.gain.value=1;
      const o1=guitarAC.createOscillator(); o1.type='sawtooth'; o1.frequency.value=freq;
      const o2=guitarAC.createOscillator(); o2.type='square'; o2.frequency.value=freq*1.006;
      const sum=guitarAC.createGain(); sum.gain.value=0.5;
      o1.connect(sum); o2.connect(sum);
      const shaper=guitarAC.createWaveShaper(); shaper.curve=guitarDrive(); shaper.oversample='4x';
      const tone=guitarAC.createBiquadFilter(); tone.type='lowpass';
      tone.frequency.setValueAtTime(3600,t0); tone.frequency.exponentialRampToValueAtTime(900,t0+dur);
      const g=guitarAC.createGain();
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.006);
      g.gain.setValueAtTime(vol*0.8,t0+Math.min(dur*0.4,0.25));
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      sum.connect(shaper); shaper.connect(tone); tone.connect(g); g.connect(guitarAC.destination);
      o1.start(t0); o2.start(t0); o1.stop(t0+dur+0.05); o2.stop(t0+dur+0.05);

      const foes=teams.find(tm=>tm.id!==sp.team);
      let hit=null;
      if(foes) for(const e of aliveUnits(foes)){ if(Math.hypot(e.x-sp.x,e.y-sp.y)<e.r+8){ hit=e; break; } }
      if(hit){
        dealDamage(sp.owner,hit,sp.dmg,null,true);
        cactusStuck.push({target:hit,owner:sp.owner,t:0,ang:sp.ang});
        cactusSpikes.splice(i,1); continue;
      }
      if(sp.life<=0 || sp.x<BOX.left||sp.x>BOX.right||sp.y<BOX.top||sp.y>BOX.bottom){

          const wx=Math.min(BOX.right,Math.max(BOX.left,sp.x)), wy=Math.min(BOX.bottom,Math.max(BOX.top,sp.y));
          cactusWalls.push({x:wx,y:wy,ang:sp.ang,owner:sp.owner,team:sp.team,touching:new Set()});
        }
        cactusSpikes.splice(i,1);

    for(let i=cactusStuck.length-1;i>=0;i--){
      const st=cactusStuck[i];

      st.t+=dt;
      if(st.t>=D.stuckTick){ st.t-=D.stuckTick; dealDamage(st.owner,st.target,D.stuckDamage,null,true); }

        const near=Math.hypot(e.x-w.x,e.y-w.y)<e.r+10;

  function updateConstruction(dt){
    const D=DEFS.construction;
    for(const team of teams) for(const u of team.units){
      if(u.defKey!=='construction' || !u.alive) continue;
      u.buildT=(u.buildT===undefined?D.buildInterval:u.buildT)-dt;

      for(const e of list){ const d=dist(u,e); if(d<bd){bd=d;t=e;} }
      if(!t) continue;

      }

      const a=Math.atan2(t.y-u.y,t.x-u.x);
      const wx=u.x+Math.cos(a)*D.wallDistance, wy=u.y+Math.sin(a)*D.wallDistance;
      const vertical=Math.abs(Math.cos(a))>=Math.abs(Math.sin(a));
      constructionWalls.push({x:wx,y:wy,team:u.team,owner:u,durability:D.wallDurability,
        w:vertical?D.wallThick:D.wallLength, h:vertical?D.wallLength:D.wallThick});
    }
    for(let i=constructionWalls.length-1;i>=0;i--){
      if(constructionWalls[i].durability<=0){ constructionWalls.splice(i,1); }
    }
    // walls are solid: enemies of the wall's owner are pushed out of the brick
    for(const team of teams) for(const u of team.units){
      if(u.alive) pushOutOfWalls(u);
    }

  function pushOutOfWalls(u){
    for(const w of constructionWalls){
      if(w.team===u.team) continue;
      const L=w.x-w.w/2, R=w.x+w.w/2, T=w.y-w.h/2, B=w.y+w.h/2;
      const nx=clamp(u.x,L,R), ny=clamp(u.y,T,B);
      const dx=u.x-nx, dy=u.y-ny, d=Math.hypot(dx,dy);
      if(d>=u.r) continue;
      if(d<1e-6){
        const dl=u.x-L, dr=R-u.x, dtp=u.y-T, db=B-u.y, m=Math.min(dl,dr,dtp,db);
        if(m===dl) u.x=L-u.r; else if(m===dr) u.x=R+u.r; else if(m===dtp) u.y=T-u.r; else u.y=B+u.r;
      } else {
        const push=(u.r-d)/d;
        u.x+=dx*push; u.y+=dy*push;
      }
    }
  }

  }
  function flintShoot(u,target,buff){
    const D=DEFS.flintlock, coin=hasModifier(u,'coin');
    const kind=flintRoll(), d=dist(u,target);
    let dmg, hit=true, mult=1, recoilPct=0, healPct=0, bullets=1;
    if(kind==='normal'){ dmg=D.normalDamage; hit=Math.random()>=D.normalMiss; }
    else if(kind==='tooMuch'){ dmg=D.tooMuchDamage; hit=d<=D.tooMuchRange; }
    else { dmg=D.tooLittleDamage; }
    if(coin){ hit=true; dmg+=D.coinBonus; addFloater(u.x,u.y-u.r-34,'COIN!','#ffd166'); }
    if(buff===2) mult=1.25;
    if(buff===3) bullets=2;
    if(buff===4){ mult=1.75; recoilPct=0.5; }
    if(buff===5){ mult=1.5; healPct=0.33; }
    if(buff===6){ mult=1.77; hit=true; }
    dmg*=mult;
    if(kind==='tooMuch'){ u.hp-=D.tooMuchRecoil; addFloater(u.x,u.y-u.r-16,`-${D.tooMuchRecoil}`,'#ff8a5b'); killCheck(u,target); }

      if(!hit){ addFloater(target.x,target.y-target.r-18,'MISS','#cfcfcf'); continue; }
      dealDamage(u,target,dmg,null,true);

  // ---- Megaphone Guy: yells on taking damage, shockwave scales with damage ----
  const megaphoneWaves=[];
  function makeMegaphoneWave(unit,dmg,radius,deaf,delay,scream){
    return {x:unit.x,y:unit.y,owner:unit,radius,dmg,deaf,delay,scream,age:0,duration:0.35,cur:undefined,hit:new Set()};
  }
  function megaphoneYell(unit,dmg){
    const D=DEFS.megaphone;
    const t=Math.min(1,dmg/D.yellCap);
    const radius=Math.max(80,t*Math.hypot(canvas.width,canvas.height));
    const waveDmg=dmg*(1+D.maxDamageBonus*t);
    const deaf=hasModifier(unit,'deafening');
    megaphoneWaves.push(makeMegaphoneWave(unit,waveDmg,radius,deaf,0,false));
    if(hasModifier(unit,'scream')){
      unit.screamPending=true; unit.screamDelayT=D.screamDelay||0;
      megaphoneWaves.push(makeMegaphoneWave(unit,waveDmg*D.screamFactor,radius,deaf,D.screamDelay,true));
    }
    addFloater(unit.x,unit.y-unit.r-14,`📢 ${Math.round(dmg)}`,'#ffd479');
    log(`📢 Megaphone Guy yells! ${Math.round(waveDmg)} dmg shockwave`, true);
  }
  function updateMegaphoneWaves(dt){
    for(let i=megaphoneWaves.length-1;i>=0;i--){
      const w=megaphoneWaves[i];
      if(w.delay>0){ w.delay-=dt; continue; }
      w.age+=dt;
      const k=Math.min(1,w.age/w.duration);
      w.cur=w.radius*k;
      const foes=teams.find(t=>t.id!==w.owner.team);
      if(foes){
        for(const e of aliveUnits(foes)){
          if(w.hit.has(e)) continue;
          if(Math.hypot(e.x-w.x,e.y-w.y) > w.cur+e.r) continue;
          w.hit.add(e);
          const dx=e.x-w.x, dy=e.y-w.y, len=Math.hypot(dx,dy)||1;
          dealDamage(w.owner,e,w.dmg,{x:dx/len,y:dy/len},false,w.deaf?DEFS.megaphone.deafeningKnockbackMult:1);
          if(w.deaf && e.alive) applyStun(e,DEFS.megaphone.deafeningStun);
        }
      }
      if(k>=1) megaphoneWaves.splice(i,1);
    }
  }

      if(w.delay>0 || w.cur===undefined) continue;

      ctx.strokeStyle=w.deaf?'#ff5bd6':'#ffd479';
