      // full-screen slash streaks + flash on each cut
      flashAt.forEach((f,i)=>{ if(t>f&&t<f+0.06){ const cu=M.cuts[i], dx=Math.cos(cu.a), dy=Math.sin(cu.a); g.strokeStyle='#fff'; g.globalAlpha=0.9*(1-(t-f)/0.06); g.lineWidth=2; g.beginPath(); g.moveTo(100-dx*220,92-dy*220+cu.d); g.lineTo(100+dx*220,92+dy*220+cu.d); g.stroke(); g.globalAlpha=0.28*(1-(t-f)/0.06); g.fillStyle='#fff'; g.fillRect(0,0,200,200); g.globalAlpha=1; } });
      for(let k=0;k<90;k++){ g.fillStyle=Math.random()<0.5?'rgba(255,255,255,0.10)':'rgba(0,0,0,0.18)'; g.fillRect((Math.random()*200)|0,(Math.random()*200)|0,1,1); }
      for(let y=0;y<200;y+=3){ g.fillStyle='rgba(0,0,0,0.07)'; g.fillRect(0,y,200,1); }
      const h=Math.round(16*ease(t/0.5)); g.fillStyle='#000'; g.fillRect(0,0,200,h); g.fillRect(0,200-h,200,h);
      clickable=t>WT+1.0;
      if(t>WT+1.2 && Math.floor(t*2)%2) txt('CLICK TO CONTINUE',100,178,5,'#aaa');
      raf=requestAnimationFrame(frame);
    }
    sc.onclick=()=>{ if(!clickable) return; cancelAnimationFrame(raf); sc.style.display='none'; sc.onclick=null; done(); };
    raf=requestAnimationFrame(frame);
  }

  // ------------- setup / lifecycle -------------
  function startBattle(){
    const mode=modeSelect.value; modeKey=mode; score=0; comboN=0; comboT=0; infKills=0; infBest=readBest();
    oldFlyers.length=0; oldPoops.length=0; oldDivers.length=0; snowballs.length=0; megaphoneWaves.length=0;
    guitarStrips.length=0; gravOrbits.length=0; paintZones.length=0; bakerThrows.length=0; cactusSpikes.length=0; cactusStuck.length=0; cactusWalls.length=0; constructionWalls.length=0; flintFlashes.length=0; gicRockets.length=0; gicBlasts.length=0; sukunaFx.length=0;
    gameMode=mode==='timed'?'timed':'standard';
    modeTimeRemaining=20;
    const cy=()=>(BOX.top+BOX.bottom)/2+rand(-60,60);
    const draw=()=>{ const keys=Object.keys(DEFS).filter(k=>DEFS[k].selectable!==false&&!noTeam.has(k)).sort(()=>Math.random()-0.5).slice(0,3);
      return keys.map(k=>({key:k,mods:Object.fromEntries(Object.keys(DEFS[k].modifiers||{}).map(m=>[m,Math.random()<0.5]))})); };
    const squad=(entries,id,x)=>{
      const nm=(id==='A'?'Blue':'Red')+' Squad';
      DEFS['squad'+id]={key:'squad'+id,name:nm,emoji:entries.map(e=>DEFS[e.key].emoji).join(''),maxhp:1000,speed:150,r:50,selectable:false};
      const t={id,defKey:'squad'+id,squad:true,modifiers:{},color:id==='A'?getCss('--teamA'):getCss('--teamB'),units:[],spawnTimer:0,spawnedCount:1,homeX:x,homeY:cy()};
      entries.forEach((e,i)=>{
        const unit=makeUnit(e.key,id,x+rand(-30,30),t.homeY+(i-(entries.length-1)/2)*170,e.mods);
        t.units.push(unit);
        spawnCompanionsFor(unit, t, unit.x, unit.y);
      });
      t.leaderId=t.units[0].id; return t; };
    if(mode==='team') teams=[squad(squadA,'A',BOX.left+90),squad(squadB,'B',BOX.right-90)];
    else if(mode==='random') teams=[squad(draw(),'A',BOX.left+90),squad(draw(),'B',BOX.right-90)];
    else if(mode==='infinite'){
      teams=[makeTeam(selA,'A',BOX.left+90,cy(),selectedModsA,Number(countASelect.value)), makeTeam('henchman','B',BOX.right-90,cy(),{},3)];
      teams[1].infinite=true; teams[1].wave=1;
    }
    else teams = [
      makeTeam(selA, 'A', BOX.left+90, cy(), selectedModsA, Number(countASelect.value)),
      makeTeam(selB, 'B', BOX.right-90, cy(), selectedModsB, Number(countBSelect.value))
    ];
    const hpMult=mode==='sudden'?0.2:mode==='titan'?3:1;
    if(hpMult!==1||mode==='titan') for(const t of teams) for(const u of t.units){ u.hp*=hpMult; u.maxhp*=hpMult; if(mode==='titan') u.r*=1.25; }
    stats = newStats(); particles.length=0; shakeT=0; hitstop=0; slices.length=0; booms.length=0; zones.length=0; mines.length=0; syringes.length=0; clouds.length=0; timers.length=0; weatherEvents.length=0; windDebris.length=0; weatherHeadlineTimer=0; weatherHeadlineEl.style.display='none'; finalKill=null; impactT=0; camZ=1; barT=0; slowT=0; lastKillT=-9;
    { const ks=document.getElementById('killScene'); if(ks){ ks.style.display='none'; ks.onclick=null; } }
    projectiles = [];
    floaters = [];
    bolts = [];
    pingBalls = [];
    glassSpikes = [];
    seeds = [];
    fireworkBursts = [];
    tapeWalls = [];
    forgeSparks = [];
    gameOver = false;
    paused = false;
    lastTs = null;
    logEl.innerHTML = '';
    document.getElementById('overlay').style.display='none';
    document.getElementById('pauseOverlay').style.display='none';
    log(`⚔️ ${DEFS[teams[0].defKey].name} (Blue) vs ${DEFS[teams[1].defKey].name} (Red) — fight!`, true);

    for(const team of teams) for(const leader of (team.squad?team.units:[team.units.find(u=>u.id===team.leaderId)])){
      if(leader && leader.defKey==='exploding' && hasModifier(leader, 'tickTock')) armBomb(leader);
      if(leader && (leader.defKey==='pingpong')){
        const dp = DEFS.pingpong;
        const ang = rand(0,Math.PI*2);
        pingBalls.push({
          x: leader.x, y: leader.y,
          vx: Math.cos(ang)*dp.ballSpeed, vy: Math.sin(ang)*dp.ballSpeed,
          r: dp.ballR, dmg: dp.ballDmg,
          team: team.id, owner: leader,
          hitCd: 0, boostCd: 0.5
        });
      }
    }

    document.getElementById('setup').style.display='none';
    document.getElementById('arenaScreen').style.display='block';

    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  document.querySelectorAll('#speedBar button').forEach(b=>b.addEventListener('click',()=>{
    simSpeed=Number(b.dataset.s);
    document.querySelectorAll('#speedBar button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  document.getElementById('startBtn').addEventListener('click', startBattle);
  document.getElementById('rematchBtn').addEventListener('click', startBattle);
  document.getElementById('changeBtn').addEventListener('click', ()=>{
    if(rafId) cancelAnimationFrame(rafId);
    paused = false;
    hideTooltip();
    arenaMouse = null; hoveredArenaUnit = null;
    document.getElementById('pauseOverlay').style.display='none';
    document.getElementById('arenaScreen').style.display='none';
    document.getElementById('setup').style.display='flex';
  });

  function togglePause(){
    if(gameOver || document.getElementById('arenaScreen').style.display==='none') return;
    paused = !paused;
    document.getElementById('pauseOverlay').style.display = paused ? 'flex' : 'none';
  }

  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('pauseRematchBtn').addEventListener('click', startBattle);
  document.getElementById('pauseChangeBtn').addEventListener('click', ()=>{
    if(rafId) cancelAnimationFrame(rafId);
    paused = false;
    hideTooltip();
    arenaMouse = null; hoveredArenaUnit = null;
    document.getElementById('pauseOverlay').style.display='none';
    document.getElementById('arenaScreen').style.display='none';
    document.getElementById('setup').style.display='flex';
  });
  document.addEventListener('keydown', event=>{
    if(event.key==='Escape'){
      event.preventDefault();
      togglePause();
    }
  });

})();

</script>
