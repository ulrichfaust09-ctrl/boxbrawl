      dmg*=(1-(D.blockStart+(D.blockEnd-D.blockStart)*prog));
    }
    if(target.defKey==='construction' && hasModifier(target,'oneWithWall')){
      const D=DEFS.construction;
      if(dmg>D.negateThreshold) constructionWalls.forEach(w=>{ if(w.team===target.team) w.durability--; });
      dmg*=(1-D.negateChance);
    }
    if(target.defKey==='boxing' && target.parryOn && attacker && attacker!==target && !parryBypass && !(target.shrineLockT>0)){
      const pc=target.hp<target.maxhp*DEFS.boxing.parryLowHp?DEFS.boxing.parryChanceLow:DEFS.boxing.parryChance;
      if(Math.random()<pc){
        addFloater(target.x,target.y-target.r-18,'PARRY!','#9de7ff');
        if(dodgeSource){ dodgeSource.vx=-dodgeSource.vx; dodgeSource.vy=-dodgeSource.vy; }
        else { parryBypass=true; dealDamage(target,attacker,dmg,null,true); parryBypass=false; }
        return false;
      }
    }
    if(target.defKey==='boxing' && attacker && attacker!==target && !target.invincible && !(target.shrineLockT>0) && Math.random()<boxingDodgeNow(target)){
      const src=dodgeSource||attacker;
      const ddx=target.x-src.x, ddy=target.y-src.y, dl=Math.hypot(ddx,ddy)||1, nx=ddx/dl, ny=ddy/dl;
      target.x=clamp(target.x+nx*DEFS.boxing.dodgeStep,BOX.left+target.r,BOX.right-target.r);
      target.y=clamp(target.y+ny*DEFS.boxing.dodgeStep,BOX.top+target.r,BOX.bottom-target.r);
      target.vx=nx*DEFS.boxing.dodgePush; target.vy=ny*DEFS.boxing.dodgePush;
      addFloater(target.x,target.y-target.r-16,'DODGE!','#9de7ff');
      target.dodgePunch=true;
      return false;
    }
    if(target.defKey==='gravity' && attacker && attacker!==target && dist(attacker,target) < attacker.r+target.r+14){
      addFloater(target.x,target.y-target.r-18,'NO EFFECT','#c08cff');
      return false;
    }
    if(target.baseDefKey==='pocketeer'&&target.pocketDodgeT>0&&target.modifiers.prepared&&Math.random()<0.2){
      addFloater(target.x,target.y-target.r-18,'DODGE!','#9de7ff');
      return false;
    }
    if(target.defKey==='oldguy' && target.pigeonRing && target.pigeonRing.length && dmg>0){
      dmg=oldGuyAbsorb(target,dmg);
      if(dmg<=0) return false;
    }
    if(target.naughtyT>0) dmg*=1.25;
    let shieldDamage=0;
    if(target.shield>0){ const ab=Math.min(target.shield,dmg); target.shield-=ab; dmg-=ab; shieldDamage=ab; ring(target.x,target.y,'#ffffff',target.r+20); if(dmg<=0.01){ countPocketeerDamage(target,shieldDamage); return false; } }
    const before=target.hp, dt0=target.damageTaken||0, wasAlive=target.alive;
    const r=dealDamageCore(attacker,target,dmg,knockDir,noKnockback,forceMult);
    const dealt=before-target.hp, killed=wasAlive&&!target.alive;
    const damageTaken=Math.max(dealt,(target.damageTaken||0)-dt0);
    if(target.defKey==='megaphone' && damageTaken>0) megaphoneYell(target,damageTaken);
    countPocketeerDamage(target,shieldDamage+damageTaken);
    if(attacker&&attacker.defKey==='scythe'&&dealt>0){
      attacker.scytheDamageProgress=(attacker.scytheDamageProgress||0)+dealt;
      if(attacker.scytheDamageProgress>=50){
        attacker.scytheDamageProgress%=50;
        attacker.scytheDamageBuffT=4;
        addFloater(attacker.x,attacker.y-attacker.r-18,'REAPING FORCE!','#c78bff');
      }
    }
    if(killed && modeKey==='infinite' && target.defKey==='henchman' && target.team==='B'){ comboN=comboT>0?comboN+1:1; comboT=2.5; infKills++; score+=10+Math.min(20,comboN*2); addFloater(target.x,target.y-target.r-24,'+'+(10+Math.min(20,comboN*2)),'#ffd24a'); }
    if(stats){
      const amt=Math.max(dealt,(target.damageTaken||0)-dt0);
      if(amt>0){
        if(attacker&&attacker.defKey&&DEFS[attacker.defKey]){ const ra=rowFor(attacker); ra.dealt+=amt; ra.hits++; ra.best=Math.max(ra.best,amt); if(killed) ra.kills++; if(attacker.team==='A') stats.dA+=amt; else stats.dB+=amt; }
        rowFor(target).taken+=amt;
      }
    }
    if(dealt>0) hitFx(attacker,target,dealt,killed,batch);
    if(dealt>0){ const h=getCharHook(target.defKey,'onDamageTaken'); if(h) h({unit:target,target,attacker,dealt,hasModifier}); }
    if(killed && cfg.kill){
      const tm=teams.find(t=>t.id===target.team), wiped=!!tm && tm.units.every(u=>!u.alive);
      const multi=stats && (stats.t-lastKillT<0.3), henchish=(target.defKey==='henchman'||target.defKey==='skeleton');
      const sliced=!wiped || multi || henchish;
      if(stats) lastKillT=stats.t;
      if(sliced){
        const d=DEFS[target.defKey]||{emoji:'?'}, src=attacker&&attacker.alive!==undefined?attacker:null;
        slices.push({x:target.x,y:target.y,r:target.r,emoji:d.emoji,color:teamColor(target.team),ax:src?src.x:target.x-target.r*2,ay:src?src.y:target.y-target.r*2,age:0});
        { const q_=slices[slices.length-1]; q_.model=sliceModel(5,Math.atan2(q_.y-q_.ay,q_.x-q_.ax),q_.r); shakeT=Math.max(shakeT,0.15); shakeMag=Math.max(shakeMag,4); }
        hitstop=Math.max(hitstop,0.5);
      }
      if(wiped) finalKill={v:target,a:attacker,sliced};
    }
    return r;
  }
  function dealDamageCore(attacker, target, dmg, knockDir, noKnockback, forceMult){
    if(!target || !target.alive) return false;
    if(target.invincible) return false;

    if(target.defKey==='knight' && target.knightArmorHits>0){
      const breaksArmor = !hasModifier(target, 'blastProof') || dmg>100;
      if(breaksArmor) target.knightArmorHits--;
      addFloater(target.x,target.y-target.r-18,breaksArmor?'ARMOR BREAK':'BLOCKED','#ffe066');
      if(attacker && attacker.defKey==='exploding' && dmg>=DEFS.exploding.explosionDamage){
        log(`🛡️ Knight Guy blocks the explosion!`, true);
      }
      return false;
    }

    const parrySuccess = (target.defKey==='parry') && target.parryCd<=0;

    if(target.defKey==='exploding' && !target.bombArmed && target.alive){
      armBomb(target);
    }

    if(parrySuccess){
      target.parryCd = DEFS.parry.parryCooldown;
      addFloater(target.x, target.y-target.r-16, 'PARRY!', '#ffe066');
      log(`🥋 Parry Guy negates the hit and sends it right back!`, true);
      if(attacker && attacker.alive){
        applyKnockback(target, attacker, knockDir ? {x:-knockDir.x,y:-knockDir.y} : undefined);
        if(!attacker.invincible){
          const reflected = Math.round(dmg*(hasModifier(target,'trickshot')?1.5:1));
          attacker.hp -= reflected;
          addFloater(attacker.x, attacker.y-attacker.r-4, `-${reflected}`, '#ff5b5b');
          killCheck(attacker, target);
        }
      }
      if(hasModifier(target, 'successfulParry')){
        target.hp = Math.min(target.maxhp, target.hp+25);
        addFloater(target.x, target.y-target.r-18, '+25 HP', '#8fffb0');
      }
      return true;
    }

    let finalDamage = dmg;
    { const h=getCharHook(target.defKey,'onDamagePreArmor'); if(h) h({unit:target,target,attacker,dmg:finalDamage,hasModifier}); }
    if(target.armor>0) finalDamage = Math.max(1, finalDamage-target.armor);
    { const h=getCharHook(target.defKey,'onDamagePostArmor'); if(h){ const r=h({unit:target,target,attacker,dmg:finalDamage,hasModifier}); if(typeof r==='number') finalDamage=r; } }
    if(target.defKey==='necromancer' && hasModifier(target, 'protected')){
      const team = teams.find(t=>t.id===target.team);
      const skellies = aliveUnits(team || {units:[]}).filter(u=>u.defKey==='skeleton');
      const shared = finalDamage*0.5;
      finalDamage *= 0.5;
      if(skellies.length){
        const each = shared/skellies.length;
        for(const skeleton of skellies){
          skeleton.hp -= each;
          addFloater(skeleton.x, skeleton.y-skeleton.r-4, `-${Math.round(each)}`, '#ff8a5b');
          killCheck(skeleton, attacker);
        }
      } else {
        finalDamage += shared;
      }
    }
    if(gameMode==='timed'){
      target.damageTaken=(target.damageTaken||0)+finalDamage;
      addFloater(target.x,target.y-target.r-4,`-${Math.round(finalDamage)}`,'#ff8a5b');
      if(attacker && !noKnockback) applyKnockback(attacker,target,knockDir);
      return true;
    }
    target.hp -= finalDamage;
    addFloater(target.x, target.y-target.r-4, `-${Math.round(finalDamage)}`, '#ff8a5b');
    if(attacker && hasModifier(attacker, 'stunlock')){
      applyStun(target, 0.175);
      target.passiveDisabled = Math.max(target.passiveDisabled || 0, 0.175);
    }
    if(attacker){
      const h=getCharHook(attacker.defKey,'onDamageDealt');
      if(h) h({unit:attacker,attacker,target,dealt:finalDamage,hasModifier,addFloater,applyStun,disableAttacks,bolts});
    }
    {
      const h=getCharHook(target.defKey,'onDamageTakenFinal');
      if(h) h({unit:target,target,attacker,dealt:finalDamage,hasModifier,addFloater,applyStun,disableAttacks,bolts});
    }
    if(attacker && !noKnockback) applyKnockback(attacker, target, knockDir, forceMult);
    killCheck(target, attacker);
    return true;
  }

  // ------------- main update -------------
  const NEAR_WALL_DIST = 55;
  const NEAR_UNIT_DIST = 75;
  const NEAR_SPEED_FACTOR = 1.2;

  function update(dt){
    if(gameOver || paused) return;
    updateMegaphoneWaves(dt);
    updateOldGuy(dt);
    updateCanadian(dt);
    updateGuitar(dt);
    updateGravity(dt);
    updatePaint(dt);
    updateBaker(dt);
    updateJack(dt);
    updateBoxingExtras(dt);
    updateEquitation(dt);
    updateConstruction(dt);
    updateAlienWindup(dt);
    updateFlintlock(dt);
    meleeClock+=dt;
    updateGic(dt);
    updateSukuna(dt);
    updateCactus(dt);
    if(gameMode==='timed'){
      modeTimeRemaining=Math.max(0,modeTimeRemaining-dt);
      if(modeTimeRemaining<=0){ endTimedGame(); return; }
    }
    updateWeather(dt);
    if(gameOver) return;

    const allAliveNow = teams.flatMap(t=>aliveUnits(t));

    for(const team of teams){
      const enemy = otherTeam(team);
      for(const unit of aliveUnits(team)){
        const d = DEFS[unit.defKey];

        if(unit.parryCd>0){ unit.parryCd = Math.max(0, unit.parryCd - dt); }
        if(unit.stunTimer>0) unit.stunTimer = Math.max(0, unit.stunTimer-dt);
        if(unit.passiveDisabled>0) unit.passiveDisabled = Math.max(0, unit.passiveDisabled-dt);
        if(unit.statusResist>0) unit.statusResist = Math.max(0, unit.statusResist-dt);
        if(unit.speedBoostTimer>0) unit.speedBoostTimer = Math.max(0, unit.speedBoostTimer-dt);
        if(unit.scytheDamageBuffT>0) unit.scytheDamageBuffT = Math.max(0,unit.scytheDamageBuffT-dt);
        if(unit.invulnTimer > 0){
          unit.invulnTimer = Math.max(0, unit.invulnTimer - dt);
          if(unit.invulnTimer <= 0) unit.invincible = false;
        }
        if(unit.defKey==='exploding' && unit.bombArmed){
          if(unit.passiveDisabled<=0) unit.bombTimer -= dt;
          if(unit.bombTimer <= 0){
            unit.bombArmed = false;
            unit.bombTriggered = true;
            const explodeTarget = nearestEnemy(unit, otherTeam(team));
            addFloater(unit.x, unit.y-unit.r-12, 'EXPLODE!', '#ff8a5b');
            log(`💥 ${DEFS[unit.defKey].name} detonates!`, true);
            if(explodeTarget && explodeTarget.alive){
              dealDamage(unit, explodeTarget, DEFS.exploding.explosionDamage);
            }
            if(gameMode!=='timed'){
              unit.hp = 0;
              unit.alive = false;
              killCheck(unit, explodeTarget || unit);
            }
          }
        }

        if(unit.defKey==='drunk' && hasModifier(unit, 'hammered') && !unit.hammeredCutscene && !unit.frenzy && unit.hp/unit.maxhp < 0.5){
          unit.hammeredCutscene = true;
          unit.hammeredTimer = 2.2;
          unit.attackDisabled = unit.hammeredTimer;
          log(`🍺 Drunk Guy starts the five-beer cutscene!`, true);
        }
        if(unit.hammeredCutscene){
          unit.hammeredTimer -= dt;
          if(unit.hammeredTimer<=0){
            unit.hammeredCutscene = false;
            unit.frenzy = true;
            log(`🔥 Drunk Guy enters a beer frenzy!`, true);
          }
        }

        // ---- movement ----
        if(unit.defKey==='drunk'){
          unit.drunkTimer -= dt;
          if(unit.drunkTimer<=0){
            const ang = rand(0,Math.PI*2);
            const spd = rand(70,220);
            unit.vx = Math.cos(ang)*spd;
            unit.vy = Math.sin(ang)*spd;
            unit.drunkTimer = rand(0.25,0.6);
          }
        }
          if(unit.attackDisabled>0) unit.attackDisabled = Math.max(0, unit.attackDisabled-dt);
        let moveFactor = 1;
        if(!((unit.defKey==='football') && unit.charging)){
          const nearWall = (unit.x-unit.r-BOX.left < NEAR_WALL_DIST) ||
                            (BOX.right-(unit.x+unit.r) < NEAR_WALL_DIST) ||
                            (unit.y-unit.r-BOX.top < NEAR_WALL_DIST) ||
                            (BOX.bottom-(unit.y+unit.r) < NEAR_WALL_DIST);
          let nearUnit = false;
          if(!nearWall){
            for(const other of allAliveNow){
              if(other===unit) continue;
              if(unit.defKey==='ghost' || other.defKey==='ghost') continue;
              if(unit.defKey==='equitation' || other.defKey==='equitation') continue;
              if(dist(unit,other)-(unit.r+other.r) < NEAR_UNIT_DIST){ nearUnit=true; break; }
            }
          }
          if(nearWall || nearUnit) moveFactor = NEAR_SPEED_FACTOR;
        }
        if(unit.defKey==='scythe' && unit.scytheKillStacks) moveFactor *= 1+0.025*unit.scytheKillStacks;
        if(unit.defKey==='scythe' && unit.scytheDamageBuffT>0) moveFactor *= 1.25;
        if(unit.defKey==='drunk' && unit.frenzy) moveFactor *= 1.33;
        if(unit.speedBoostTimer>0 && unit.speedBoostAmount) moveFactor *= 1+unit.speedBoostAmount;
        if(unit.speedMultiplier) moveFactor *= unit.speedMultiplier;
        if(unit.poopSlowT>0) moveFactor *= DEFS.oldguy.poopSlow;
        if(unit.defKey==='parry' && hasModifier(unit,'trickshot')) moveFactor *= 1.25;
        if(unit.paintSlowMult && unit.paintSlowMult<1) moveFactor *= unit.paintSlowMult;
        if(unit.chocoSlowT>0) moveFactor *= (1-(unit.chocoSlow||0.7));
        if(unit.jackHold) moveFactor = 0;
        if(unit.yellowSnows && unit.yellowSnows.length) moveFactor *= Math.max(0.05, 1-DEFS.canadian.yellowSlow*unit.yellowSnows.length);
        if(unit.refereeSlowStacks) moveFactor *= (1 - 0.1*unit.refereeSlowStacks);
        if(unit.defKey==='barbarian' && hasModifier(unit,'frenzy') && unit.frenzyTimer>0) moveFactor *= 1+0.2*(unit.frenzyStacks||0);
        if(unit.defKey==='fireworks') moveFactor *= 1 + Math.min(unit.fireworkSpeedBoost, 2);
        if(unit.defKey==='detective') moveFactor *= 1 + Math.min(unit.detectiveSpeedBoost, 0.5);
        if(unit.defKey==='blind') moveFactor *= 1 + (unit.blindSpeedBonus||0);
        if(unit.defKey==='gwnn'){
          unit.y = unit.laneY;
          unit.vy = 0;
        }
        if(unit.defKey==='chihuahua' && unit.leashOwner && unit.leashOwner.alive && !hasModifier(unit,'unleashed')){
          const leashRadius = DEFS.chihuahua.leashRadius||120;
          if(dist(unit, unit.leashOwner) > leashRadius){
            const ldx=unit.leashOwner.x-unit.x, ldy=unit.leashOwner.y-unit.y, llen=Math.hypot(ldx,ldy)||1;
            const lspd=Math.hypot(unit.vx,unit.vy)||DEFS.chihuahua.speed;
            unit.vx = ldx/llen*lspd; unit.vy = ldy/llen*lspd;
          }
        }

        if(unit.stunTimer<=0){
          unit.x += unit.vx*dt*moveFactor;
          if(unit.defKey!=='gwnn') unit.y += unit.vy*dt*moveFactor;
        }

        let bounced=false, wallDirection=null;
        if(unit.x-unit.r < BOX.left){ unit.x=BOX.left+unit.r; unit.vx=Math.abs(unit.vx); bounced=true; wallDirection={x:1,y:0}; }
        if(unit.x+unit.r > BOX.right){ unit.x=BOX.right-unit.r; unit.vx=-Math.abs(unit.vx); bounced=true; wallDirection={x:-1,y:0}; }
        if(unit.y-unit.r < BOX.top){ unit.y=BOX.top+unit.r; unit.vy=Math.abs(unit.vy); bounced=true; wallDirection={x:0,y:1}; }
        if(unit.y+unit.r > BOX.bottom){ unit.y=BOX.bottom-unit.r; unit.vy=-Math.abs(unit.vy); bounced=true; wallDirection={x:0,y:-1}; }
        if(bounced && unit.defKey==='fireworks' && wallDirection){
          const count = hasModifier(unit, 'sparks') ? 2 : 1;
          for(let fireworkIndex=0;fireworkIndex<count;fireworkIndex++){
            projectiles.push({x:unit.x+wallDirection.x*unit.r,y:unit.y+wallDirection.y*unit.r,
              vx:0,vy:0,r:DEFS.fireworks.fireworkR,dmg:DEFS.fireworks.fireworkDamage*(hasModifier(unit,'sparks')?0.3:1),
              team:team.id,owner:unit,kind:'firework',fuse:0.5,launched:false,dir:{...wallDirection},hitUnits:{}});
          }
              log(`🎆 Fireworks Guy plants ${count} firework${count>1?'s':''} on the wall!`, true);
        }
        if(bounced && unit.defKey==='detective' && wallDirection) placeDetectiveTape(unit, wallDirection);
        if(bounced && (unit.defKey==='drunk')){
          const wobble = rand(-0.6,0.6);
          const cos=Math.cos(wobble), sin=Math.sin(wobble);
          const nvx = unit.vx*cos - unit.vy*sin;
          const nvy = unit.vx*sin + unit.vy*cos;
          unit.vx=nvx; unit.vy=nvy;
        }
        if(bounced && (unit.defKey==='football') && unit.charging){
          endCharge(unit);
        }
      }
    }

    // ---- collisions between all alive units (any team) ----
    const all = teams.flatMap(t=>aliveUnits(t));
    for(let i=0;i<all.length;i++){
      for(let j=i+1;j<all.length;j++){
        const u1=all[i], u2=all[j];
        const dx=u2.x-u1.x, dy=u2.y-u1.y;
        const d = Math.hypot(dx,dy) || 0.0001;
        const minD = u1.r+u2.r;
        if(d < minD && u1.defKey!=='ghost' && u2.defKey!=='ghost' && u1.defKey!=='equitation' && u2.defKey!=='equitation'){
          const nx=dx/d, ny=dy/d;
          const overlap = (minD-d)/2;
          u1.x -= nx*overlap; u1.y -= ny*overlap;
          u2.x += nx*overlap; u2.y += ny*overlap;
          const v1n = u1.vx*nx+u1.vy*ny;
          const v2n = u2.vx*nx+u2.vy*ny;
          u1.vx += (v2n-v1n)*nx; u1.vy += (v2n-v1n)*ny;
          u2.vx += (v1n-v2n)*nx; u2.vy += (v1n-v2n)*ny;
          if(u1.defKey==='blind') u1.blindAlert=true;
          if(u2.defKey==='blind') u2.blindAlert=true;
        }
      }
    }

    // ---- football guy charge contact ----
    for(const team of teams){
      for(const unit of aliveUnits(team)){
        if((unit.defKey==='football') && unit.charging && unit.chargeTarget && unit.chargeTarget.alive){
          const t = unit.chargeTarget;
          if(dist(unit,t) < unit.r+t.r){
            const dmg = DEFS.football.chargeDamage + (hasModifier(unit, 'tackle') ? unit.hp*0.1 : 0);
            dealDamage(unit, t, dmg);
            if(hasModifier(unit, 'tackle')) applyStun(t, 0.7);
            if(hasModifier(unit, 'nfl')){
              unit.statusResist = 1.3;
              if(t.alive) applyKnockback(unit, t, {x:unit.vx*1.5,y:unit.vy*1.5});
            }
            log(`🏈 Football Guy bulldozes for ${dmg}!`, true);
            endCharge(unit);
          }
        }
      }
    }

    // ---- attacks & specials ----
    for(const team of teams){
      const enemy = otherTeam(team);
      for(const unit of aliveUnits(team)){
        if(unit.defKey==='pocketeer'){
          unit.pocketStealCd-=dt;
          unit.pocketDodgeT=Math.max(0,(unit.pocketDodgeT||0)-dt);
          if(unit.pocketStealCd<=0){
            unit.pocketStealCd=15;
            const enemyTeam=otherTeam(team);
            const candidates=aliveUnits(enemyTeam).filter(e=>DEFS[e.defKey]&&DEFS[e.defKey].selectable!==false);
            for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
            const count=unit.modifiers.masterRobber?2:1;
            unit.pocketStolen=candidates.slice(0,count).map(source=>({key:source.defKey,modifiers:{...source.modifiers},sourceId:source.id}));
            unit.pocketDamage=0;
            unit.pocketAbilityStates={};
            if(unit.pocketStolen.length){
              if(unit.modifiers.prepared){
                grantMovementSpeed(unit,0.5,3);
                unit.pocketDodgeT=3;
              }
              addFloater(unit.x,unit.y-unit.r-18,`STOLE ${unit.pocketStolen.map(s=>DEFS[s.key].name).join(' + ')}!`,'#ffd479');
              log(`🦝 Pocketeer steals ${unit.pocketStolen.map(s=>DEFS[s.key].name).join(' and ')}!`,true);
            }
          }
        }
        const cooldownDt=dt*(unit.attackSpeedMultiplier||1);
        unit.cdBlacksmith -= cooldownDt;
        unit.cdAngry -= cooldownDt;
        unit.cdHenchman -= cooldownDt;
        unit.cdDrunk -= cooldownDt;
        unit.cdManager -= cooldownDt;
        unit.cdTraffic -= cooldownDt;
        unit.cdPriest -= cooldownDt;
        unit.cdLaser -= cooldownDt;
        unit.cdWeather -= cooldownDt;
        unit.cdFootball -= cooldownDt;
        unit.cdChess -= cooldownDt;
        unit.cdSentient -= cooldownDt;

            unit.vx = dx/len*dF.chargeSpeed;
            unit.vy = dy/len*dF.chargeSpeed;
            unit.cdFootball = dF.chargeInterval * (hasModifier(unit, 'nfl') ? 0.56 : 1);
            log(`🏈 ${DEFS[unit.defKey].name} locks on and charges!`, true);
          }
        }

        if(unit.defKey==='chess'){
          const dC = DEFS.chess;
          if(target && unit.cdChess<=0){
            const sequence = ['pawn','knight','bishop','rook','queen'];
            const phase = sequence[unit.chessStage % sequence.length];
            unit.chessStage += 1;
            unit.cdChess = dC.attackInterval * (hasModifier(unit, 'blitz') ? 0.67 : 1);

            if(phase === 'pawn'){
              for(const dir of chessPatternDirs('pawn')){
                const angle = dir * Math.PI / 180;
                const spawnX = unit.x + Math.cos(angle) * (unit.r + 18);
                const spawnY = unit.y + Math.sin(angle) * (unit.r + 18);
                spawnDirectionalProjectile({
                  x: spawnX,
                  y: spawnY,
                  team: team.id,
                  owner: unit,
                  angle,
                  speed: dC.pawnSpeed,
                  r: 12,
                  dmg: dC.pawnDamage,
                  kind: 'pawn'
                });
              }
            }

            if(phase === 'knight'){
              for(const dir of chessPatternDirs('knight')){
                const angle = dir * Math.PI / 180;
                const spawnX = unit.x + Math.cos(angle) * (unit.r + 18);
                const spawnY = unit.y + Math.sin(angle) * (unit.r + 18);
                spawnDirectionalProjectile({
                  x: spawnX,
                  y: spawnY,
                  team: team.id,
                  owner: unit,
                  angle,
                  speed: dC.knightSpeed,
                  r: 14,
                  dmg: dC.knightDamage,
                  kind: 'knight',
                  extra: { turnTimer: 0.35, lTurns: 0 }
                });
              }
            }

            if(phase === 'bishop'){
              for(const dir of chessPatternDirs('bishop')){
                const angle = dir * Math.PI / 180;
                const spawnX = unit.x + Math.cos(angle) * (unit.r + 18);
                const spawnY = unit.y + Math.sin(angle) * (unit.r + 18);
                spawnDirectionalProjectile({
                  x: spawnX,
                  y: spawnY,
                  team: team.id,
                  owner: unit,
                  angle,
                  speed: dC.bishopSpeed,
                  r: 13,
                  dmg: dC.bishopDamage,
                  kind: 'bishop'
                });
              }
            }

            if(phase === 'rook'){
              for(const dir of chessPatternDirs('rook')){
                const angle = dir * Math.PI / 180;
                const spawnX = unit.x + Math.cos(angle) * (unit.r + 18);
                const spawnY = unit.y + Math.sin(angle) * (unit.r + 18);
                spawnDirectionalProjectile({
                  x: spawnX,
                  y: spawnY,
                  team: team.id,
                  owner: unit,
                  angle,
                  speed: dC.rookSpeed,
                  r: 14,
                  dmg: dC.rookDamage,
                  kind: 'rook',
                  extra: { knockout: true }
                });
              }
            }

            if(phase === 'queen'){
              const dx = target.x - unit.x;
              const dy = target.y - unit.y;
              const snapAngle = snapToEightDirection(dx, dy);
              const spawnX = unit.x + Math.cos(snapAngle) * (unit.r + 18);
              const spawnY = unit.y + Math.sin(snapAngle) * (unit.r + 18);
              spawnDirectionalProjectile({
                x: spawnX,
                y: spawnY,
                team: team.id,
                owner: unit,
                angle: snapAngle,
                speed: dC.queenSpeed,
                r: 16,
                dmg: dC.queenDamage,
                kind: 'queen'
              });
            }

            log(`♟️ ${DEFS[unit.defKey].name} unleashes ${phase}!`, true);
          }
        }

        if(unit.defKey==='sentient'){
          const dS = DEFS.sentient;
          if(target && unit.cdSentient<=0){
            unit.cdSentient = dS.fireRate;
            const dx = target.x - unit.x;
            const dy = target.y - unit.y;
            const snap = hasModifier(unit, 'omnidirectional') ? Math.atan2(dy, dx) : snapToEightDirection(dx, dy);
            const speed = dS.projSpeed;
            const spawnX = unit.x + Math.cos(snap) * (unit.r + 18);
            const spawnY = unit.y + Math.sin(snap) * (unit.r + 18);
            projectiles.push({
              x: spawnX,
              y: spawnY,
              vx: Math.cos(snap) * speed,
              vy: Math.sin(snap) * speed,
              r: 10,
              dmg: dS.dmg + (hasModifier(unit, 'stunlock') ? 20 : 0),
              team: team.id,
              owner: unit,
              kind: 'sentient'
            });
            log(`🤖 ${DEFS[unit.defKey].name} fires on an 8-way vector.`, true);
          }
        }

          } finally {
            if(ability){
              for(let i=projectileStart;i<projectiles.length;i++){
                if(projectiles[i].owner===unit){
                  projectiles[i].pocketModifiers={...ability.modifiers};
                  projectiles[i].pocketAbilityKey=ability.key;
                }
              }
              Object.assign(state,{cd2:unit.cd2,cd3:unit.cd3,cdFactorial:unit.cdFactorial,cdFibonacci:unit.cdFibonacci,
                factorialIndex:unit.factorialIndex,fibonacciA:unit.fibonacciA,fibonacciB:unit.fibonacciB,fibonacciTotal:unit.fibonacciTotal,fibonacciRecent:unit.fibonacciRecent});
              Object.assign(unit,nativeAbilityState);
            }
            unit.defKey=nativeDefKey;
            unit.modifiers=nativeModifiers;
          }
        }
      }

      // Henchmen team-wide spawn — keeps ticking even while none are currently on the field.
      
      if(team.infinite){
        const wave=Math.floor((stats?stats.t:0)/15)+1; team.wave=wave;
        team.spawnTimer+=dt;
        if(team.spawnTimer>=Math.max(0.7,2.5-0.15*wave)){
          team.spawnTimer=0;
          if(team.units.length>60) team.units=team.units.filter(u=>u.alive);
          const alive=aliveUnits(team).length, batch=Math.min(6,1+wave);
          for(let i=0;i<batch && alive+i<35;i++){
            const edge=Math.floor(Math.random()*4);
            const nx=edge===0?BOX.left+20:edge===1?BOX.right-20:rand(BOX.left+20,BOX.right-20);
            const ny=edge===2?BOX.top+20:edge===3?BOX.bottom-20:rand(BOX.top+20,BOX.bottom-20);
            const nu=makeUnit('henchman',team.id,nx,ny,{});
            nu.hp*=1+0.08*(wave-1); nu.maxhp=nu.hp;
            team.units.push(nu); team.spawnedCount++;
          }
        }
      }
      if(!team.infinite && (team.defKey==='henchman')){
        team.spawnTimer += dt;
        if(team.spawnTimer >= DEFS.henchman.spawnInterval){
          team.spawnTimer -= DEFS.henchman.spawnInterval;
          const maxCount = DEFS.henchman.maxCount + (team.modifiers.squadron ? 10 : 0);
          if(team.spawnedCount < maxCount){
            const remaining = maxCount - team.spawnedCount;
            const batchSize = 3 + (team.modifiers.squadron ? 1 : 0);
            const batch = Math.min(batchSize, remaining);
            for(let i=0;i<batch;i++){
              const src = aliveUnits(team)[0];
              const baseX = src ? src.x : team.homeX;
              const baseY = src ? src.y : team.homeY;
              const ang = rand(0,Math.PI*2);
              const nx = clamp(baseX + Math.cos(ang)*40, BOX.left+20, BOX.right-20);
              const ny = clamp(baseY + Math.sin(ang)*40, BOX.top+20, BOX.bottom-20);
              const nu = makeUnit('henchman', team.id, nx, ny, team.modifiers);
              team.units.push(nu);
              team.spawnedCount++;
            }
            log(`👊 Team ${team.id} mob grows — Henchman ${team.spawnedCount}/${DEFS.henchman.maxCount}.`, true);
          }
        }
      }
    }

    for(const wall of tapeWalls){
      wall.hitCooldown = Math.max(0,(wall.hitCooldown||0)-dt);
      if(wall.hitCooldown>0) continue;
      const dx=wall.x2-wall.x1, dy=wall.y2-wall.y1;
      const len2=dx*dx+dy*dy||1;
      const enemyTeam=teams.find(t=>t.id!==wall.owner.team);
      for(const unit of aliveUnits(enemyTeam || {units:[]})){
        const t=clamp(((unit.x-wall.x1)*dx+(unit.y-wall.y1)*dy)/len2,0,1);
        const px=wall.x1+dx*t, py=wall.y1+dy*t;
        if(Math.hypot(unit.x-px,unit.y-py)<unit.r+8){
          const damage=DEFS.detective.tapeDamage*(1+(wall.owner.detectiveDamageBoost||wall.damageBoost||0));
          dealDamage(wall.owner,unit,damage,null,true);
          wall.hitCooldown=0.45;
          break;
        }
      }
    }

    // ---- projectiles ----
    for(let i=projectiles.length-1;i>=0;i--){
      const p = projectiles[i];
      if(p.hitUnits){
        for(const id of Object.keys(p.hitUnits)){
          if(p.hitUnits[id] !== Infinity) p.hitUnits[id] -= dt;
        }
      }
      if(p.kind==='knife' && p.stuck){
        if(p.stuckTarget && p.stuckTarget.alive){
          p.x = p.stuckTarget.x + p.offsetX;
          p.y = p.stuckTarget.y + p.offsetY;
          if(p.preciseTimer>0){
            p.preciseTimer -= dt;
            p.damageTimer -= dt;
            if(p.damageTimer<=0){ dealDamage(p.owner, p.stuckTarget, 20, null, true); p.damageTimer=1; }
            if(p.preciseTimer<=0){ p.stuckTarget=null; }
          }
        }
        if(p.owner && dist(p.owner,p)<p.owner.r+34){
          if(p.stuckTarget && p.stuckTarget.alive && projectileHasModifier(p,'preciseCuts')) dealDamage(p.owner,p.stuckTarget,150,null,true);
          if(projectileHasModifier(p,'cook')){
            p.owner.hp=Math.min(p.owner.maxhp,p.owner.hp+10);
            addFloater(p.owner.x,p.owner.y-p.owner.r-12,'+10 HP','#8fffb0');
          }
          p.owner.activeKnives=Math.max(0,p.owner.activeKnives-1);
          projectiles.splice(i,1); continue;
        }
        continue;
      }
      if(p.kind==='firework' && !p.launched){
        p.fuse -= dt;
        if(p.fuse<=0){ p.launched=true; p.vx=p.dir.x*DEFS.fireworks.fireworkSpeed; p.vy=p.dir.y*DEFS.fireworks.fireworkSpeed; }
        continue;
      }
      if(p.kind === 'knight' && p.turnTimer <= 0){
        if(p.lTurns >= 1){
          projectiles.splice(i,1);
          continue;
        }
        const cos = Math.cos(Math.PI / 2), sin = Math.sin(Math.PI / 2);
        const nx = p.vx * cos - p.vy * sin;
        const ny = p.vx * sin + p.vy * cos;
        p.vx = nx;
        p.vy = ny;
        p.lTurns += 1;
        p.turnTimer = 0.38;
      }
      p.turnTimer = Math.max(0, (p.turnTimer || 0) - dt);
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.x<BOX.left||p.x>BOX.right||p.y<BOX.top||p.y>BOX.bottom){
        if(p.kind==='firework'){
          p.x=clamp(p.x,BOX.left,BOX.right); p.y=clamp(p.y,BOX.top,BOX.bottom);
          explodeFirework(p); projectiles.splice(i,1); continue;
        }
        if(p.kind==='knife'){
          p.x=clamp(p.x,BOX.left,BOX.right); p.y=clamp(p.y,BOX.top,BOX.bottom);
          p.stuck=true; p.stuckTarget=null; log(`🔪 Chef knife sticks to the wall!`); continue;
        }
        if(p.kind==='nailPolish' && p.owner && !projectileHasModifier(p, 'skinCare')) p.owner.womanStacks = 0;
        if(p.kind==='suitcase' || p.kind==='bossSuitcase' || p.kind==='bossBonus'){
          spawnPapers(clamp(p.x,BOX.left,BOX.right), clamp(p.y,BOX.top,BOX.bottom), p.team, p.owner, p.kind==='bossSuitcase' ? 16 : 8);
        }
        if(p.kind==='glassbeer'){
          spawnGlassSpikes(clamp(p.x,BOX.left,BOX.right), clamp(p.y,BOX.top,BOX.bottom), p.owner);
        }
        projectiles.splice(i,1); continue;
      }
      const hitWall=wallHitBy(p.x,p.y,p.r||6,p.team);
      if(hitWall){
        hitWall.durability--;
        if(p.x<hitWall.x-hitWall.w/2 || p.x>hitWall.x+hitWall.w/2) p.vx=-p.vx; else p.vy=-p.vy;
        p.x+=p.vx*0.05; p.y+=p.vy*0.05;
        addFloater(hitWall.x,hitWall.y-hitWall.h/2-6,'BOUNCE','#ffe0b0');
        continue;
      }
      const enemyTeam = teams.find(t=>t.id!==p.team);
      let hit=false;
      for(const u of aliveUnits(enemyTeam)){
        if(u.invincible) continue;
        if(p.hitUnits && p.hitUnits[u.id] > 0) continue;
        if(Math.hypot(u.x-p.x,u.y-p.y) < u.r+p.r){
          if(false){
            const ddx=u.x-p.x, ddy=u.y-p.y, dlen=Math.hypot(ddx,ddy)||1;
            const dnx=ddx/dlen, dny=ddy/dlen;
            u.vx = dnx*260; u.vy = dny*260;
            addFloater(u.x, u.y-u.r-16, 'DODGE!', '#9de7ff');
            log(`🥊 Boxing Guy slips the hit!`, true);
            continue;
          }
          const isCar = p.kind==='car';
          const isTinyFinger = p.kind==='miniMiddlefinger';
          if(p.kind==='card'){
            const wasStunned = u.stunTimer>0;
            const redCard = p.owner && projectileHasModifier(p,'redCard') && wasStunned;
            const cardDmg = redCard ? p.dmg*2 : p.dmg;
            const didCardHit=dealDamage(p.owner,u,cardDmg,{x:p.vx,y:p.vy},true);
            if(didCardHit){
              applyStun(u,0.4);
              if(redCard) addFloater(u.x, u.y-u.r-16, 'RED CARD!', '#ff5b5b');
              if(p.owner && projectileHasModifier(p,'yellowCard')){
                u.refereeSlowStacks=Math.min(3,(u.refereeSlowStacks||0)+1);
              }
            }
            hit=true; break;
          }
          if(p.kind==='zzz'){
            const didSleepHit=dealDamage(p.owner,u,p.dmg,{x:p.vx,y:p.vy},true);
            if(didSleepHit){
              applyStun(u,0.15);
              if(p.owner && projectileHasModifier(p,'sleepy')){
                u.sleepyStacks=(u.sleepyStacks||0)+1;
                if(u.sleepyStacks>=10){
                  u.sleepTimer=0.5; u.sleepyStacks=0;
                  u.speedMultiplier=(u.speedMultiplier||1)*0.8;
                  u.attackSpeedMultiplier=(u.attackSpeedMultiplier||1)*0.9667;
                  log(`😴 ${DEFS[u.defKey].name} falls asleep!`,true);
                }
              }
            }
            hit=true; break;
          }
          dodgeSource=p;
          const didHit = dealDamage(p.owner, u, p.dmg, {x:p.vx,y:p.vy}, p.noKnockback || p.kind === 'rook' || isTinyFinger || isCar ? true : undefined);
          dodgeSource=null;
          if(p.kind === 'rook'){
            applyKnockback(p.owner, u, {x:p.vx,y:p.vy});
          }
          if(isCar && p.pierce){
            applyStun(u, 0.7);
          }
          if(isCar && p.highway){
            applyKnockback(p.owner, u, {x:p.vx*1.5,y:p.vy*1.5});
            u.vx *= 2.5;
            u.vy *= 2.5;
          }
          if(p.kind==='suitcase' || p.kind==='bossSuitcase' || p.kind==='bossBonus'){
            spawnPapers(p.x,p.y,p.team,p.owner, p.kind==='bossSuitcase' ? 16 : 8);
          }
          if(didHit && (p.kind==='suitcase' || p.kind==='bossSuitcase') && p.owner){
            if(projectileHasModifier(p, 'sales')){
              p.owner.hp = Math.min(p.owner.maxhp, p.owner.hp+50);
              addFloater(p.owner.x, p.owner.owner?.r ? p.owner.y-p.owner.r-8 : p.owner.y-60, '+50 HP', '#8fffb0');
              p.owner.managerFastCase = true;
            }
          }
          if(didHit && p.owner && projectileHasModifier(p, 'boss') && (p.kind==='suitcase' || p.kind==='bossSuitcase' || p.kind==='bossBonus' || p.kind==='paper')){
            p.owner.managerHits += 1;
            if(p.owner.managerHits % 5 === 0){
              const forward = Math.atan2(p.vy, p.vx);
              for(let caseIndex=0;caseIndex<3;caseIndex++){
                const spread = (caseIndex-1)*0.16;
                projectiles.push({
                  x:p.owner.x, y:p.owner.y,
                  vx:Math.cos(forward+spread)*DEFS.manager.suitcaseSpeed,
                  vy:Math.sin(forward+spread)*DEFS.manager.suitcaseSpeed,
                  r:DEFS.manager.suitcaseR, dmg:DEFS.manager.suitcaseDamage,
                  team:p.owner.team, owner:p.owner, kind:'bossBonus', hitUnits:{}
                });
              }
              log(`💼 Boss launches 3 bonus briefcases!`, true);
            }
          }
          if(p.kind==='pix' && didHit && p.fx) p.fx(p.owner,u);
          if(p.kind==='pix' && didHit && p.owner && (p.pocketAbilityKey||p.owner.defKey)==='magician' && projectileHasModifier(p,'trick')){
            p.owner.hideTimer=1; p.owner.invincible=true; p.owner.invulnTimer=1; addFloater(p.owner.x,p.owner.y-p.owner.r,'POOF!','#fff');
          }
          if(p.kind==='pix' && didHit && p.owner){
            const o=p.owner, heal=(h)=>{o.hp=Math.min(o.maxhp,o.hp+h);addFloater(o.x,o.y-o.r-12,'+'+h+' HP','#8fffb0');};
            if(o.defKey==='pirate'&&hasModifier(o,'plunder')) heal(20);
            if(o.defKey==='wizard'&&hasModifier(o,'frostbite')) applyStun(u,0.3);
            if(o.defKey==='ninja'&&hasModifier(o,'bloodlust')) heal(8);
            if(o.defKey==='robot'){ if(hasModifier(o,'overclock')) o.pixStacks=(o.pixStacks||0)+1; if(hasModifier(o,'repair')) heal(3); }
          }
          if(p.kind==='glassbeer'){
            spawnGlassSpikes(p.x, p.y, p.owner);
          }
          if(p.kind==='gwnnBullet' && p.owner && projectileHasModifier(p, 'deadshot')){
            u.y = p.owner.y;
            applyStun(u, 0.1);
          }
          if(p.kind==='nailPolish' && p.owner){
            p.owner.womanStacks = Math.min(p.owner.womanStacks + 1, Math.ceil(0.5/0.12));
            p.owner.womanStackTimer = projectileHasModifier(p, 'skinCare') ? 4 : 3;
            if(projectileHasModifier(p, 'selfCare')){
              p.owner.hp = Math.min(p.owner.maxhp, p.owner.hp+15);
              addFloater(p.owner.x, p.owner.y-p.owner.r-16, '+15 HP', '#8fffb0');
            }
          }
          if(p.kind==='knife'){
            if(projectileHasModifier(p,'preciseCuts')){
              p.stuck=true; p.stuckTarget=u; p.offsetX=p.x-u.x; p.offsetY=p.y-u.y;
              p.preciseTimer=5; p.damageTimer=1;
              log(`🔪 Chef knife sticks to the enemy!`);
              hit=false; break;
            }
            p.owner.activeKnives=Math.max(0,p.owner.activeKnives-1);
          }
          if(p.kind==='firework'){
            explodeFirework(p); hit=true; break;
          }
          if(p.kind==='beer' && didHit && p.owner && projectileHasModifier(p, 'sharing')){
            p.owner.attackDisabled = 0.5;
            scrambleDrunkMovement(p.owner);
            log(`🍺 Sharing makes ${DEFS[p.owner.defKey].name} stagger after the hit!`);
          }
          if(isCar && p.pierce){
            p.hitUnits[u.id] = p.highway ? 0.35 : Infinity;
          } else {
            hit=true;
            break;
          }
        }
      }
      if(hit) projectiles.splice(i,1);
    }

    // ---- ping pong balls ----
    updateBalls(dt);

    // ---- glass spikes ----
    for(let i=glassSpikes.length-1;i>=0;i--){
      const spike = glassSpikes[i];
      spike.life -= dt;
      spike.hitTimer -= dt;
      for(let projectileIndex=projectiles.length-1;projectileIndex>=0;projectileIndex--){
        const projectile = projectiles[projectileIndex];
        if(projectile.kind==='car' && Math.hypot(projectile.x-spike.x,projectile.y-spike.y)<spike.r+projectile.r){
          projectiles.splice(projectileIndex,1);
          addFloater(spike.x,spike.y,'POP!','#9de7ff');
          log(`🛞 Glass shards pop a car tire!`, true);
        }
      }
      if(spike.hitTimer<=0){
        for(const team of teams){
          for(const unit of aliveUnits(team)){
            if(Math.hypot(unit.x-spike.x, unit.y-spike.y) < unit.r+18){
              const spikeDamage = unit===spike.owner ? 12 : 20;
              dealDamage(spike.owner, unit, spikeDamage, null, true);
            }
          }
        }
        spike.hitTimer = 0.5;
      }
      if(spike.life<=0) glassSpikes.splice(i,1);
    }

    for(let i=seeds.length-1;i>=0;i--){
      const seed = seeds[i];
      seed.growTimer -= dt;
      if(seed.growTimer<=0){
        const enemyTeam = teams.find(t=>t.id!==seed.team);
        for(const victim of aliveUnits(enemyTeam)){
          if(Math.hypot(victim.x-seed.x, victim.y-seed.y) < victim.r+DEFS.gardener.burstRadius){
            dealDamage(seed.owner, victim, DEFS.gardener.burstDamage, null, true);
            if(seed.owner && hasModifier(seed.owner,'thorns')){
              victim.bleedTimer = Math.max(victim.bleedTimer, DEFS.gardener.bleedDuration);
              victim.bleedDps = DEFS.gardener.bleedDps;
              victim.bleedTickTimer = Math.min(victim.bleedTickTimer||0.5, 0.5);
            }
          }
        }
        addFloater(seed.x, seed.y, 'THORNS!', '#8fdb6f');
        log(`🌱 A seed bursts into thorns!`, true);
        seeds.splice(i,1);
      }
    }

    // ---- floaters ----
    for(let i=fireworkBursts.length-1;i>=0;i--){
      fireworkBursts[i].life -= dt;
      if(fireworkBursts[i].life<=0) fireworkBursts.splice(i,1);
    }
    for(let i=forgeSparks.length-1;i>=0;i--){
      forgeSparks[i].life-=dt;
      if(forgeSparks[i].life<=0) forgeSparks.splice(i,1);
    }
    for(let i=floaters.length-1;i>=0;i--){
      const f = floaters[i];
      f.y += f.vy*dt; f.life -= dt;
      if(f.life<=0) floaters.splice(i,1);
    }

    // ---- lightning bolts ----
    for(let i=bolts.length-1;i>=0;i--){
      bolts[i].life -= dt;
      if(bolts[i].life<=0) bolts.splice(i,1);
    }

    // ---- win check ----
    if(gameMode==='timed') return;
    const aDead = teamDefeated(teams[0]);
    const bDead = teamDefeated(teams[1]);
    if(aDead || bDead){
      gameOver = true;
      let winner = aDead ? teams[1] : teams[0];
      if(aDead && bDead){
        const burstWinner = teams.find(team => {
          const leader = team.units.find(u => u.id === team.leaderId);
          return leader && leader.defKey === 'exploding' && leader.bombTriggered && !leader.alive;
        });
        if(burstWinner) winner = burstWinner;
      }
      endGame(winner, aDead && bDead && !winner);
    }
  }

  function updateBalls(dt){
    const dPing = DEFS.pingpong;
    for(const ball of pingBalls){
      ball.x += ball.vx*dt;
      ball.y += ball.vy*dt;

      if(ball.x-ball.r < BOX.left){ ball.x=BOX.left+ball.r; ball.vx=Math.abs(ball.vx); }
      if(ball.x+ball.r > BOX.right){ ball.x=BOX.right-ball.r; ball.vx=-Math.abs(ball.vx); }
      if(ball.y-ball.r < BOX.top){ ball.y=BOX.top+ball.r; ball.vy=Math.abs(ball.vy); }
      if(ball.y+ball.r > BOX.bottom){ ball.y=BOX.bottom-ball.r; ball.vy=-Math.abs(ball.vy); }

      if(ball.hitCd>0) ball.hitCd -= dt;
      if(ball.boostCd>0) ball.boostCd -= dt;

      const enemyTeam = teams.find(t=>t.id!==ball.team);
      if(enemyTeam){
        for(const u of aliveUnits(enemyTeam)){
          if(u.invincible) continue;
          const dx=u.x-ball.x, dy=u.y-ball.y;
          const dd = Math.hypot(dx,dy) || 0.0001;
          if(dd < u.r+ball.r){
            const nx=dx/dd, ny=dy/dd;
            const vn = ball.vx*nx+ball.vy*ny;
            ball.vx -= 2*vn*nx; ball.vy -= 2*vn*ny;
            const overlap = (u.r+ball.r) - dd;
            ball.x -= nx*overlap; ball.y -= ny*overlap;
            if(ball.hitCd<=0){
              const baseSpeed = dPing.ballSpeed;
              const currentSpeed = Math.hypot(ball.vx, ball.vy);
              const speedRatio = currentSpeed / baseSpeed;
              const damage = ball.dmg + (hasModifier(ball.owner, 'deadlyVelocity') ? Math.max(0, speedRatio-1)*50 : 0);
              dealDamage(ball.owner, u, damage, null, true);
              if(hasModifier(ball.owner, 'deadlyVelocity')){
                const knockbackScale = Math.max(1, speedRatio);
                applyKnockback(ball.owner, u, {x:ball.vx*knockbackScale,y:ball.vy*knockbackScale});
              } else {
                applyKnockback(ball.owner, u, {x:ball.vx,y:ball.vy});
              }
              ball.hitCd = 0.35;
            }
            break;
          }
        }
      }

      if(ball.owner && ball.owner.alive && ball.boostCd<=0){
        const dx=ball.owner.x-ball.x, dy=ball.owner.y-ball.y;
        const dd = Math.hypot(dx,dy) || 0.0001;
        if(dd < ball.owner.r+ball.r){
          const nx=dx/dd, ny=dy/dd;
          const vn = ball.vx*nx+ball.vy*ny;
          ball.vx -= 2*vn*nx; ball.vy -= 2*vn*ny;
          ball.vx *= dPing.ballSpeedMult; ball.vy *= dPing.ballSpeedMult;
          const spd = Math.hypot(ball.vx,ball.vy);
          const MAXSPD = 2400;
          if(spd>MAXSPD){ ball.vx = ball.vx/spd*MAXSPD; ball.vy = ball.vy/spd*MAXSPD; }
          ball.dmg += dPing.ballDmgGain;
          ball.boostCd = dPing.boostCooldown;
          if(hasModifier(ball.owner, 'masterPong')){
            const target = nearestEnemy(ball.owner, teams.find(t=>t.id!==ball.team));
            if(target){
              const angle = Math.atan2(target.y-ball.y, target.x-ball.x);
              const speed = Math.min(Math.hypot(ball.vx,ball.vy), 2400);
              ball.vx = Math.cos(angle)*speed;
              ball.vy = Math.sin(angle)*speed;
            }
            ball.owner.speedBoostTimer = 0.4;
            ball.owner.invincible = true;
            ball.owner.invulnTimer = Math.max(ball.owner.invulnTimer, 0.4);
          }
          addFloater(ball.owner.x, ball.owner.y-ball.owner.r-16, `SMASH! +${dPing.ballDmgGain} DMG`, '#8be9ff');
          log(`🏓 Ping Pong Guy smashes the ball — now ${Math.round(ball.dmg)} dmg!`, true);
        }
      }
    }
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ------------- render -------------
  function render(){
    const sh=shakeT>0?shakeMag:0;
    const Z=cfg.cine?camZ:1;
    ctx.setTransform(Z/PIX,0,0,Z/PIX,Math.round((Math.random()-0.5)*sh)+(1-Z)*camX/PIX,Math.round((Math.random()-0.5)*sh)+(1-Z)*camY/PIX);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    // floor mat texture: soft center spotlight + faint grid
    ctx.save();
    const spot = ctx.createRadialGradient(canvas.width/2, canvas.height*0.4, 40, canvas.width/2, canvas.height*0.4, canvas.width*0.62);
    spot.addColorStop(0, 'rgba(255,255,255,0.05)');
    spot.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = spot;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    const gridStep = 40;
    for(let gx=BOX.left; gx<=BOX.right; gx+=gridStep){
      ctx.beginPath(); ctx.moveTo(gx,BOX.top); ctx.lineTo(gx,BOX.bottom); ctx.stroke();
    }
    for(let gy=BOX.top; gy<=BOX.bottom; gy+=gridStep){
      ctx.beginPath(); ctx.moveTo(BOX.left,gy); ctx.lineTo(BOX.right,gy); ctx.stroke();
    }
    ctx.restore();

    if(weatherEvents.some(event=>event.kind==='heat')){
      ctx.save();
      ctx.fillStyle='rgba(255,214,75,0.12)';
      ctx.fillRect(BOX.left,BOX.top,BOX.right-BOX.left,BOX.bottom-BOX.top);
      ctx.restore();
    }

    // arena border glow
    ctx.save();
    ctx.strokeStyle = 'rgba(232,176,75,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(BOX.left,BOX.top,BOX.right-BOX.left,BOX.bottom-BOX.top);
    ctx.restore();

    for(const wall of tapeWalls){
      ctx.save();
      ctx.strokeStyle='#e85b5b';
      ctx.shadowColor='#ff8a8a';
      ctx.shadowBlur=10;
      ctx.lineWidth=5;
      ctx.setLineDash([10,6]);
      ctx.beginPath();
      ctx.moveTo(wall.x1,wall.y1);
      ctx.lineTo(wall.x2,wall.y2);
      ctx.stroke();
      ctx.restore();
    }
    for(const team of teams){
      for(const unit of team.units){
        if(unit.alive && unit.defKey==='detective' && unit.detectiveTape){
          ctx.save(); ctx.fillStyle='#ff7777'; ctx.shadowColor='#ff7777'; ctx.shadowBlur=10;
          ctx.beginPath(); ctx.arc(unit.detectiveTape.x,unit.detectiveTape.y,7,0,Math.PI*2); ctx.fill(); ctx.restore();
        }
      }
    }

    // lightning bolts
    for(const b of bolts){
      const bc = b.color || '#c9a7ff';
      ctx.globalAlpha = clamp(b.life/0.25,0,1);
      ctx.strokeStyle = bc;
      ctx.lineWidth = 3;
      ctx.shadowColor = bc;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(b.x1,b.y1);
      ctx.lineTo(b.x2,b.y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // projectiles
    const PROJ_EMOJI = GRAV_PROJ_EMOJI;
    Object.assign(PROJ_EMOJI, {
      sentient:'🤖',
      gwnnBullet:'•',
      nailPolish:'💅',
      caneSwing:'🦯',
      angling:'😡',
      miniMiddlefinger:'🖕',
      glassbeer:'🍻',
      pawn:'♟️',
      knight:'♞',
      bishop:'♝',
      rook:'♜',queen:'♛'
    });
    for(const burst of fireworkBursts){
      const progress = 1 - burst.life/burst.maxLife;
      const radius = 18 + progress*112;
      ctx.save();
      ctx.globalAlpha = clamp(burst.life/burst.maxLife,0,1);
      ctx.strokeStyle = burst.sparks ? '#fff3a1' : '#ff9d45';
      ctx.lineWidth = 5 - progress*3;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(burst.x, burst.y, radius, 0, Math.PI*2);
      ctx.stroke();
      for(let ray=0;ray<12;ray++){
        const angle = ray*Math.PI*2/12;
        const inner = radius*0.55;
        const outer = radius + 14 + (ray%3)*8;
        ctx.beginPath();
        ctx.moveTo(burst.x+Math.cos(angle)*inner, burst.y+Math.sin(angle)*inner);
        ctx.lineTo(burst.x+Math.cos(angle)*outer, burst.y+Math.sin(angle)*outer);
        ctx.stroke();
      }
      ctx.restore();
    }
    for(const spike of glassSpikes){
      ctx.save();
      ctx.globalAlpha = clamp(spike.life/1.2,0,1);
      ctx.fillStyle = '#9de7ff';
      ctx.shadowColor = '#9de7ff';
      ctx.shadowBlur = 12;
      ctx.font = '22px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✦', spike.x, spike.y);
      ctx.restore();
    }
    for(const seed of seeds){
      const growProgress = 1 - clamp(seed.growTimer/seed.maxGrow, 0, 1);
      ctx.save();
      ctx.strokeStyle = '#8fdb6f';
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(seed.x, seed.y, DEFS.gardener.burstRadius*growProgress, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.font = `${18+growProgress*10}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🌱', seed.x, seed.y);
      ctx.restore();
    }
    for(const p of projectiles){
      if(p.cards){
        ctx.save(); ctx.translate(p.x,p.y);
        p.cards.forEach((card,i)=>{
          const offset=i-1.5, x=offset*8, y=Math.abs(offset)*1.5;
          ctx.save(); ctx.translate(x,y); ctx.rotate(offset*0.12);
          ctx.fillStyle='#fffdf6'; ctx.strokeStyle='#252525'; ctx.lineWidth=1;
          ctx.fillRect(-6,-9,12,18); ctx.strokeRect(-6,-9,12,18);
          ctx.fillStyle=card.s===1||card.s===2?'#d33':'#222';
          ctx.font='7px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(card.r===11?'J':card.r===12?'Q':card.r===13?'K':card.r===14?'A':card.r,0,-2);
          ctx.fillText(['♠','♥','♦','♣'][card.s],0,5);
          ctx.restore();
        });
        ctx.restore(); continue;
      }
      if(p.emoji){
        ctx.font=`${p.r*2.6}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.emoji,p.x,p.y); continue;
      }
      if(p.kind==='firework'){
        ctx.save();
        ctx.shadowColor = p.launched ? '#ff9d45' : '#fff3a1';
        ctx.shadowBlur = p.launched ? 16 : 22;
        ctx.globalAlpha = p.launched ? 1 : 0.75;
        ctx.strokeStyle = p.launched ? '#ff9d45' : '#fff3a1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if(p.launched){
          ctx.moveTo(p.x-p.vx*0.06,p.y-p.vy*0.06);
          ctx.lineTo(p.x,p.y);
        } else {
          ctx.arc(p.x,p.y,p.r+5+Math.sin(performance.now()/90)*3,0,Math.PI*2);
        }
        ctx.stroke();
        ctx.restore();
      }
      if(p.kind==='pawn' || p.kind==='knight' || p.kind==='bishop' || p.kind==='rook' || p.kind==='queen'){
        const chessColors = {pawn:'#f1c75b', knight:'#7bdff2', bishop:'#c9a7ff', rook:'#ff8f70', queen:'#ff6fae'};
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 4, 0, Math.PI*2);
        ctx.fillStyle = chessColors[p.kind];
        ctx.globalAlpha = 0.28;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.font = `${p.r*2.2}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(PROJ_EMOJI[p.kind] || '🍺', p.x, p.y);
    }

    // ping pong balls
    for(const ball of pingBalls){
      ctx.font = `${ball.r*2.4}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏓', ball.x, ball.y);
    }

    for(const spark of forgeSparks){
      const progress=1-spark.life/spark.maxLife;
      ctx.save();
      ctx.globalAlpha=clamp(spark.life/spark.maxLife,0,1);
      ctx.fillStyle='#ffcf6b';
      ctx.shadowColor='#fff0a0';
      ctx.shadowBlur=14;
      for(let i=0;i<6;i++){
        const angle=i*Math.PI/3;
        const distance=8+progress*24;
        ctx.beginPath();
        ctx.arc(spark.x+Math.cos(angle)*distance,spark.y+Math.sin(angle)*distance,3,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    // units
    for(const team of teams){
      for(const u of team.units){
        if(!u.alive || u.hideTimer>0) continue;
        const d = DEFS[u.defKey];
        ctx.globalAlpha=(u.alpha!==undefined)?u.alpha:1;
        if(u.swingTimer>0){
          ctx.save();
          const swingColors={blind:'#f0d28a',blacksmith:'#ffcf6b',skeleton:'#c9d0d8',knight:'#9dd7ff',boxing:'#ff8a5b',chihuahua:'#ffb37a',grandmama:'#c9a4ff'};
          ctx.strokeStyle=swingColors[u.swingKind]||'#f0d28a';
          ctx.shadowColor=ctx.strokeStyle;
          ctx.shadowBlur=14;
          ctx.lineWidth=8;
          ctx.beginPath();
          ctx.arc(u.x,u.y,u.r+22,u.swingAngle-Math.PI*110/360,u.swingAngle+Math.PI*110/360);
          ctx.stroke();
          ctx.restore();
          const wpn=MELEE_WEAPON[u.swingKind];
          if(wpn){
            const sp=clamp(1-u.swingTimer/0.2,0,1);
            const wa=u.swingAngle-Math.PI*55/180+sp*Math.PI*110/180;
            ctx.save();
            ctx.translate(u.x+Math.cos(wa)*(u.r+22), u.y+Math.sin(wa)*(u.r+22));
            ctx.rotate(wa+Math.PI/4);
            ctx.font=`${u.r*0.9}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(wpn,0,0);
            ctx.restore();
          }
        }
        if(u.defKey==='blind' && u.blindAlert){
          ctx.font='bold 22px Rubik, sans-serif'; ctx.fillStyle='#fff2a6'; ctx.textAlign='center';
          ctx.fillText('!',u.x,u.y-u.r-26);
        }
        const teamColor = team.id==='A' ? getCss('--teamA') : getCss('--teamB');
        if(gameMode==='timed'){
          ctx.font='bold 11px Rubik, sans-serif';
          ctx.fillStyle='#ff8a5b';
          ctx.textAlign='center';
          ctx.fillText(`${Math.round(u.damageTaken||0)} dmg`,u.x,u.y+u.r+27);
        }
        if(u.defKey==='camera' && (u.cameraFlash>0 || u.cameraRecording>0)){
          const cameraAngle=u.cameraRecordAngle||0;
          const recordProgress=clamp(u.cameraRecording/2,0,1);
          const coneLength=u.cameraFlash>0?1120:720;
          const coneWidth=u.cameraFlash>0?Math.PI/2:(Math.PI/3)*recordProgress;
          ctx.save();
          ctx.globalAlpha=u.cameraFlash>0?0.22:0.12;
          ctx.fillStyle=u.cameraFlash>0?'#fff2a6':'#e35b5b';
          ctx.beginPath();
          ctx.moveTo(u.x,u.y);
          ctx.lineTo(u.x+Math.cos(cameraAngle-coneWidth/2)*coneLength,u.y+Math.sin(cameraAngle-coneWidth/2)*coneLength);
          ctx.lineTo(u.x+Math.cos(cameraAngle+coneWidth/2)*coneLength,u.y+Math.sin(cameraAngle+coneWidth/2)*coneLength);
          ctx.closePath(); ctx.fill(); ctx.restore();
        }

        // body glow ring
        ctx.beginPath();
        ctx.arc(u.x,u.y,u.r+3,0,Math.PI*2);
        ctx.strokeStyle = (u.defKey==='angry' && u.hp/u.maxhp < 0.25) ? '#ff5a5a' : teamColor;
        ctx.lineWidth = 2.4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(u.x,u.y,u.r,0,Math.PI*2);
        ctx.fillStyle = 'rgba(20,15,28,0.9)';
        ctx.fill();

        {
          ctx.font = `${u.r*1.5}px serif`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          if(u.defKey==='canadian'){
            ctx.save(); ctx.translate(u.x,u.y+1); ctx.rotate(performance.now()/90);
            ctx.fillText(d.emoji,0,0); ctx.restore();
          } else if(u.defKey==='cactus'){
            drawCactusSprite(u);
          } else if(GEN_SPR[u.defKey]){
            drawGenericSprite(u,GEN_SPR[u.defKey]);
          } else if(u.defKey==='megaphone'){
            drawGenericSprite(u,u.screamT>0?MEGA_SCREAM_IMG:MEGA_IMG);
          } else if(u.defKey==='camera'){
            drawFacingSprite(u,CAM_IMG,u.vx>0.5);
          } else if(u.defKey==='gwnn'){
            const shooting=u.gwnnBurstTimer>0;
            drawFacingSprite(u, shooting?GWNN_SHOOT_IMG:GWNN_IMG, shooting && (u.gwnnFacing||1)<0);
          } else if(u.defKey==='coolguy'){
            drawCoolSprite(u);
          } else if(u.defKey==='angry'){
            drawAngrySprite(u);
          } else if(u.defKey==='knight'){
            drawKnightSprite(u);
          } else if(u.defKey==='sukuna'){
            drawSukunaSprite(u);
          } else if(u.defKey==='boxing'){
            drawBoxSprite(u);
          } else if(u.defKey==='guyincharge'){
            drawGicSprite(u);
          } else if(u.defKey==='henchman'){
            drawHenchSprite(u);
          } else ctx.fillText(d.emoji, u.x, u.y+1);
        }

        // mini hp bar
        const barW = u.r*2.2;
        const hpFrac = clamp(u.hp/u.maxhp,0,1);
        ctx.fillStyle='#241d30';
        ctx.fillRect(u.x-barW/2, u.y-u.r-10, barW, 5);
        ctx.fillStyle = team.id==='A' ? getCss('--teamA') : getCss('--teamB');
        ctx.fillRect(u.x-barW/2, u.y-u.r-10, barW*hpFrac, 5);

        if(u.defKey==='blacksmith' && u.forgeBonus>0){
          ctx.font = '11px Rubik, sans-serif';
          ctx.fillStyle = '#ffcf6b';
          ctx.fillText(`+${u.forgeBonus}`, u.x, u.y-u.r-18);
        }

        if(u.defKey==='exploding' && u.bombArmed){
          ctx.font = 'bold 12px Rubik, sans-serif';
          ctx.fillStyle = '#ff8a5b';
          ctx.fillText(`BOMB ${Math.max(0,u.bombTimer).toFixed(1)}s`, u.x, u.y-u.r-22);
        }
        if(u.defKey==='woman' && u.womanStacks>0){
          ctx.font = '11px Rubik, sans-serif';
          ctx.fillStyle = '#ff9fcf';
          ctx.fillText(`+${u.womanStacks*12}%`, u.x, u.y-u.r-18);
        }

        if(u.hammeredCutscene){
          ctx.font = '18px serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('🍺🍺🍺🍺🍺', u.x, u.y-u.r-24);
        }


        if(u.defKey==='parry' && u.parryCd>0){
          ctx.font = '10px Rubik, sans-serif';
          ctx.fillStyle = getCss('--dim');
          ctx.fillText(`parry ${u.parryCd.toFixed(1)}s`, u.x, u.y+u.r+14);
        }

        if(u.invincible){
          ctx.beginPath();
          ctx.arc(u.x,u.y,u.r+6,0,Math.PI*2);
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 2;
          ctx.setLineDash([5,4]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    // floaters
    for(const f of floaters){
      ctx.globalAlpha = clamp(f.life/0.9,0,1);
      ctx.font = 'bold 13px Rubik, sans-serif';
      ctx.fillStyle = f.color;
      ctx.textAlign='center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
    drawFx();
    ctx.setTransform(1,0,0,1,0,0);
    if(cfg.cine){
      const gr=ctx.createRadialGradient(100,100,70,100,100,150); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.55)');
      ctx.fillStyle=gr; ctx.fillRect(0,0,200,200);
      if(barT>0){ const h=Math.round(14*Math.min(1,barT*3)); ctx.fillStyle='#000'; ctx.fillRect(0,0,200,h); ctx.fillRect(0,200-h,200,h); }
    }
    screenCtx.imageSmoothingEnabled = true;
    screenCtx.clearRect(0,0,canvas.width,canvas.height);
    screenCtx.drawImage(lo,0,0,canvas.width,canvas.height);
    if(cfg.cine && aberT>0){
      const k=Math.min(1,aberT/0.2); screenCtx.save(); screenCtx.globalCompositeOperation='screen'; screenCtx.globalAlpha=0.28*k;
      screenCtx.drawImage(lo,12*k,0,canvas.width,canvas.height); screenCtx.drawImage(lo,-12*k,2*k,canvas.width,canvas.height); screenCtx.restore();
    }
    if(impactT>0 && impact) drawImpact();
  }

  function hpSummary(team){
    const d = DEFS[team.defKey];
    const aliveList = aliveUnits(team);
    const hp = aliveList.reduce((s,u)=>s+u.hp,0);
    const max = team.units.reduce((s,u)=>s+u.maxhp,0) || d.maxhp;
    const sub = d.key==='henchman'
      ? `${aliveList.length} alive / ${team.spawnedCount} spawned`
      : `${Math.max(0,Math.round(hp))} / ${max} HP`;
    return {hp, max, sub};
  }

  function updateHpUI(){
    const dA = DEFS[teams[0].defKey], dB = DEFS[teams[1].defKey];
    const sumA = hpSummary(teams[0]);
    const sumB = hpSummary(teams[1]);

    document.getElementById('hpNameA').innerHTML = `${dA.emoji} ${dA.name}`;
    document.getElementById('hpNameB').innerHTML = `${dB.name} ${dB.emoji}`;
    document.getElementById('hpBarA').style.width = clamp(sumA.hp/sumA.max*100,0,100)+'%';
    document.getElementById('hpBarB').style.width = clamp(sumB.hp/sumB.max*100,0,100)+'%';

    document.getElementById('hpSubA').textContent = sumA.sub;
    document.getElementById('hpSubB').textContent = sumB.sub;
    const timer=document.getElementById('modeTimer');
    timer.style.display=(gameMode==='timed'||modeKey==='infinite')?'block':'none';
    timer.textContent=gameMode==='timed' ? `TIME ${Math.ceil(modeTimeRemaining)}s` : (modeKey==='infinite' ? `SCORE ${Math.floor(score)} · WAVE ${(teams[1]&&teams[1].wave)||1} · COMBO x${comboN} · BEST ${Math.max(infBest,Math.floor(score))}` : '');
  }

  function endTimedGame(){
    gameOver=true;
    const damageA=teams[0].units.reduce((sum,unit)=>sum+(unit.damageTaken||0),0);
    const damageB=teams[1].units.reduce((sum,unit)=>sum+(unit.damageTaken||0),0);
    const winner=damageA<damageB?teams[0]:damageB<damageA?teams[1]:null;
    const overlay=document.getElementById('overlay');
    document.getElementById('overlayTitle').textContent=winner?`⏱️ Team ${winner.id} Wins!`:'⏱️ Timed Draw';
    document.getElementById('overlaySub').textContent=`Damage taken: Blue ${Math.round(damageA)} · Red ${Math.round(damageB)}`;
    overlay.style.display='flex';
    log(`⏱️ Timed mode ends — Blue ${Math.round(damageA)} vs Red ${Math.round(damageB)} damage taken.`,true);
  }

  let simSpeed=1;
  function loop(ts){
    if(lastTs===null) lastTs=ts;
    const dt = Math.min((ts-lastTs)/1000, 0.033);
    lastTs = ts;
    tickEffects(dt);
    if(hitstop>0) hitstop-=dt;
    else { const sd=(cfg.cine&&slowT>0)?dt*0.35:dt; for(let i=0;i<simSpeed;i++){ update(sd); updateFx(sd); if(!gameOver) updateStats(sd); } }
    render(); 
    updateHpUI();
    updateArenaHover();
    if(!gameOver) rafId = requestAnimationFrame(loop);
  }

  function endGameCore(winnerTeam, draw){
    const overlay = document.getElementById('overlay');
    renderStats(winnerTeam);
    if(modeKey==='infinite'){
      const fs=Math.floor(score), rec=fs>infBest;
      if(rec){ try{localStorage.setItem('bb_best_inf',String(fs));}catch(e){} infBest=fs; }
      document.getElementById('overlayTitle').textContent=`💀 Score ${fs}`;
      document.getElementById('overlaySub').textContent=`Wave ${(teams[1]&&teams[1].wave)||1} · ${infKills} henchmen KO'd · Best ${infBest}${rec?' 🏆 NEW RECORD!':''}`;
      overlay.style.display='flex'; log(`💀 Final score: ${fs}`,true); return;
    }
    if(!winnerTeam){
      document.getElementById('overlayTitle').textContent = 'Double KO';
      document.getElementById('overlaySub').textContent = 'Both fighters went down together.';
      overlay.style.display='flex';
      log('⚔️ Both teams fell — a draw!', true);
      return;
    }
    winnerTeam.units.forEach(u=>{ if(u.alive && u.defKey==='boxing') u.won=true; });
    render();
    const d = DEFS[winnerTeam.defKey];
    document.getElementById('overlayTitle').textContent = `${d.emoji} Team ${winnerTeam.id} Wins!`;
    document.getElementById('overlaySub').textContent = `${d.name} is left standing.`;
    overlay.style.display='flex';
    log(`🏆 ${d.name} (Team ${winnerTeam.id}) wins the brawl!`, true);
  }

  function endGame(winnerTeam,draw){
    endGameCore(winnerTeam,draw);
    if(!cfg.kill || draw || !winnerTeam || !finalKill) return;
    const overlay=document.getElementById('overlay'); overlay.style.display='none';
    const fk=finalKill;
    playBell();
    showKoBanner();
    afterglow(1500,()=>{ hideKoBanner(); playKillScene(fk,winnerTeam,()=>{ overlay.style.display='flex'; }); });
  }

  let punchPoolIdx=0;
  function playPunchSound(){
    if(!cfg.sfx) return;
    try{
      const a=punchPool[punchPoolIdx];
      punchPoolIdx=(punchPoolIdx+1)%punchPool.length;
      a.pause();
      a.currentTime=0;
      a.volume=cfg.sfxVolume/100;
      const p=a.play();
      if(p&&p.catch) p.catch(err=>console.warn('punch.mp3 play blocked:',err));
    }catch(e){ console.warn('punch.mp3 error:',e); }
  }
  function playBell(){
    if(!cfg.sfx) return;
    try{
      if(!guitarAC) guitarAC=new (window.AudioContext||window.webkitAudioContext)();
      if(guitarAC.state==='suspended') guitarAC.resume();
      const a=new Audio('bell.mp3');
      a.playbackRate=0.7;
      a.preservesPitch=false;
      const src=guitarAC.createMediaElementSource(a);
      const boost=guitarAC.createGain();
      boost.gain.value=2*cfg.sfxVolume/100;
      src.connect(boost); boost.connect(guitarAC.destination);
      const p=a.play();
      if(p&&p.catch) p.catch(err=>console.warn('bell.mp3 play blocked:',err));
    }catch(e){ console.warn('bell.mp3 error:',e); }
  }
  function showKoBanner(){
    let b=document.getElementById('koBanner');
    if(!b){
      b=document.createElement('div'); b.id='koBanner';
      b.style.cssText='position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;'+
        'font-family:"Press Start 2P",monospace;font-size:clamp(20px,4vw,44px);color:#ffd166;text-shadow:4px 4px 0 #000;letter-spacing:2px;';
      b.textContent='🔔 K.O.!';
      document.body.appendChild(b);
    }
    b.style.display='block';
  }
  function hideKoBanner(){ const b=document.getElementById('koBanner'); if(b) b.style.display='none'; }
  function playKillScene(fk,winnerTeam,done){
    const sc=document.getElementById('killScene'), g=sc.getContext('2d'); sc.style.display='block';
    const vd=DEFS[fk.v.defKey]||{emoji:'?',name:'???'}, vcol=teamColor(fk.v.team);
    const w=(fk.a&&fk.a.alive&&fk.a.team!==fk.v.team)?fk.a:(winnerTeam.units.find(u=>u.alive)||fk.a||fk.v);
    const wd=DEFS[w.defKey]||vd, wcol=teamColor(w.team);
    const R=36, M=sliceModel(7,0.5,R), CT=0.8, GAP=0.09, sparks=[];
    const flashAt=M.cuts.map((c,i)=>CT+i*GAP), SEP=CT+6*GAP+0.06;
    const t0=performance.now(); let raf, clickable=false, spawned=0, lastN=performance.now();
    const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
    const body=(x,y,al)=>{ g.globalAlpha=Math.max(0,al); g.fillStyle='#1a1424'; g.beginPath(); g.arc(x,y,R,0,7); g.fill(); g.strokeStyle=vcol; g.lineWidth=3; g.stroke(); g.font=`${R*1.25}px serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff'; g.fillText(vd.emoji,x,y+1); g.globalAlpha=1; };
    const wbody=(x,y,r,al)=>{ g.globalAlpha=Math.max(0,al); g.fillStyle='#1a1424'; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.strokeStyle=wcol; g.lineWidth=3; g.stroke(); g.font=`${r*1.25}px serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff'; g.fillText(wd.emoji,x,y+1); g.globalAlpha=1; };
    const txt=(str,x,y,size,col,al)=>{ g.globalAlpha=al===undefined?1:al; g.font=`${size}px "Press Start 2P",monospace`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#000'; g.fillText(str,x+1,y+1); g.fillStyle=col; g.fillText(str,x,y); g.globalAlpha=1; };
    function frame(now){
      const t=(now-t0)/1000, dt=Math.min((now-lastN)/1000,0.05); lastN=now;
      g.setTransform(1,0,0,1,0,0); g.fillStyle='#07050c'; g.fillRect(0,0,200,200);
      let pulse=0, shake=0;
      flashAt.forEach(f=>{ if(t>f&&t<f+0.12) pulse=Math.max(pulse,1-(t-f)/0.12); if(t>f&&t<f+0.15) shake=Math.max(shake,3*(1-(t-f)/0.15)); });
      const zoom=1+0.15*ease(t/1.5)-0.15*ease((t-2.0)/1.1)+pulse*0.035;
      g.setTransform(zoom,0,0,zoom,100*(1-zoom)+(Math.random()-0.5)*shake,96*(1-zoom)+(Math.random()-0.5)*shake);
      const gr=g.createRadialGradient(100,96,5,100,96,90); gr.addColorStop(0,'#2a2040'); gr.addColorStop(1,'#07050c'); g.fillStyle=gr; g.fillRect(-40,-40,280,280);
      // sparks along each fresh cut
      while(spawned<flashAt.length && t>=flashAt[spawned]){
        const cu=M.cuts[spawned]; spawned++;
        for(let k=0;k<14;k++){ const u=(Math.random()*2-1)*R*1.5, a=Math.random()*6.28, v=40+Math.random()*90;
          sparks.push({x:100+Math.cos(cu.a)*u-Math.sin(cu.a)*cu.d,y:92+Math.sin(cu.a)*u+Math.cos(cu.a)*cu.d,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:0.45,c:Math.random()<0.5?'#fff':'#ffd24a'}); }
      }
      if(t<SEP){
        body(100,92,1); drawCutLines(g,M,100,92,R,t-CT,GAP,0.06,2);
        txt(vd.name.toUpperCase(),100,142,7,'#ffd24a',1-ease((t-CT)/0.4)*0.6);
      } else if(t<SEP+1.1){
        drawPieces(g,M,100,92,R,1-Math.pow(1-Math.min(1,(t-SEP)/1.0),2),body);
      }
      for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i]; p.l-=dt; if(p.l<=0){ sparks.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt; g.globalAlpha=Math.min(1,p.l*3); g.fillStyle=p.c; g.fillRect(Math.round(p.x),Math.round(p.y),2,2); g.globalAlpha=1; }
      const WT=SEP+0.6;
      if(t>=WT){
        const q=ease((t-WT)/0.8), cy=90+(1-q)*30;
        g.save(); g.translate(100,90); g.rotate(t*0.35); g.fillStyle=wcol; g.globalAlpha=0.14*q;
        for(let k=0;k<12;k++){ g.rotate(Math.PI/6); g.beginPath(); g.moveTo(0,0); g.lineTo(150,-14); g.lineTo(150,14); g.closePath(); g.fill(); }
